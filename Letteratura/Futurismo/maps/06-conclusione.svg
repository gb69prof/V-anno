<rect class="y" x="891" y="155" width="240" height="100"/><text x="918" y="196" class="h">Poetiche</text><text x="918" y="226" class="s">forme nuove</text>
<path class="l" d="M1011 255v105H850"/><text x="1026" y="317" class="v">si prova nelle</text>
