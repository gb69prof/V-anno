<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">Conclusione sul Futurismo</title><desc id="d">Il contesto produce la rottura, che cambia la visione e genera poetiche; le opere verificano il programma e l'eredità critica conduce a un'avanguardia responsabile.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6Z" fill="#171714"/></marker><style>.n{fill:#fffdf7;stroke:#171714;stroke-width:3}.r{fill:#d62f22;stroke:#171714;stroke-width:3}.y{fill:#f4c447;stroke:#171714;stroke-width:3}.h{font:800 22px Arial;fill:#171714}.w{font:800 22px Arial;fill:#fff}.s{font:17px Arial;fill:#393631}.l{stroke:#171714;stroke-width:3;fill:none;marker-end:url(#a)}.v{font:700 15px Arial;fill:#8f1d16}</style></defs>
