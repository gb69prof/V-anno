<rect class="y" x="680" y="555" width="430" height="135"/><text x="720" y="607" class="h">AVANGUARDIA RESPONSABILE</text><text x="720" y="640" class="s">innovare senza adorare la forza</text><text x="720" y="666" class="s">pluralità · cura · giudizio</text>
