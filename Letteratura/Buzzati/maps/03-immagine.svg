<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">L’immagine del mondo</title><desc id="d">Segnali, tempo attivo, spazi e mistero convergono nella normalità sotto allarme; paura e desiderio deformano l’interpretazione.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#d8a657"/></marker><style>.n{fill:#253632;stroke:#94aaa2;stroke-width:2}.c{fill:#a7583f;stroke:#f3efe6;stroke-width:3}.l{stroke:#d8a657;stroke-width:3;fill:none;marker-end:url(#a)}.tx{fill:#fff;font:700 23px Georgia,serif;text-anchor:middle}.sm{fill:#e8e1d2;font:17px Arial,sans-serif;text-anchor:middle}.v{fill:#17201f;stroke:#d8a657;stroke-width:2}.vt{fill:#d8a657;font:700 16px Arial,sans-serif;text-anchor:middle}</style></defs><rect width="1200" height="760" rx="35" fill="#17201f"/><path class="l" d="M230 150C365 190 450 255 515 320"/><path class="l" d="M600 155v150"/><path class="l" d="M970 150C835 190 750 255 685 320"/><path class="l" d="M755 380h180"/><path class="l" d="M600 450v140"/><path class="l" d="M445 380H265"/><g class="v"><rect x="325" y="205" width="155" height="34" rx="17"/><rect x="525" y="215" width="150" height="34" rx="17"/><rect x="720" y="205" width="155" height="34" rx="17"/><rect x="800" y="345" width="150" height="34" rx="17"/><rect x="515" y="505" width="170" height="34" rx="17"/><rect x="250" y="345" width="160" height="34" rx="17"/></g><g class="vt"><text x="402" y="228">annunciano</text><text x="600" y="238">consuma</text><text x="797" y="228">orientano</text><text x="875" y="368">eccede</text><text x="600" y="528">si deforma in</text><text x="330" y="368">proietta</text></g><g class="n"><rect x="75" y="75" width="310" height="110" rx="24"/><rect x="445" y="75" width="310" height="110" rx="24"/><rect x="815" y="75" width="310" height="110" rx="24"/><rect x="855" y="325" width="290" height="110" rx="24"/><rect x="445" y="590" width="310" height="110" rx="24"/><rect x="55" y="325" width="290" height="110" rx="24"/></g><rect class="c" x="445" y="305" width="310" height="145" rx="35"/><g class="tx"><text x="230" y="120">Segnali ambigui</text><text x="600" y="120">Tempo attivo</text><text x="970" y="120">Spazi-dispositivo</text><text x="1000" y="370">Mistero</text><text x="600" y="635">Interpretazione</text><text x="200" y="370">Paura e desiderio</text><text x="600" y="355">NORMALITÀ</text><text x="600" y="387">SOTTO ALLARME</text></g><g class="sm"><text x="230" y="152">promessa e minaccia</text><text x="600" y="152">ripete e accelera</text><text x="970" y="152">limitano le scelte</text><text x="1000" y="402">non si chiude del tutto</text><text x="600" y="667">fragile e tardiva</text><text x="200" y="402">precedono la lettura</text><text x="600" y="420">il reale eccede la superficie</text></g></svg>
