<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Conclusione: la catena interpretativa</title><desc id="d">Ordine ricevuto conduce alle fratture, poi alla realtà sotto allarme, alla cronaca dell’impossibile, alle opere-dispositivo e infine alla vigilanza sul tempo e sulla scelta.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#d8a657"/></marker><style>.n{fill:#253632;stroke:#94aaa2;stroke-width:2}.c{fill:#a7583f;stroke:#f3efe6;stroke-width:3}.l{stroke:#d8a657;stroke-width:3;fill:none;marker-end:url(#a)}.tx{fill:#fff;font:700 22px Georgia,serif;text-anchor:middle}.sm{fill:#e8e1d2;font:16px Arial,sans-serif;text-anchor:middle}.v{fill:#17201f;stroke:#d8a657;stroke-width:2}.vt{fill:#d8a657;font:700 15px Arial,sans-serif;text-anchor:middle}</style></defs><rect width="1200" height="760" rx="35" fill="#17201f"/><path class="l" d="M205 180v120"/><path class="l" d="M350 360h135"/><path class="l" d="M600 305V185"/><path class="l" d="M715 360h135"/><path class="l" d="M995 415v125"/><path class="l" d="M850 600H715"/><g class="v"><rect x="130" y="220" width="150" height="34" rx="17"/><rect x="365" y="325" width="150" height="34" rx="17"/><rect x="525" y="225" width="150" height="34" rx="17"/><rect x="710" y="325" width="165" height="34" rx="17"/><rect x="920" y="465" width="150" height="34" rx="17"/><rect x="685" y="565" width="165" height="34" rx="17"/></g><g class="vt"><text x="205" y="243">mette in crisi</text><text x="440" y="348">modificano</text><text x="600" y="248">richiede</text><text x="792" y="348">si prova nelle</text><text x="995" y="488">lascia</text><text x="767" y="588">riapre</text></g><g class="n"><rect x="55" y="70" width="300" height="110" rx="24"/><rect x="55" y="305" width="300" height="110" rx="24"/><rect x="450" y="70" width="300" height="115" rx="24"/><rect x="850" y="305" width="300" height="110" rx="24"/><rect x="850" y="540" width="300" height="115" rx="24"/></g><rect class="c" x="450" y="305" width="300" height="145" rx="35"/><g class="tx"><text x="205" y="115">Ordine ricevuto</text><text x="205" y="350">Fratture</text><text x="600" y="115">Realtà sotto allarme</text><text x="600" y="350">CRONACA</text><text x="600" y="382">DELL’IMPOSSIBILE</text><text x="1000" y="350">Opere-dispositivo</text><text x="1000" y="585">Vigilanza</text></g><g class="sm"><text x="205" y="147">il futuro promette senso</text><text x="205" y="382">perdita, lavoro, guerra</text><text x="600" y="148">tempo, segnali, mistero</text><text x="600" y="416">chiarezza, suspense, immagini</text><text x="1000" y="382">promessa contro limite</text><text x="1000" y="618">tempo, scelta, responsabilità</text></g></svg>
