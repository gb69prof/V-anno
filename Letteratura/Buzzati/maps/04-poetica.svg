height="110" rx="24"/><rect x="55" y="325" width="290" height="110" rx="24"/></g><rect class="c" x="445" y="305" width="310" height="145" rx="35"/><g class="tx"><text x="225" y="120">Lingua chiara</text><text x="600" y="120">Dettaglio concreto</text><text x="975" y="120">Suspense</text><text x="1000" y="370">Simbolo plurale</text><text x="600" y="635">Parola + immagine</text><text x="200" y="370">Commozione</text><text x="600" y="355">CRONACA</text><text x="600" y="387">DELL’IMPOSSIBILE</text></g><g class="sm"><text x="225" y="152">il tono non si scompone</text><text x="600" y="152">costruisce credibilità</text><text x="975" y="152">monta l’attesa</text><text x="1000" y="402">non chiude il mistero</text><text x="600" y="667">narrazione intermediale</text><text x="200" y="402">effetto e rischio</text><text x="600" y="420">l’anomalia entra nel quotidiano</text></g></svg>
