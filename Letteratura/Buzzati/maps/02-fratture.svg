<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Le fratture della vita</title><desc id="d">Perdita, redazione, guerra, crollo dei miti e nuovi media convergono nella coscienza del limite, che trasforma l’ordine in domanda.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#d8a657"/></marker><style>.n{fill:#253632;stroke:#94aaa2;stroke-width:2}.c{fill:#a7583f;stroke:#f3efe6;stroke-width:3}.l{stroke:#d8a657;stroke-width:3;fill:none;marker-end:url(#a)}.tx{fill:#fff;font:700 23px Georgia,serif;text-anchor:middle}.sm{fill:#e8e1d2;font:17px Arial,sans-serif;text-anchor:middle}.v{fill:#17201f;stroke:#d8a657;stroke-width:2}.vt{fill:#d8a657;font:700 16px Arial,sans-serif;text-anchor:middle}</style></defs><rect width="1200" height="760" rx="35" fill="#17201f"/><path class="l" d="M230 155C360 195 445 260 510 325"/><path class="l" d="M600 160v150"/><path class="l" d="M970 155C840 195 755 260 690 325"/><path class="l" d="M755 380h170"/><path class="l" d="M600 450v135"/><path class="l" d="M445 380H275"/><g class="v"><rect x="325" y="210" width="150" height="34" rx="17"/><rect x="525" y="220" width="150" height="34" rx="17"/><rect x="725" y="210" width="150" height="34" rx="17"/><rect x="790" y="345" width="145" height="34" rx="17"/><rect x="525" y="505" width="150" height="34" rx="17"/><rect x="265" y="345" width="145" height="34" rx="17"/></g><g class="vt"><text x="400" y="233">anticipa</text><text x="600" y="243">allena</text><text x="800" y="233">smentisce</text><text x="862" y="368">provoca</text><text x="600" y="528">si traduce in</text><text x="337" y="368">trasforma</text></g><g class="n"><rect x="75" y="80" width="310" height="105" rx="24"/><rect x="445" y="80" width="310" height="105" rx="24"/><rect x="815" y="80" width="310" height="105" rx="24"/><rect x="845" y="325" width="300" height="110" rx="24"/><rect x="445" y="585" width="310" height="110" rx="24"/><rect x="55" y="325" width="300" height="110" rx="24"/></g><rect class="c" x="445" y="310" width="310" height="140" rx="35"/><g class="tx"><text x="230" y="125">Perdita del padre</text><text x="600" y="125">Redazione</text><text x="970" y="125">Guerra</text><text x="995" y="370">Crollo dei miti</text><text x="600" y="630">Nuovi media</text><text x="205" y="370">Successo</text><text x="600" y="360">COSCIENZA DEL LIMITE</text></g><g class="sm"><text x="230" y="155">il tempo può interrompersi</text><text x="600" y="155">precisione e ripetizione</text><text x="970" y="155">ordine e distruzione</text><text x="995" y="400">1943–45</text><text x="600" y="660">parola, pittura, fumetto</text><text x="205" y="400">non cancella l’inquietudine</text><text x="600" y="395">l’ordine diventa domanda</text></g></svg>
