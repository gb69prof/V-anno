<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Le opere decisive</title><desc id="d">Deserto, racconti, Grande ritratto e Poema a fumetti mettono alla prova l’attesa attraverso fortezza, procedura, macchina e porta.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#d8a657"/></marker><style>.n{fill:#253632;stroke:#94aaa2;stroke-width:2}.c{fill:#a7583f;stroke:#f3efe6;stroke-width:3}.l{stroke:#d8a657;stroke-width:3;fill:none;marker-end:url(#a)}.tx{fill:#fff;font:700 22px Georgia,serif;text-anchor:middle}.sm{fill:#e8e1d2;font:16px Arial,sans-serif;text-anchor:middle}.v{fill:#17201f;stroke:#d8a657;stroke-width:2}.vt{fill:#d8a657;font:700 16px Arial,sans-serif;text-anchor:middle}</style></defs><rect width="1200" height="760" rx="35" fill="#17201f"/><path class="l" d="M225 155C360 195 445 260 515 325"/><path class="l" d="M600 160v150"/><path class="l" d="M975 155C840 195 755 260 685 325"/><path class="l" d="M755 380h180"/><path class="l" d="M600 450v135"/><path class="l" d="M445 380H265"/><g class="v"><rect x="320" y="210" width="165" height="34" rx="17"/><rect x="525" y="220" width="150" height="34" rx="17"/><rect x="715" y="210" width="170" height="34" rx="17"/><rect x="795" y="345" width="155" height="34" rx="17"/><rect x="525" y="505" width="150" height="34" rx="17"/><rect x="245" y="345" width="170" height="34" rx="17"/></g><g class="vt"><text x="402" y="233">trasforma in</text><text x="600" y="243">comprime</text><text x="800" y="233">interroga</text><text x="872" y="368">riscrive</text><text x="600" y="528">mostrano</text><text x="330" y="368">incarna</text></g><g class="n"><rect x="55" y="80" width="340" height="110" rx="24"/><rect x="430" y="80" width="340" height="110" rx="24"/><rect x="805" y="80" width="340" height="110" rx="24"/><rect x="840" y="325" width="310" height="110" rx="24"/><rect x="430" y="585" width="340" height="110" rx="24"/><rect x="50" y="325" width="310" height="110" rx="24"/></g><rect class="c" x="445" y="305" width="310" height="145" rx="35"/><g class="tx"><text x="225" y="125">Il deserto dei Tartari</text><text x="600" y="125">Racconti</text><text x="975" y="125">Il grande ritratto</text><text x="995" y="370">Poema a fumetti</text><text x="600" y="630">Limite della promessa</text><text x="205" y="370">Attesa e tempo</text><text x="600" y="355">OPERE</text><text x="600" y="387">COME DISPOSITIVI</text></g><g class="sm"><text x="225" y="157">fortezza e occasione</text><text x="600" y="157">procedure sotto pressione</text><text x="975" y="157">macchina e identità</text><text x="995" y="402">porta, mito, immagini</text><text x="600" y="662">nessun sistema vince la perdita</text><text x="205" y="402">problema comune</text><text x="600" y="420">la poetica diventa conflitto</text></g></svg>
