<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Il mondo precedente</title><desc id="d">Borghesia, Milano, Dolomiti, giornale e istituzioni convergono nella promessa di ordine; questa produce attesa e mette in crisi il controllo del tempo.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#d8a657"/></marker><style>.n{fill:#253632;stroke:#94aaa2;stroke-width:2}.c{fill:#a7583f;stroke:#f3efe6;stroke-width:3}.l{stroke:#d8a657;stroke-width:3;fill:none;marker-end:url(#a)}.tx{fill:#fff;font:700 23px Georgia,serif;text-anchor:middle}.sm{fill:#e8e1d2;font:17px Arial,sans-serif;text-anchor:middle}.v{fill:#17201f;stroke:#d8a657;stroke-width:2}.vt{fill:#d8a657;font:700 16px Arial,sans-serif;text-anchor:middle}</style></defs><rect width="1200" height="760" rx="35" fill="#17201f"/><path class="l" d="M245 145C390 180 450 250 515 318"/><path class="l" d="M600 145v165"/><path class="l" d="M955 145C810 180 750 250 685 318"/><path class="l" d="M755 380h190"/><path class="l" d="M600 445v145"/><path class="l" d="M445 380H255"/><g class="v"><rect x="332" y="196" width="150" height="34" rx="17"/><rect x="525" y="220" width="150" height="34" rx="17"/><rect x="718" y="196" width="150" height="34" rx="17"/><rect x="797" y="345" width="145" height="34" rx="17"/><rect x="525" y="505" width="150" height="34" rx="17"/><rect x="258" y="345" width="145" height="34" rx="17"/></g><g class="vt"><text x="407" y="219">trasmette</text><text x="600" y="243">organizza</text><text x="793" y="219">oltrepassano</text><text x="869" y="368">produce</text><text x="600" y="528">mette in crisi</text><text x="330" y="368">misura</text></g><g class="n"><rect x="90" y="70" width="310" height="110" rx="24"/><rect x="445" y="70" width="310" height="110" rx="24"/><rect x="800" y="70" width="310" height="110" rx="24"/><rect x="850" y="325" width="280" height="110" rx="24"/><rect x="445" y="590" width="310" height="110" rx="24"/><rect x="70" y="325" width="280" height="110" rx="24"/></g><g class="c"><rect x="445" y="310" width="310" height="140" rx="35"/></g><g class="tx"><text x="245" y="115">Borghesia colta</text><text x="600" y="115">Milano moderna</text><text x="955" y="115">Dolomiti</text><text x="990" y="370">Attesa</text><text x="600" y="635">Tempo che sfugge</text><text x="210" y="370">Giornale</text><text x="600" y="360">PROMESSA DI ORDINE</text></g><g class="sm"><text x="245" y="145">disciplina e professioni</text><text x="600" y="145">istituzioni e velocità</text><text x="955" y="145">misura oltre l’uomo</text><text x="990" y="400">l’evento darà senso</text><text x="600" y="665">il futuro divora l’oggi</text><text x="210" y="400">fatti, titoli, precisione</text><text x="600" y="395">la realtà sembra controllabile</text></g></svg>
