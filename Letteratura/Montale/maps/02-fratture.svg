iche</text><path class="e" d="M840 140C735 170 715 238 680 306"/><text class="r" x="720" y="205">difende l’autonomia</text><path class="e" d="M360 610C470 575 500 492 530 434"/><text class="r" x="408" y="555">trasfigura</text><path class="e" d="M600 590V442"/><text class="r" x="615" y="525">orienta</text><path class="e" d="M780 405C865 452 930 505 970 575"/><text class="r" x="853" y="480">confluisce in</text></svg>
