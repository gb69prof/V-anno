<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="t d">
<title id="t">Conclusione del percorso su Gadda</title><desc id="d">Mondo precedente, fratture, immagine del mondo, poetica e opere confluiscono in una ragione critica e in un’etica dei nessi, applicabili alle semplificazioni del presente e alla domanda su come agire senza tradire la complessità.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#39464b"/></marker><style>.n{fill:#fff;stroke:#536168;stroke-width:2}.c{fill:#39464b;stroke:#20292d;stroke-width:2}.h{font:700 25px Georgia,serif;fill:#202529}.w{font:700 27px Georgia,serif;fill:#fff}.s{font:18px system-ui;fill:#4f585b}.r{font:700 17px system-ui;fill:#39464b}.e{fill:none;stroke:#39464b;stroke-width:4;marker-end:url(#a)}</style></defs>
<rect width="1400" height="900" fill="#e7eaeb"/><text x="70" y="68" class="h">06 · Conclusione</text>
<rect x="70" y="125" width="250" height="115" rx="18" class="n"/><text x="195" y="172" text-anchor="middle" class="h">Mondo ordinato</text><text x="195" y="209" text-anchor="middle" class="s">promette controllo</text>
<rect x="390" y="125" width="250" height="115" rx="18" class="n"/><text x="515" y="172" text-anchor="middle" class="h">Fratture</text><text x="515" y="209" text-anchor="middle" class="s">smentiscono i modelli</text>
<rect x="760" y="125" width="250" height="115" rx="18" class="n"/><text x="885" y="172" text-anchor="middle" class="h">Visione</text><text x="885" y="209" text-anchor="middle" class="s">riconosce le concause</text>
<rect x="1080" y="125" width="250" height="115" rx="18" class="n"/><text x="1205" y="172" text-anchor="middle" class="h">Poetica</text><text x="1205" y="209" text-anchor="middle" class="s">rende plurale la lingua</text>
<rect x="480" y="350" width="440" height="125" rx="22" class="c"/><text x="700" y="400" text-anchor="middle" class="w">Opere come verifica</text><text x="700" y="439" text-anchor="middle" class="w">il groviglio diventa forma</text>
<rect x="140" y="610" width="360" height="120" rx="20" class="n"/><text x="320" y="658" text-anchor="middle" class="h">Ragione critica</text><text x="320" y="696" text-anchor="middle" class="s">verità fondata ma parziale</text>
<rect x="520" y="610" width="360" height="120" rx="20" class="c"/><text x="700" y="658" text-anchor="middle" class="w">Etica dei nessi</text><text x="700" y="696" text-anchor="middle" class="w">graduare le responsabilità</text>
<rect x="900" y="610" width="360" height="120" rx="20" class="n"/><text x="1080" y="658" text-anchor="middle" class="h">Presente</text><text x="1080" y="696" text-anchor="middle" class="s">interroga slogan e algoritmi</text>
<rect x="390" y="790" width="620" height="80" rx="20" class="c"/><text x="700" y="840" text-anchor="middle" class="w">Come semplificare senza tradire la complessità?</text>
