<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="t d">
<title id="t">La poetica di Gadda</title><desc id="d">La realtà plurale richiede plurilinguismo; registri e lingue confluiscono nel pastiche, mentre digressione, accumulo e grottesco seguono e smascherano i nessi; il non finito mantiene aperta l’indagine e conduce alle opere.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#7a5b2e"/></marker><style>.n{fill:#fff;stroke:#78694c;stroke-width:2}.c{fill:#7a5b2e;stroke:#513d20;stroke-width:2}.h{font:700 26px Georgia,serif;fill:#202529}.w{font:700 28px Georgia,serif;fill:#fff}.s{font:19px system-ui;fill:#4f585b}.r{font:700 17px system-ui;fill:#7a5b2e}.e{fill:none;stroke:#7a5b2e;stroke-width:4;marker-end:url(#a)}</style></defs>
<rect width="1400" height="900" fill="#eee9df"/><text x="70" y="68" class="h">04 · La poetica</text>
<rect x="470" y="85" width="460" height="120" rx="22" class="c"/><text x="700" y="135" text-anchor="middle" class="w">Realtà plurale</text><text x="700" y="174" text-anchor="middle" class="w">chiede una lingua plurale</text>
<rect x="65" y="315" width="300" height="118" rx="18" class="n"/><text x="215" y="362" text-anchor="middle" class="h">Dialetti</text><text x="215" y="400" text-anchor="middle" class="s">geografia · classe · relazione</text>
<rect x="395" y="315" width="300" height="118" rx="18" class="n"/><text x="545" y="362" text-anchor="middle" class="h">Tecniscismi</text><text x="545" y="400" text-anchor="middle" class="s">precisione · sapere · ironia</text>
<rect x="725" y="315" width="300" height="118" rx="18" class="n"/><text x="875" y="362" text-anchor="middle" class="h">Registri sociali</text><text x="875" y="400" text-anchor="middle" class="s">alto · basso · burocratico</text>
<rect x="1055" y="315" width="300" height="118" rx="18" class="n"/><text x="1205" y="362" text-anchor="middle" class="h">Neologismi</text><text x="1205" y="400" text-anchor="middle" class="s">deformano e rivelano</text>
<rect x="475" y="515" width="450" height="120" rx="22" class="c"/><text x="700" y="564" text-anchor="middle" class="w">PASTICHE</text><text x="700" y="603" text-anchor="middle" class="w">mimesi · conoscenza · satira · etica</text>
<rect x="90" y="710" width="350" height="110" rx="18" class="n"/><text x="265" y="756" text-anchor="middle" class="h">Digressione e accumulo</text><text x="265" y="793" text-anchor="middle" class="s">seguono i nessi laterali</text>
<rect x="525" y="710" width="350" height="110" rx="18" class="n"/><text x="700" y="756" text-anchor="middle" class="h">Grottesco</text><text x="700" y="793" text-anchor="middle" class="s">smaschera la facciata</text>
<rect x="960" y="710" width="350" height="110" rx="18" class="n"/><text x="1135" y="756" text-anchor="middle" class="h">Non finito</text><text x="1135" y="793" text-anchor="middle" class="s">mantiene aperta l’indagine</text>
<path d="M570 205L250 315M650 205L565 315M750 205L855 315M830 205L1170 315M215 433L555 515M545 433L620 515M875 433L780 515M1205 433L845 515M575 635L340 710M700 635L700 710M825 635L1065 710" class="e"/><text x="350" y="265" class="r">si articola in</text><text x="580" y="265" class="r">usa</text><text x="820" y="265" class="r">confligge in</text><text x="1010" y="265" class="r">produce</text><text x="330" y="500" class="r">confluiscono</text><text x="880" y="500" class="r">confluiscono</text>
