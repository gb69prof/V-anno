<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="t d">
<title id="t">Le fratture della vita di Gadda</title><desc id="d">Villa e dissesto, guerra e prigionia, morte del fratello, doppia formazione, morte della madre e rapporto contraddittorio col fascismo convergono nella crisi delle spiegazioni lineari.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#71433d"/></marker><style>.n{fill:#fff;stroke:#755e59;stroke-width:2}.c{fill:#71433d;stroke:#492b27;stroke-width:2}.h{font:700 26px Georgia,serif;fill:#202529}.w{font:700 27px Georgia,serif;fill:#fff}.s{font:19px system-ui;fill:#4f585b}.r{font:700 17px system-ui;fill:#71433d}.e{fill:none;stroke:#71433d;stroke-width:4;marker-end:url(#a)}</style></defs>
<rect width="1400" height="900" fill="#eee7df"/><text x="70" y="68" class="h">02 · Le fratture della vita</text>
<rect x="480" y="90" width="440" height="120" rx="22" class="c"/><text x="700" y="140" text-anchor="middle" class="w">Ordine ricevuto</text><text x="700" y="178" text-anchor="middle" class="w">famiglia · patria · efficienza</text>
<rect x="55" y="320" width="290" height="118" rx="18" class="n"/><text x="200" y="368" text-anchor="middle" class="h">Villa e dissesto</text><text x="200" y="406" text-anchor="middle" class="s">prestigio diventa costo</text>
<rect x="385" y="320" width="290" height="118" rx="18" class="n"/><text x="530" y="368" text-anchor="middle" class="h">Guerra e Celle</text><text x="530" y="406" text-anchor="middle" class="s">eroismo diventa impotenza</text>
<rect x="725" y="320" width="290" height="118" rx="18" class="n"/><text x="870" y="368" text-anchor="middle" class="h">Morte di Enrico</text><text x="870" y="406" text-anchor="middle" class="s">lutto · colpa · memoria</text>
<rect x="1055" y="320" width="290" height="118" rx="18" class="n"/><text x="1200" y="368" text-anchor="middle" class="h">Tecnica e filosofia</text><text x="1200" y="406" text-anchor="middle" class="s">identità e saperi plurali</text>
<rect x="210" y="570" width="360" height="118" rx="18" class="n"/><text x="390" y="618" text-anchor="middle" class="h">Morte della madre</text><text x="390" y="656" text-anchor="middle" class="s">riapre la casa nella Cognizione</text>
<rect x="830" y="570" width="360" height="118" rx="18" class="n"/><text x="1010" y="618" text-anchor="middle" class="h">Fascismo</text><text x="1010" y="656" text-anchor="middle" class="s">adesione → disillusione → invettiva</text>
<rect x="450" y="755" width="500" height="100" rx="20" class="c"/><text x="700" y="815" text-anchor="middle" class="w">Nessuna causa e nessun io sono isolati</text>
<path d="M590 210L240 320M650 210L550 320M750 210L850 320M810 210L1160 320" class="e"/><text x="325" y="265" class="r">si spezza nella</text><text x="555" y="275" class="r">crolla nella</text><text x="805" y="275" class="r">è ferito dalla</text><text x="1000" y="265" class="r">si complica con</text>
<path d="M200 438C200 520 330 520 365 570M870 438C790 560 535 520 430 570M530 438C545 650 590 680 650 755M1200 438C1190 610 1100 680 830 755M390 688L620 755M1010 688L780 755" class="e"/><text x="235" y="515" class="r">ritorna nella</text><text x="610" y="510" class="r">rende intelligibile</text><text x="520" y="650" class="r">smentisce</text><text x="1050" y="620" class="r">problematizza</text>
