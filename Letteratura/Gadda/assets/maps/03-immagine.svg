<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="t d">
<title id="t">L’immagine del mondo di Gadda</title><desc id="d">Il fatto è uno gnommero di concause; conoscere deforma perché l’osservatore appartiene al sistema; l’io è aperto, responsabilità e male sono relazionali, il barocco è nel mondo e la verità resta fondata ma parziale.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#5a526f"/></marker><style>.n{fill:#fff;stroke:#676079;stroke-width:2}.c{fill:#5a526f;stroke:#3a3547;stroke-width:2}.h{font:700 26px Georgia,serif;fill:#202529}.w{font:700 28px Georgia,serif;fill:#fff}.s{font:19px system-ui;fill:#4f585b}.r{font:700 17px system-ui;fill:#5a526f}.e{fill:none;stroke:#5a526f;stroke-width:4;marker-end:url(#a)}</style></defs>
<rect width="1400" height="900" fill="#ebe8ef"/><text x="70" y="68" class="h">03 · L’immagine del mondo</text>
<rect x="465" y="320" width="470" height="145" rx="72" class="c"/><text x="700" y="380" text-anchor="middle" class="w">GNOMMERO</text><text x="700" y="420" text-anchor="middle" class="w">fatto = nodo di concause</text>
<rect x="90" y="100" width="340" height="115" rx="18" class="n"/><text x="260" y="148" text-anchor="middle" class="h">Sistemi</text><text x="260" y="185" text-anchor="middle" class="s">ogni elemento è relazione</text>
<rect x="960" y="100" width="350" height="115" rx="18" class="n"/><text x="1135" y="148" text-anchor="middle" class="h">Deformazione</text><text x="1135" y="185" text-anchor="middle" class="s">conoscere seleziona e modifica</text>
<rect x="70" y="550" width="350" height="115" rx="18" class="n"/><text x="245" y="598" text-anchor="middle" class="h">Io aperto</text><text x="245" y="635" text-anchor="middle" class="s">memoria · corpo · storia · lingua</text>
<rect x="490" y="690" width="420" height="120" rx="18" class="n"/><text x="700" y="738" text-anchor="middle" class="h">Verità parziale</text><text x="700" y="776" text-anchor="middle" class="s">fondata · correggibile · non totale</text>
<rect x="980" y="550" width="350" height="115" rx="18" class="n"/><text x="1155" y="598" text-anchor="middle" class="h">Responsabilità</text><text x="1155" y="635" text-anchor="middle" class="s">distribuita, non cancellata</text>
<rect x="490" y="90" width="420" height="110" rx="18" class="n"/><text x="700" y="137" text-anchor="middle" class="h">“Barocco è il mondo”</text><text x="700" y="174" text-anchor="middle" class="s">la deformazione è già nelle cose</text>
<path d="M430 170L560 320M970 175L840 320M700 200L700 320M555 465L325 550M845 465L1080 550M610 465L700 690M1080 665L835 710M325 665L565 710" class="e"/><text x="450" y="255" class="r">costituiscono</text><text x="865" y="255" class="r">condiziona</text><text x="718" y="260" class="r">appare come</text><text x="385" y="525" class="r">include</text><text x="930" y="525" class="r">implica</text><text x="610" y="600" class="r">produce</text>
</svg>
