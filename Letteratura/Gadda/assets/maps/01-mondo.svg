<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="t d">
<title id="t">Il mondo precedente di Gadda</title><desc id="d">La promessa borghese di ordine si fonda su scienza, tecnica, famiglia, patria e lingua nazionale; pluralità sociale, modernità e tradizione lombarda ne mostrano i limiti e preparano le fratture.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#7c3434"/></marker><style>.n{fill:#fff;stroke:#58666b;stroke-width:2}.c{fill:#405b66;stroke:#263b43;stroke-width:2}.h{font:700 27px Georgia,serif;fill:#202529}.w{font:700 27px Georgia,serif;fill:#fff}.s{font:19px system-ui;fill:#4f585b}.r{font:700 17px system-ui;fill:#7c3434}.e{fill:none;stroke:#7c3434;stroke-width:4;marker-end:url(#a)}</style></defs>
<rect width="1400" height="900" fill="#e9e4da"/><text x="70" y="68" class="h">01 · Il mondo precedente</text>
<rect x="450" y="95" width="500" height="120" rx="22" class="c"/><text x="700" y="145" text-anchor="middle" class="w">Promessa borghese d’ordine</text><text x="700" y="183" text-anchor="middle" class="w">conoscere · organizzare · progredire</text>
<rect x="60" y="330" width="300" height="118" rx="18" class="n"/><text x="210" y="378" text-anchor="middle" class="h">Scienza e tecnica</text><text x="210" y="416" text-anchor="middle" class="s">fatti · leggi · sistemi</text>
<rect x="400" y="330" width="280" height="118" rx="18" class="n"/><text x="540" y="378" text-anchor="middle" class="h">Famiglia e patria</text><text x="540" y="416" text-anchor="middle" class="s">affetti · dovere · unità</text>
<rect x="720" y="330" width="280" height="118" rx="18" class="n"/><text x="860" y="378" text-anchor="middle" class="h">Lingua nazionale</text><text x="860" y="416" text-anchor="middle" class="s">uniforma una società plurale</text>
<rect x="1040" y="330" width="300" height="118" rx="18" class="n"/><text x="1190" y="378" text-anchor="middle" class="h">Manzoni e Lombardia</text><text x="1190" y="416" text-anchor="middle" class="s">morale · ironia · deformazione</text>
<rect x="235" y="650" width="400" height="120" rx="20" class="n"/><text x="435" y="699" text-anchor="middle" class="h">Modernità plurale</text><text x="435" y="737" text-anchor="middle" class="s">mestieri · dialetti · conflitti</text>
<rect x="765" y="650" width="400" height="120" rx="20" class="c"/><text x="965" y="699" text-anchor="middle" class="w">Ordine insufficiente</text><text x="965" y="737" text-anchor="middle" class="w">prepara le fratture</text>
<path d="M570 215L245 330M650 215L555 330M750 215L845 330M830 215L1155 330" class="e"/><text x="325" y="270" class="r">si affida a</text><text x="555" y="280" class="r">idealizza</text><text x="800" y="280" class="r">cerca</text><text x="1000" y="270" class="r">eredita</text>
<path d="M210 448C210 560 355 560 410 650M540 448C560 565 830 545 905 650M860 448C810 560 600 555 470 650M1190 448C1190 560 1060 565 995 650" class="e"/><text x="230" y="560" class="r">moltiplica</text><text x="650" y="535" class="r">si incrina</text><text x="650" y="600" class="r">nasconde</text><text x="1060" y="560" class="r">corregge</text>
</svg>
