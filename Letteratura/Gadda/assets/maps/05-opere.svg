<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="t d">
<title id="t">Le opere più significative di Gadda</title><desc id="d">Giornale, Meditazione, Cognizione, Pasticciaccio ed Eros e Priapo trasformano rispettivamente esperienza, sistemi, famiglia, delitto e fascismo in cinque forme diverse di indagine del groviglio.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#42634f"/></marker><style>.n{fill:#fff;stroke:#52725f;stroke-width:2}.c{fill:#42634f;stroke:#294333;stroke-width:2}.h{font:700 25px Georgia,serif;fill:#202529}.w{font:700 28px Georgia,serif;fill:#fff}.s{font:18px system-ui;fill:#4f585b}.r{font:700 17px system-ui;fill:#42634f}.e{fill:none;stroke:#42634f;stroke-width:4;marker-end:url(#a)}</style></defs>
<rect width="1400" height="900" fill="#e6ece7"/><text x="70" y="68" class="h">05 · Le opere più significative</text>
<rect x="450" y="85" width="500" height="118" rx="22" class="c"/><text x="700" y="135" text-anchor="middle" class="w">Cinque laboratori</text><text x="700" y="174" text-anchor="middle" class="w">una teoria cambia dentro le forme</text>
<rect x="50" y="300" width="250" height="150" rx="18" class="n"/><text x="175" y="342" text-anchor="middle" class="h">Giornale</text><text x="175" y="378" text-anchor="middle" class="s">verifica l’ideale</text><text x="175" y="408" text-anchor="middle" class="s">attraverso i fatti</text>
<rect x="325" y="300" width="250" height="150" rx="18" class="n"/><text x="450" y="342" text-anchor="middle" class="h">Meditazione</text><text x="450" y="378" text-anchor="middle" class="s">elabora sistemi</text><text x="450" y="408" text-anchor="middle" class="s">e deformazione</text>
<rect x="600" y="300" width="250" height="150" rx="18" class="n"/><text x="725" y="342" text-anchor="middle" class="h">Cognizione</text><text x="725" y="378" text-anchor="middle" class="s">trasfigura casa, madre</text><text x="725" y="408" text-anchor="middle" class="s">e dolore</text>
<rect x="875" y="300" width="250" height="150" rx="18" class="n"/><text x="1000" y="342" text-anchor="middle" class="h">Pasticciaccio</text><text x="1000" y="378" text-anchor="middle" class="s">indaga concause</text><text x="1000" y="408" text-anchor="middle" class="s">con il giallo</text>
<rect x="1150" y="300" width="200" height="150" rx="18" class="n"/><text x="1250" y="342" text-anchor="middle" class="h">Eros e Priapo</text><text x="1250" y="378" text-anchor="middle" class="s">attacca consenso</text><text x="1250" y="408" text-anchor="middle" class="s">e potere</text>
<rect x="350" y="650" width="700" height="130" rx="24" class="c"/><text x="700" y="702" text-anchor="middle" class="w">Costellazione del groviglio</text><text x="700" y="744" text-anchor="middle" class="w">testimonianza · concetto · romanzo · indagine · invettiva</text>
<path d="M590 203L205 300M650 203L465 300M700 203L725 300M760 203L980 300M820 203L1225 300M175 450C180 590 410 575 490 650M450 450L560 650M725 450L700 650M1000 450L840 650M1250 450C1240 590 1010 585 920 650" class="e"/><text x="260" y="545" class="r">misura</text><text x="475" y="555" class="r">pensa</text><text x="710" y="555" class="r">concentra</text><text x="900" y="555" class="r">moltiplica</text><text x="1090" y="545" class="r">smaschera</text>
</svg>
