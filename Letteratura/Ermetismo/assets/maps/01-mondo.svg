<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Il mondo precedente</title><desc id="d">Le certezze ottocentesche entrano in crisi; guerra, Simbolismo, risposte italiane e propaganda preparano la parola ermetica.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#9b8449"/></marker><style>.b{fill:#fbfaf6;stroke:#9b8449;stroke-width:3}.c{fill:#172423}.h{font:700 27px Georgia;fill:#172423}.w{font:700 29px Georgia;fill:#f2efe7}.s{font:20px system-ui;fill:#394a47}.l{stroke:#9b8449;stroke-width:3;fill:none;marker-end:url(#a)}.r{font:700 17px system-ui;fill:#7d493a}</style></defs><rect width="1200" height="760" rx="34" fill="#f2efe7"/><rect class="c" x="390" y="300" width="420" height="150" rx="28"/><text class="w" x="600" y="365" text-anchor="middle">PAROLA ERMETICA</text><text x="600" y="405" text-anchor="middle" style="font:20px system-ui;fill:#d8d2c1">essenziale · allusiva · autonoma</text><rect class="b" x="55" y="70" width="280" height="115" rx="22"/><text class="h" x="195" y="116" text-anchor="middle">Positivismo</text><text class="s" x="195" y="151" text-anchor="middle">fiducia nel progresso</text><rect class="b" x="460" y="55" width="280" height="115" rx="22"/><text class="h" x="600" y="101" text-anchor="middle">Prima guerra</text><text class="s" x="600" y="136" text-anchor="middle">spezza le certezze</text><rect class="b" x="865" y="70" width="280" height="115" rx="22"/><text class="h" x="1005" y="116" text-anchor="middle">Simbolismo</text><text class="s" x="1005" y="151" text-anchor="middle">evoca il nascosto</text><rect class="b" x="65" y="555" width="300" height="120" rx="22"/><text class="h" x="215" y="602" text-anchor="middle">Risposte italiane</text><text class="s" x="215" y="638" text-anchor="middle">Crepuscolari / Futuristi</text><rect class="b" x="450" y="570" width="300" height="120" rx="22"/><text class="h" x="600" y="617" text-anchor="middle">Ungaretti</text><text class="s" x="600" y="653" text-anchor="middle">rifonda il peso della parola</text><rect class="b" x="850" y="555" width="300" height="120" rx="22"/><text class="h" x="1000" y="602" text-anchor="middle">Fascismo</text><text class="s" x="1000" y="638" text-anchor="middle">occupa la lingua pubblica</text><path class="l" d="M335 128C430 130 430 280 500 300"/><text class="r" x="366" y="196">entra in crisi</text><path class="l" d="M600 170V295"/><text class="r" x="616" y="240">rende urgente</text><path class="l" d="M865 128C770 130 770 280 700 300"/><text class="r" x="744" y="196">offre il modello</text><path class="l" d="M365 610C450 605 455 472 510 450"/><text class="r" x="380" y="548">preparano</text><path class="l" d="M600 570V455"/><text class="r" x="616" y="520">insegna</text><path class="l" d="M850 610C760 605 752 472 690 450"/><text class="r" x="744" y="548">provoca la sottrazione</text></svg>
