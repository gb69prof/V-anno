<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">L’immagine del mondo</title><desc id="d">Il mondo opaco produce solitudine, memoria e attesa; la folgorazione apre una rivelazione possibile e un rischio elitario.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#9b8449"/></marker><style>.b{fill:#fbfaf6;stroke:#9b8449;stroke-width:3}.c{fill:#172423}.h{font:700 26px Georgia;fill:#172423}.w{font:700 31px Georgia;fill:#f2efe7}.s{font:19px system-ui;fill:#394a47}.l{stroke:#9b8449;stroke-width:3;fill:none;marker-end:url(#a)}.r{font:700 16px system-ui;fill:#7d493a}</style></defs><rect width="1200" height="760" rx="34" fill="#f2efe7"/><rect class="c" x="420" y="290" width="360" height="145" rx="72"/><text class="w" x="600" y="350" text-anchor="middle">REALTÀ OPACA</text><text x="600" y="390" text-anchor="middle" style="font:19px system-ui;fill:#d8d2c1">il senso si sottrae</text><rect class="b" x="60" y="80" width="275" height="105" rx="22"/><text class="h" x="197" y="125" text-anchor="middle">Solitudine</text><text class="s" x="197" y="157" text-anchor="middle">distanza dagli altri</text><rect class="b" x="462" y="55" width="275" height="105" rx="22"/><text class="h" x="599" y="100" text-anchor="middle">Tempo</text><text class="s" x="599" y="132" text-anchor="middle">consuma e separa</text><rect class="b" x="865" y="80" width="275" height="105" rx="22"/><text class="h" x="1002" y="125" text-anchor="middle">Assenza</text><text class="s" x="1002" y="157" text-anchor="middle">agisce come mancanza</text><rect class="b" x="70" y="555" width="275" height="110" rx="22"/><text class="h" x="207" y="601" text-anchor="middle">Memoria</text><text class="s" x="207" y="634" text-anchor="middle">cerca l’origine</text><rect class="b" x="463" y="585" width="275" height="110" rx="22"/><text class="h" x="600" y="631" text-anchor="middle">Folgorazione</text><text class="s" x="600" y="664" text-anchor="middle">apre un significato</text><rect class="b" x="855" y="555" width="275" height="110" rx="22"/><text class="h" x="992" y="601" text-anchor="middle">Rivelazione</text><text class="s" x="992" y="634" text-anchor="middle">possibilità e rischio elitario</text><path class="l" d="M335 132C420 150 438 232 480 290"/><text class="r" x="373" y="205">rende visibile</text><path class="l" d="M600 160V283"/><text class="r" x="616" y="228">costruisce</text><path class="l" d="M865 132C780 150 762 232 720 290"/><text class="r" x="766" y="205">abita</text><path class="l" d="M207 555C270 490 393 470 480 435"/><text class="r" x="292" y="500">interroga</text><path class="l" d="M600 585V442"/><text class="r" x="616" y="516">illumina</text><path class="l" d="M780 363C876 372 910 476 956 555"/><text class="r" x="845" y="445">può diventare</text></svg>
