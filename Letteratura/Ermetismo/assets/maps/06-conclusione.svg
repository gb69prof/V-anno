<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">Conclusione sull’Ermetismo</title><desc id="d">Dalla crisi nasce la parola essenziale, che conquista responsabilità ma rischia l’elitismo; il dopoguerra riapre la storia e lascia il criterio della necessità formale.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#9b8449"/></marker><style>.b{fill:#fbfaf6;stroke:#9b8449;stroke-width:3}.c{fill:#172423}.h{font:700 24px Georgia;fill:#172423}.w{font:700 29px Georgia;fill:#f2efe7}.s{font:18px system-ui;fill:#394a47}.l{stroke:#9b8449;stroke-width:3;fill:none;marker-end:url(#a)}.r{font:700 16px system-ui;fill:#7d493a}</style></defs>
<rect width="1200" height="760" rx="34" fill="#f2efe7"/>
<rect class="b" x="30" y="310" width="290" height="125" rx="22"/><text class="h" x="175" y="360" text-anchor="middle">Crisi della lingua</text><text class="s" x="175" y="395" text-anchor="middle">guerra e propaganda</text>
<rect class="c" x="380" y="300" width="440" height="145" rx="28"/><text class="w" x="600" y="360" text-anchor="middle">PAROLA ESSENZIALE</text><text x="600" y="399" text-anchor="middle" style="font:19px system-ui;fill:#d8d2c1">difesa e rinuncia</text>
<rect class="b" x="885" y="110" width="275" height="120" rx="22"/><text class="h" x="1022" y="158" text-anchor="middle">Conquista</text><text class="s" x="1022" y="193" text-anchor="middle">responsabilità</text>
<rect class="b" x="885" y="515" width="275" height="120" rx="22"/><text class="h" x="1022" y="563" text-anchor="middle">Limite</text><text class="s" x="1022" y="598" text-anchor="middle">elitismo e distanza</text>
<rect class="b" x="410" y="590" width="380" height="115" rx="22"/><text class="h" x="600" y="636" text-anchor="middle">Neorealismo</text><text class="s" x="600" y="670" text-anchor="middle">riapre il rapporto con la storia</text>
<rect class="b" x="390" y="55" width="420" height="115" rx="22"/><text class="h" x="600" y="101" text-anchor="middle">Necessità formale</text><text class="s" x="600" y="135" text-anchor="middle">né chiarezza né oscurità come culto</text>
<path class="l" d="M320 372H373"/><text class="r" x="322" y="350">produce</text><path class="l" d="M820 332C875 285 905 240 950 225"/><text class="r" x="842" y="268">salva</text><path class="l" d="M820 413C875 462 905 510 950 530"/><text class="r" x="842" y="488">rischia</text><path class="l" d="M885 590C840 625 815 645 798 647"/><text class="r" x="810" y="614">provoca</text><path class="l" d="M600 590V452"/><text class="r" x="616" y="522">contesta</text><path class="l" d="M600 300V177"/><text class="r" x="616" y="238">lascia il criterio</text>
</svg>
