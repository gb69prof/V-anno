<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">La poetica ermetica</title><desc id="d">La poesia pura concentra la parola; analogia, suono, frammento e spazio bianco richiedono un lettore attivo.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#9b8449"/></marker><style>.b{fill:#fbfaf6;stroke:#9b8449;stroke-width:3}.c{fill:#172423}.h{font:700 25px Georgia;fill:#172423}.w{font:700 30px Georgia;fill:#f2efe7}.s{font:18px system-ui;fill:#394a47}.l{stroke:#9b8449;stroke-width:3;fill:none;marker-end:url(#a)}.r{font:700 16px system-ui;fill:#7d493a}</style></defs><rect width="1200" height="760" rx="34" fill="#f2efe7"/><rect class="c" x="405" y="295" width="390" height="140" rx="28"/><text class="w" x="600" y="352" text-anchor="middle">PAROLA ASSOLUTA</text><text x="600" y="390" text-anchor="middle" style="font:19px system-ui;fill:#d8d2c1">alta intensità · pochi automatismi</text><rect class="b" x="55" y="65" width="280" height="110" rx="22"/><text class="h" x="195" y="111" text-anchor="middle">Poesia pura</text><text class="s" x="195" y="144" text-anchor="middle">autonomia dagli scopi</text><rect class="b" x="460" y="45" width="280" height="110" rx="22"/><text class="h" x="600" y="91" text-anchor="middle">Analogia</text><text class="s" x="600" y="124" text-anchor="middle">salta i nessi logici</text><rect class="b" x="865" y="65" width="280" height="110" rx="22"/><text class="h" x="1005" y="111" text-anchor="middle">Sinestesia</text><text class="s" x="1005" y="144" text-anchor="middle">fonde le percezioni</text><rect class="b" x="55" y="570" width="280" height="110" rx="22"/><text class="h" x="195" y="616" text-anchor="middle">Frammento</text><text class="s" x="195" y="649" text-anchor="middle">concentra il verso</text><rect class="b" x="460" y="590" width="280" height="110" rx="22"/><text class="h" x="600" y="636" text-anchor="middle">Spazio bianco</text><text class="s" x="600" y="669" text-anchor="middle">fa significare la pausa</text><rect class="b" x="865" y="570" width="280" height="110" rx="22"/><text class="h" x="1005" y="616" text-anchor="middle">Lettore attivo</text><text class="s" x="1005" y="649" text-anchor="middle">argomenta le relazioni</text><path class="l" d="M335 120C420 145 448 240 493 295"/><text class="r" x="362" y="206">libera</text><path class="l" d="M600 155V288"/><text class="r" x="616" y="227">densifica</text><path class="l" d="M865 120C780 145 752 240 707 295"/><text class="r" x="770" y="206">rende sensibile</text><path class="l" d="M195 570C260 505 394 470 484 435"/><text class="r" x="278" y="503">isola</text><path class="l" d="M600 590V442"/><text class="r" x="616" y="520">circonda</text><path class="l" d="M795 365C900 378 934 486 978 570"/><text class="r" x="871" y="456">richiede</text></svg>
