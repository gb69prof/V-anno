<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="t d"><title id="t">Traiettoria completa dell’Ermetismo</title><desc id="d">Sei movimenti collegano crisi della parola pubblica, fratture, realtà opaca, poetica del silenzio, opere e responsabilità linguistica.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#9b8449"/></marker><style>.b{fill:#fbfaf6;stroke:#9b8449;stroke-width:3}.c{fill:#172423}.n{font:700 19px system-ui;fill:#9b8449}.h{font:700 29px Georgia;fill:#172423}.w{font:700 29px Georgia;fill:#f2efe7}.s{font:19px system-ui;fill:#394a47}.l{stroke:#9b8449;stroke-width:4;fill:none;marker-end:url(#a)}.r{font:700 17px system-ui;fill:#7d493a}</style></defs><rect width="1400" height="820" rx="34" fill="#f2efe7"/><rect class="b" x="70" y="90" width="350" height="145" rx="25"/><text class="n" x="100" y="125">01</text><text class="h" x="245" y="160" text-anchor="middle">Mondo precedente</text><text class="s" x="245" y="198" text-anchor="middle">crisi e propaganda</text><rect class="b" x="525" y="70" width="350" height="145" rx="25"/><text class="n" x="555" y="105">02</text><text class="h" x="700" y="140" text-anchor="middle">Fratture</text><text class="s" x="700" y="178" text-anchor="middle">guerra, regime, sradicamento</text><rect class="b" x="980" y="90" width="350" height="145" rx="25"/><text class="n" x="1010" y="125">03</text><text class="h" x="1155" y="160" text-anchor="middle">Immagine del mondo</text><text class="s" x="1155" y="198" text-anchor="middle">realtà opaca e assenza</text><rect class="b" x="980" y="565" width="350" height="145" rx="25"/><text class="n" x="1010" y="600">04</text><text class="h" x="1155" y="635" text-anchor="middle">Poetica</text><text class="s" x="1155" y="673" text-anchor="middle">analogia, frammento, silenzio</text><rect class="b" x="525" y="590" width="350" height="145" rx="25"/><text class="n" x="555" y="625">05</text><text class="h" x="700" y="660" text-anchor="middle">Opere</text><text class="s" x="700" y="698" text-anchor="middle">una costellazione di prove</text><rect class="c" x="70" y="565" width="350" height="145" rx="25"/><text x="100" y="600" style="font:700 19px system-ui;fill:#c5ae6f">06</text><text class="w" x="245" y="635" text-anchor="middle">Conclusione</text><text x="245" y="673" text-anchor="middle" style="font:19px system-ui;fill:#d8d2c1">responsabilità e limite</text><path class="l" d="M420 160H518"/><text class="r" x="435" y="140">rende insufficiente</text><path class="l" d="M875 160H973"/><text class="r" x="897" y="140">modifica</text><path class="l" d="M1155 235V558"/><text class="r" x="1173" y="405">richiede</text><path class="l" d="M980 638H882"/><text class="r" x="898" y="618">diventa forma</text><path class="l" d="M525 663H427"/><text class="r" x="440" y="643">lascia</text><path class="l" d="M245 565V242"/><text class="r" x="263" y="408">riapre la domanda</text></svg>
