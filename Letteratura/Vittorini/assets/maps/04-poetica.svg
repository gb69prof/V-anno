<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
<title id="t">La poetica</title><desc id="d">Reale e simbolico, lirico e parlato, ripetizione, montaggio e riscrittura convergono nella forma responsabile e nell’impegno senza propaganda.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#9f2f2f"/></marker><style>.b{fill:#fffdf7;stroke:#191817;stroke-width:3}.c{fill:#191817;stroke:#191817;stroke-width:3}.h{font:700 24px system-ui,sans-serif;fill:#191817}.w{font:800 24px system-ui,sans-serif;fill:#fff}.w2{font:800 21px system-ui,sans-serif;fill:#fff}.r{font:700 17px system-ui,sans-serif;fill:#742121}.l{stroke:#9f2f2f;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="800" fill="#f2ecdf"/>
<rect class="c" x="410" y="325" width="380" height="145" rx="24"/><text class="w" x="600" y="385" text-anchor="middle">FORMA RESPONSABILE</text><text class="w2" x="600" y="425" text-anchor="middle">conoscere, non illustrare</text>
<rect class="b" x="55" y="65" width="290" height="100" rx="18"/><text class="h" x="200" y="108" text-anchor="middle">Reale + simbolico</text><text class="h" x="200" y="140" text-anchor="middle">approfondisce</text>
<rect class="b" x="455" y="60" width="290" height="105" rx="18"/><text class="h" x="600" y="105" text-anchor="middle">Lirico + parlato</text><text class="h" x="600" y="138" text-anchor="middle">costruisce semplicità</text>
<rect class="b" x="855" y="65" width="290" height="100" rx="18"/><text class="h" x="1000" y="108" text-anchor="middle">Ripetizione</text><text class="h" x="1000" y="140" text-anchor="middle">produce ritmo</text>
<path class="l" d="M255 165L490 320"/><text class="r" x="300" y="245">confluisce in</text>
<path class="l" d="M600 165V317"/><text class="r" x="615" y="245">si traduce in</text>
<path class="l" d="M945 165L710 320"/><text class="r" x="790" y="235">dà memoria a</text>
<rect class="b" x="90" y="625" width="290" height="110" rx="18"/><text class="h" x="235" y="671" text-anchor="middle">Montaggio</text><text class="h" x="235" y="705" text-anchor="middle">azione + coscienza</text>
<rect class="b" x="455" y="625" width="290" height="110" rx="18"/><text class="h" x="600" y="671" text-anchor="middle">Riscrittura</text><text class="h" x="600" y="705" text-anchor="middle">verifica la forma</text>
<rect class="b" x="820" y="610" width="300" height="140" rx="18"/><text class="h" x="970" y="662" text-anchor="middle">Impegno</text><text class="h" x="970" y="696" text-anchor="middle">senza</text><text class="h" x="970" y="730" text-anchor="middle">propaganda</text>
<path class="l" d="M480 470L300 617"/><text class="r" x="310" y="555">si articola nel</text>
<path class="l" d="M600 470V617"/><text class="r" x="615" y="555">resta aperta alla</text>
<path class="l" d="M745 680H812"/><text class="r" x="750" y="657">rende possibile</text>
</svg>
