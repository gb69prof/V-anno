<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
<title id="t">Le opere più significative</title><desc id="d">Cinque opere e gli scritti teorici mettono alla prova formazione, offesa, coscienza, mediazione culturale, comunità e modernità.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#9f2f2f"/></marker><style>.b{fill:#fffdf7;stroke:#191817;stroke-width:3}.c{fill:#9f2f2f;stroke:#742121;stroke-width:3}.h{font:700 22px system-ui,sans-serif;fill:#191817}.w{font:800 29px system-ui,sans-serif;fill:#fff}.r{font:700 16px system-ui,sans-serif;fill:#742121}.l{stroke:#9f2f2f;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="800" fill="#f2ecdf"/>
<rect class="c" x="410" y="325" width="380" height="145" rx="24"/><text class="w" x="600" y="385" text-anchor="middle">OPERE COME PROVE</text><text class="w" x="600" y="425" text-anchor="middle">storia ↔ forma</text>
<rect class="b" x="40" y="55" width="300" height="110" rx="18"/><text class="h" x="190" y="100" text-anchor="middle">Il garofano rosso</text><text class="h" x="190" y="135" text-anchor="middle">crescita + fascismo</text>
<rect class="b" x="450" y="50" width="300" height="115" rx="18"/><text class="h" x="600" y="96" text-anchor="middle">Conversazione</text><text class="h" x="600" y="129" text-anchor="middle">viaggio + offesa</text>
<rect class="b" x="860" y="55" width="300" height="110" rx="18"/><text class="h" x="1010" y="100" text-anchor="middle">Uomini e no</text><text class="h" x="1010" y="135" text-anchor="middle">Resistenza + coscienza</text>
<path class="l" d="M250 165L490 320"/><text class="r" x="300" y="240">mette alla prova</text>
<path class="l" d="M600 165V317"/><text class="r" x="615" y="245">realizza</text>
<path class="l" d="M950 165L710 320"/><text class="r" x="790" y="235">incrina</text>
<rect class="b" x="45" y="625" width="300" height="110" rx="18"/><text class="h" x="195" y="671" text-anchor="middle">Americana</text><text class="h" x="195" y="705" text-anchor="middle">mediazione culturale</text>
<rect class="b" x="450" y="625" width="300" height="110" rx="18"/><text class="h" x="600" y="671" text-anchor="middle">Le donne di Messina</text><text class="h" x="600" y="705" text-anchor="middle">comunità fragile</text>
<rect class="b" x="855" y="610" width="300" height="140" rx="18"/><text class="h" x="1005" y="657" text-anchor="middle">Diario / Due tensioni</text><text class="h" x="1005" y="691" text-anchor="middle">editoria +</text><text class="h" x="1005" y="722" text-anchor="middle">modernità</text>
<path class="l" d="M490 470L270 617"/><text class="r" x="300" y="555">si estende in</text>
<path class="l" d="M600 470V617"/><text class="r" x="615" y="555">si ricostruisce in</text>
<path class="l" d="M710 470L940 605"/><text class="r" x="790" y="545">si pensa in</text>
</svg>
