<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Le opere</title><desc id="desc">ARTE ALLA PROVA: racconta Il piacere; mostra fallimento dell’esteta; ampliano Le Laudi; realizza Alcyone; umanizza La sera fiesolana; trasforma La pioggia nel pineto.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b77424"/></marker><linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3e2bd"/><stop offset="1" stop-color="#d7b577"/></linearGradient></defs>
<style>text{font-family:Georgia,'Times New Roman',serif}.title{font-size:34px;fill:#082038}.node{fill:url(#paper);stroke:#9b611c;stroke-width:3}.label{font-size:24px;fill:#102231}.center{fill:#071c30;stroke:#d09540;stroke-width:4}.centerText{font-size:29px;fill:#f0bd68}.verb{font-size:17px;font-style:italic;fill:#6e471e}line{stroke:#b77424;stroke-width:3}</style>
<rect width="1000" height="650" fill="#f0dfb8"/><rect x="18" y="18" width="964" height="614" rx="24" fill="none" stroke="#18334a" stroke-width="5"/><text class="title" x="500" y="62" text-anchor="middle">Le opere</text>
<line x1="500" y1="335" x2="180" y2="205" marker-end="url(#arrow)"/><text class="verb" x="300" y="260" text-anchor="middle">racconta</text><rect class="node" x="55" y="157" width="250" height="96" rx="18"/><text class="label" x="180" y="212" text-anchor="middle">Il piacere</text>
<line x1="500" y1="335" x2="500" y2="125" marker-end="url(#arrow)"/><text class="verb" x="500" y="180" text-anchor="middle">mostra</text><rect class="node" x="375" y="77" width="250" height="96" rx="18"/><text class="label" x="500" y="132" text-anchor="middle">fallimento dell’esteta</text>
<line x1="500" y1="335" x2="820" y2="205" marker-end="url(#arrow)"/><text class="verb" x="700" y="260" text-anchor="middle">ampliano</text><rect class="node" x="695" y="157" width="250" height="96" rx="18"/><text class="label" x="820" y="212" text-anchor="middle">Le Laudi</text>
<line x1="500" y1="335" x2="180" y2="465" marker-end="url(#arrow)"/><text class="verb" x="300" y="410" text-anchor="middle">realizza</text><rect class="node" x="55" y="417" width="250" height="96" rx="18"/><text class="label" x="180" y="472" text-anchor="middle">Alcyone</text>
<line x1="500" y1="335" x2="500" y2="545" marker-end="url(#arrow)"/><text class="verb" x="500" y="490" text-anchor="middle">umanizza</text><rect class="node" x="375" y="497" width="250" height="96" rx="18"/><text class="label" x="500" y="552" text-anchor="middle">La sera fiesolana</text>
<line x1="500" y1="335" x2="820" y2="465" marker-end="url(#arrow)"/><text class="verb" x="700" y="410" text-anchor="middle">trasforma</text><rect class="node" x="695" y="417" width="250" height="96" rx="18"/><text class="label" x="820" y="472" text-anchor="middle">La pioggia nel pineto</text>
<rect class="center" x="340" y="285" width="320" height="100" rx="28"/><text class="centerText" x="500" y="345" text-anchor="middle">ARTE ALLA PROVA</text>
</svg>