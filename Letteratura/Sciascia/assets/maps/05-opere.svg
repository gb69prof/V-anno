<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Le opere</title><desc id="d">Cinque laboratori collegano microcosmo, mafia, limite dell’intellettuale, ipotesi scientifica e conflitto fra persona e apparato alla domanda su verità e giustizia.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8b6520"/></marker><style>.n{fill:#f8f4e8;stroke:#20221e;stroke-width:2}.c{fill:#cda64b;stroke:#20221e;stroke-width:3}.l{stroke:#8b6520;stroke-width:2;fill:none;marker-end:url(#a)}.h{font:700 21px Georgia,serif;fill:#171916}.p{font:16px system-ui,sans-serif;fill:#31332e}.r{font:700 14px system-ui,sans-serif;fill:#7a5420}.title{font:700 38px Georgia,serif;fill:#171916}</style></defs><rect width="1200" height="700" fill="#ece8dc"/><text x="60" y="62" class="title">05 · Le opere più significative</text>
<rect class="c" x="450" y="275" width="300" height="150" rx="12"/><text class="h" x="600" y="322" text-anchor="middle">Verità ↔ giustizia</text><text class="p" x="600" y="354" text-anchor="middle">ogni opera verifica</text><text class="p" x="600" y="383" text-anchor="middle">un limite diverso</text>
<rect class="n" x="60" y="115" width="285" height="105" rx="8"/><text class="h" x="202" y="153" text-anchor="middle">Parrocchie di Regalpetra</text><text class="p" x="202" y="186" text-anchor="middle">il paese diventa microcosmo</text><rect class="n" x="60" y="295" width="285" height="105" rx="8"/><text class="h" x="202" y="333" text-anchor="middle">Il giorno della civetta</text><text class="p" x="202" y="366" text-anchor="middle">sapere senza giustizia</text><rect class="n" x="60" y="475" width="285" height="105" rx="8"/><text class="h" x="202" y="513" text-anchor="middle">A ciascuno il suo</text><text class="p" x="202" y="546" text-anchor="middle">intelligenza insufficiente</text>
<rect class="n" x="855" y="155" width="285" height="105" rx="8"/><text class="h" x="997" y="193" text-anchor="middle">Scomparsa di Majorana</text><text class="p" x="997" y="226" text-anchor="middle">il confine dell’ipotesi</text><rect class="n" x="855" y="355" width="285" height="105" rx="8"/><text class="h" x="997" y="393" text-anchor="middle">L’affaire Moro</text><text class="p" x="997" y="426" text-anchor="middle">persona fra due linguaggi</text><rect class="n" x="855" y="555" width="285" height="105" rx="8"/><text class="h" x="997" y="593" text-anchor="middle">Porte aperte</text><text class="p" x="997" y="626" text-anchor="middle">diritto contro vendetta</text>
<path class="l" d="M345 168C400 168 405 285 450 310"/><text class="r" x="365" y="215">costruisce</text><path class="l" d="M345 347H450"/><text class="r" x="368" y="335">separa</text><path class="l" d="M345 527C405 527 405 415 450 390"/><text class="r" x="365" y="500">limita</text><path class="l" d="M855 207C805 207 800 290 750 315"/><text class="r" x="772" y="245">ipotizza</text><path class="l" d="M855 407H750"/><text class="r" x="773" y="395">contesta</text><path class="l" d="M855 607C800 607 800 420 750 395"/><text class="r" x="776" y="535">difende</text></svg>
