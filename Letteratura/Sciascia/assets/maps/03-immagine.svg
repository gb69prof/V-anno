<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">L’immagine del mondo</title><desc id="d">La verità resta cercabile, le reti di potere ne bloccano gli effetti, storia e dubbio responsabile sostengono l’individuo e rendono necessaria una forma ibrida.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8b6520"/></marker><style>.n{fill:#f8f4e8;stroke:#20221e;stroke-width:2}.c{fill:#cda64b;stroke:#20221e;stroke-width:3}.l{stroke:#8b6520;stroke-width:2;fill:none;marker-end:url(#a)}.h{font:700 24px Georgia,serif;fill:#171916}.p{font:17px system-ui,sans-serif;fill:#31332e}.r{font:700 14px system-ui,sans-serif;fill:#7a5420}.title{font:700 38px Georgia,serif;fill:#171916}</style></defs><rect width="1200" height="700" fill="#ece8dc"/><text x="60" y="62" class="title">03 · L’immagine del mondo</text>
<rect class="n" x="70" y="145" width="270" height="105" rx="8"/><text class="h" x="205" y="185" text-anchor="middle">Indizi e documenti</text><text class="p" x="205" y="218" text-anchor="middle">la verità è cercabile</text><rect class="n" x="70" y="450" width="270" height="105" rx="8"/><text class="h" x="205" y="490" text-anchor="middle">Storia e memoria</text><text class="p" x="205" y="523" text-anchor="middle">riaprono i casi</text>
<rect class="c" x="455" y="255" width="290" height="165" rx="12"/><text class="h" x="600" y="305" text-anchor="middle">Ragione fragile</text><text class="p" x="600" y="340" text-anchor="middle">comprende abbastanza</text><text class="p" x="600" y="370" text-anchor="middle">ma non garantisce giustizia</text>
<rect class="n" x="860" y="120" width="270" height="105" rx="8"/><text class="h" x="995" y="160" text-anchor="middle">Reti di potere</text><text class="p" x="995" y="193" text-anchor="middle">dissolvono responsabilità</text><rect class="n" x="860" y="298" width="270" height="105" rx="8"/><text class="h" x="995" y="338" text-anchor="middle">Dubbio responsabile</text><text class="p" x="995" y="371" text-anchor="middle">gradua le certezze</text><rect class="n" x="860" y="476" width="270" height="105" rx="8"/><text class="h" x="995" y="516" text-anchor="middle">Individuo solo</text><text class="p" x="995" y="549" text-anchor="middle">non falsifica ciò che sa</text>
<path class="l" d="M340 198C410 198 410 295 455 310"/><text class="r" x="367" y="230">alimenta</text><path class="l" d="M340 503C410 503 410 410 455 390"/><text class="r" x="365" y="477">riattiva</text><path class="l" d="M860 172C790 172 790 285 745 310"/><text class="r" x="770" y="222">ostacola</text><path class="l" d="M860 350H745"/><text class="r" x="766" y="338">controlla</text><path class="l" d="M860 528C790 528 790 415 745 390"/><text class="r" x="762" y="493">rende degna</text><path class="l" d="M600 420V590"/><text class="r" x="616" y="510">esige</text><text class="h" x="600" y="630" text-anchor="middle">Una forma capace di mostrare ricerca e interruzione</text></svg>
