<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
<title id="t">Il mondo precedente</title><desc id="d">Sicilia, Repubblica e tradizioni letterarie confluiscono nella frattura fra verità, legge e giustizia e preparano la domanda sul potere.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8b6520"/></marker><style>.n{fill:#f8f4e8;stroke:#20221e;stroke-width:2}.c{fill:#cda64b;stroke:#20221e;stroke-width:3}.l{stroke:#8b6520;stroke-width:2;fill:none;marker-end:url(#a)}.h{font:700 25px Georgia,serif;fill:#171916}.p{font:18px system-ui,sans-serif;fill:#31332e}.r{font:700 15px system-ui,sans-serif;fill:#7a5420}.title{font:700 38px Georgia,serif;fill:#171916}</style></defs>
<rect width="1200" height="700" fill="#ece8dc"/><text x="60" y="62" class="title">01 · Il mondo precedente</text>
<rect class="n" x="55" y="125" width="250" height="90" rx="8"/><text class="h" x="180" y="163" text-anchor="middle">Sicilia</text><text class="p" x="180" y="191" text-anchor="middle">zolfare · notabili · silenzi</text>
<rect class="n" x="55" y="305" width="250" height="90" rx="8"/><text class="h" x="180" y="343" text-anchor="middle">Repubblica</text><text class="p" x="180" y="371" text-anchor="middle">diritti promessi</text>
<rect class="n" x="55" y="485" width="250" height="90" rx="8"/><text class="h" x="180" y="523" text-anchor="middle">Guerra fredda</text><text class="p" x="180" y="551" text-anchor="middle">appartenenze rigide</text>
<rect class="c" x="435" y="270" width="330" height="150" rx="12"/><text class="h" x="600" y="322" text-anchor="middle">Frattura centrale</text><text class="p" x="600" y="355" text-anchor="middle">verità ≠ legge ≠ giustizia</text><text class="p" x="600" y="386" text-anchor="middle">il potere interrompe i passaggi</text>
<rect class="n" x="890" y="125" width="250" height="90" rx="8"/><text class="h" x="1015" y="163" text-anchor="middle">Illuminismo</text><text class="p" x="1015" y="191" text-anchor="middle">critica dell’arbitrio</text>
<rect class="n" x="890" y="305" width="250" height="90" rx="8"/><text class="h" x="1015" y="343" text-anchor="middle">Manzoni</text><text class="p" x="1015" y="371" text-anchor="middle">documenti e responsabilità</text>
<rect class="n" x="890" y="485" width="250" height="90" rx="8"/><text class="h" x="1015" y="523" text-anchor="middle">Giallo</text><text class="p" x="1015" y="551" text-anchor="middle">promessa di soluzione</text>
<path class="l" d="M305 170C375 170 380 295 435 315"/><text class="r" x="338" y="208">rende visibile</text><path class="l" d="M305 350H435"/><text class="r" x="336" y="338">mette alla prova</text><path class="l" d="M305 530C375 530 380 405 435 385"/><text class="r" x="335" y="502">irrigidisce</text>
<path class="l" d="M890 170C820 170 815 295 765 315"/><text class="r" x="787" y="207">critica</text><path class="l" d="M890 350H765"/><text class="r" x="790" y="338">interroga</text><path class="l" d="M890 530C820 530 815 405 765 385"/><text class="r" x="783" y="502">offre una forma</text>
<text class="h" x="600" y="625" text-anchor="middle">Domanda: chi rende il potere verificabile?</text><path class="l" d="M600 420V590"/><text class="r" x="615" y="515">produce</text>
</svg>
