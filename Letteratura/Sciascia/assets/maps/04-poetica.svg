<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">La poetica</title><desc id="d">La verità ostacolata produce giallo imperfetto, documento interrogato, lingua nitida, brevità e ibridazione, affidando al lettore un giudizio limitato.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8b6520"/></marker><style>.n{fill:#f8f4e8;stroke:#20221e;stroke-width:2}.c{fill:#cda64b;stroke:#20221e;stroke-width:3}.l{stroke:#8b6520;stroke-width:2;fill:none;marker-end:url(#a)}.h{font:700 23px Georgia,serif;fill:#171916}.p{font:17px system-ui,sans-serif;fill:#31332e}.r{font:700 14px system-ui,sans-serif;fill:#7a5420}.title{font:700 38px Georgia,serif;fill:#171916}</style></defs><rect width="1200" height="700" fill="#ece8dc"/><text x="60" y="62" class="title">04 · La poetica</text>
<rect class="c" x="455" y="105" width="290" height="115" rx="12"/><text class="h" x="600" y="150" text-anchor="middle">Verità ostacolata</text><text class="p" x="600" y="184" text-anchor="middle">problema espressivo</text>
<rect class="n" x="70" y="300" width="250" height="100" rx="8"/><text class="h" x="195" y="340" text-anchor="middle">Giallo imperfetto</text><text class="p" x="195" y="372" text-anchor="middle">la soluzione non salva</text><rect class="n" x="350" y="300" width="250" height="100" rx="8"/><text class="h" x="475" y="340" text-anchor="middle">Documento</text><text class="p" x="475" y="372" text-anchor="middle">prova situata</text><rect class="n" x="630" y="300" width="250" height="100" rx="8"/><text class="h" x="755" y="340" text-anchor="middle">Lingua nitida</text><text class="p" x="755" y="372" text-anchor="middle">ragiona e allude</text><rect class="n" x="910" y="300" width="250" height="100" rx="8"/><text class="h" x="1035" y="340" text-anchor="middle">Forma breve</text><text class="p" x="1035" y="372" text-anchor="middle">monta e concentra</text>
<rect class="n" x="245" y="520" width="300" height="100" rx="8"/><text class="h" x="395" y="560" text-anchor="middle">Generi ibridi</text><text class="p" x="395" y="592" text-anchor="middle">fiction · saggio · cronaca</text><rect class="n" x="655" y="520" width="300" height="100" rx="8"/><text class="h" x="805" y="560" text-anchor="middle">Lettore responsabile</text><text class="p" x="805" y="592" text-anchor="middle">cerca e limita il sospetto</text>
<path class="l" d="M535 220 230 300"/><text class="r" x="348" y="252">si traduce in</text><path class="l" d="M575 220 500 300"/><text class="r" x="500" y="257">interroga</text><path class="l" d="M625 220 730 300"/><text class="r" x="648" y="257">rende precisa</text><path class="l" d="M665 220 1000 300"/><text class="r" x="822" y="252">concentra</text><path class="l" d="M195 400C195 475 320 470 365 520"/><text class="r" x="225" y="472">confluisce in</text><path class="l" d="M475 400V520"/><text class="r" x="488" y="465">vincola</text><path class="l" d="M755 400V520"/><text class="r" x="770" y="465">guida</text><path class="l" d="M1035 400C1035 475 905 470 840 520"/><text class="r" x="930" y="472">attiva</text><path class="l" d="M545 570H655"/><text class="r" x="565" y="558">coinvolgono</text></svg>
