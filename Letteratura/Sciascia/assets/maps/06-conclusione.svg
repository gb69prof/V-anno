<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Conclusione</title><desc id="d">I sei movimenti formano una catena: mondo ricevuto, fratture, immagine del mondo, poetica, opere ed eredità civile, fino alla domanda sulla verità sconfitta.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8b6520"/></marker><style>.n{fill:#f8f4e8;stroke:#20221e;stroke-width:2}.c{fill:#cda64b;stroke:#20221e;stroke-width:3}.l{stroke:#8b6520;stroke-width:2;fill:none;marker-end:url(#a)}.h{font:700 23px Georgia,serif;fill:#171916}.p{font:16px system-ui,sans-serif;fill:#31332e}.r{font:700 14px system-ui,sans-serif;fill:#7a5420}.title{font:700 38px Georgia,serif;fill:#171916}</style></defs><rect width="1200" height="700" fill="#ece8dc"/><text x="60" y="62" class="title">06 · Conclusione: la catena che resta</text>
<rect class="n" x="75" y="120" width="300" height="100" rx="8"/><text class="h" x="225" y="158" text-anchor="middle">Mondo ricevuto</text><text class="p" x="225" y="191" text-anchor="middle">legge separata dalla giustizia</text><rect class="n" x="450" y="120" width="300" height="100" rx="8"/><text class="h" x="600" y="158" text-anchor="middle">Fratture</text><text class="p" x="600" y="191" text-anchor="middle">responsabilità personale</text><rect class="n" x="825" y="120" width="300" height="100" rx="8"/><text class="h" x="975" y="158" text-anchor="middle">Immagine del mondo</text><text class="p" x="975" y="191" text-anchor="middle">ragione necessaria e fragile</text>
<rect class="n" x="825" y="330" width="300" height="100" rx="8"/><text class="h" x="975" y="368" text-anchor="middle">Poetica</text><text class="p" x="975" y="401" text-anchor="middle">indagine · documento · ibrido</text><rect class="n" x="450" y="330" width="300" height="100" rx="8"/><text class="h" x="600" y="368" text-anchor="middle">Opere</text><text class="p" x="600" y="401" text-anchor="middle">laboratori del limite</text><rect class="c" x="75" y="330" width="300" height="100" rx="8"/><text class="h" x="225" y="368" text-anchor="middle">Eredità civile</text><text class="p" x="225" y="401" text-anchor="middle">verificare senza santificare</text>
<path class="l" d="M375 170H450"/><text class="r" x="380" y="158">mette in crisi</text><path class="l" d="M750 170H825"/><text class="r" x="760" y="158">modifica</text><path class="l" d="M975 220V330"/><text class="r" x="992" y="280">esige</text><path class="l" d="M825 380H750"/><text class="r" x="762" y="368">confluisce in</text><path class="l" d="M450 380H375"/><text class="r" x="390" y="368">lascia</text>
<rect class="n" x="255" y="540" width="690" height="100" rx="8"/><text class="h" x="600" y="578" text-anchor="middle">Domanda aperta</text><text class="p" x="600" y="611" text-anchor="middle">Una verità sconfitta resta civile se impedisce al potere di farla apparire inconoscibile?</text><path class="l" d="M225 430C225 490 350 500 430 540"/><text class="r" x="275" y="493">conserva</text></svg>
