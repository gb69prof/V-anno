<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Le fratture della vita</title><desc id="d">Formazione fascista, guerra, scuola, uffici, editoria e politica producono una postura interna ed esterna alle istituzioni e la solitudine del giudizio.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8b6520"/></marker><style>.n{fill:#f8f4e8;stroke:#20221e;stroke-width:2}.c{fill:#cda64b;stroke:#20221e;stroke-width:3}.l{stroke:#8b6520;stroke-width:2;fill:none;marker-end:url(#a)}.h{font:700 24px Georgia,serif;fill:#171916}.p{font:17px system-ui,sans-serif;fill:#31332e}.r{font:700 14px system-ui,sans-serif;fill:#7a5420}.title{font:700 38px Georgia,serif;fill:#171916}</style></defs><rect width="1200" height="700" fill="#ece8dc"/><text x="60" y="62" class="title">02 · Le fratture della vita</text>
<rect class="n" x="55" y="120" width="250" height="90" rx="8"/><text class="h" x="180" y="158" text-anchor="middle">Fascismo e guerra</text><text class="p" x="180" y="187" text-anchor="middle">retorica ≠ realtà</text><rect class="n" x="55" y="305" width="250" height="90" rx="8"/><text class="h" x="180" y="343" text-anchor="middle">Scuola e uffici</text><text class="p" x="180" y="372" text-anchor="middle">la Repubblica dal basso</text><rect class="n" x="55" y="490" width="250" height="90" rx="8"/><text class="h" x="180" y="528" text-anchor="middle">Editoria e archivi</text><text class="p" x="180" y="557" text-anchor="middle">forma e confronto</text>
<rect class="c" x="435" y="270" width="330" height="150" rx="12"/><text class="h" x="600" y="320" text-anchor="middle">Postura irregolare</text><text class="p" x="600" y="353" text-anchor="middle">dentro le istituzioni</text><text class="p" x="600" y="382" text-anchor="middle">fuori dall’obbedienza</text>
<rect class="n" x="895" y="120" width="250" height="90" rx="8"/><text class="h" x="1020" y="158" text-anchor="middle">Italiano / dialetto</text><text class="p" x="1020" y="187" text-anchor="middle">cittadinanza e ordito</text><rect class="n" x="895" y="305" width="250" height="90" rx="8"/><text class="h" x="1020" y="343" text-anchor="middle">Militanza</text><text class="p" x="1020" y="372" text-anchor="middle">partecipazione e dissenso</text><rect class="n" x="895" y="490" width="250" height="90" rx="8"/><text class="h" x="1020" y="528" text-anchor="middle">Ultimi libri</text><text class="p" x="1020" y="557" text-anchor="middle">fragilità e forma scarna</text>
<path class="l" d="M305 165C380 165 380 290 435 315"/><text class="r" x="330" y="206">smaschera</text><path class="l" d="M305 350H435"/><text class="r" x="334" y="338">fa osservare</text><path class="l" d="M305 535C380 535 380 410 435 385"/><text class="r" x="335" y="506">disciplina</text><path class="l" d="M895 165C820 165 820 290 765 315"/><text class="r" x="787" y="205">tende fra</text><path class="l" d="M895 350H765"/><text class="r" x="800" y="338">mette in crisi</text><path class="l" d="M895 535C820 535 820 410 765 385"/><text class="r" x="792" y="507">radicalizza</text>
<path class="l" d="M600 420V590"/><text class="r" x="616" y="510">produce</text><text class="h" x="600" y="628" text-anchor="middle">Solitudine responsabile del giudizio</text></svg>
