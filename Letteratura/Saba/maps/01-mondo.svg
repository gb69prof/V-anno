<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Il mondo precedente di Saba</title><desc id="d">Trieste di frontiera e la tradizione lirica alimentano una identità plurale; estetismo, avanguardie e crisi dell'io rendono necessario cercare una parola personale e verificabile.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#b4483e"/></marker><style>.n{fill:#fffdf7;stroke:#163a46;stroke-width:3}.c{fill:#163a46}.tx{font:700 25px system-ui;fill:#16282d}.ct{font:800 31px system-ui;fill:white}.rel{font:650 18px system-ui;fill:#8b352e}.ar{stroke:#b4483e;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="760" rx="28" fill="#f3efe6"/><rect class="c" x="425" y="294" width="350" height="150" rx="28"/><text class="ct" x="600" y="354" text-anchor="middle">MONDO RICEVUTO</text><text class="ct" x="600" y="394" text-anchor="middle">identità non coincidenti</text><rect class="n" x="60" y="70" width="320" height="110" rx="22"/><text class="tx" x="220" y="118" text-anchor="middle">Trieste di frontiera</text><text class="tx" x="220" y="151" text-anchor="middle">lingue · fedi · imperi</text><path class="ar" d="M300 180L480 292"/><text class="rel" x="350" y="224">rende plurale</text><rect class="n" x="820" y="70" width="320" height="110" rx="22"/><text class="tx" x="980" y="118" text-anchor="middle">Tradizione lirica</text><text class="tx" x="980" y="151" text-anchor="middle">Petrarca · Leopardi</text><path class="ar" d="M900 180L720 292"/><text class="rel" x="776" y="224">offre forme</text><rect class="n" x="60" y="580" width="300" height="105" rx="22"/><text class="tx" x="210" y="625" text-anchor="middle">Estetismo</text><text class="tx" x="210" y="658" text-anchor="middle">l’io come spettacolo</text><path class="ar" d="M350 580L485 448"/><text class="rel" x="350" y="518">mette in crisi</text><rect class="n" x="450" y="580" width="300" height="105" rx="22"/><text class="tx" x="600" y="625" text-anchor="middle">Avanguardie</text><text class="tx" x="600" y="658" text-anchor="middle">rottura delle forme</text><path class="ar" d="M600 580L600 448"/><text class="rel" x="612" y="522">contestano</text><rect class="n" x="840" y="580" width="300" height="105" rx="22"/><text class="tx" x="990" y="625" text-anchor="middle">Crisi dell’io</text><text class="tx" x="990" y="658" text-anchor="middle">inconscio · conflitto</text><path class="ar" d="M850 580L715 448"/><text class="rel" x="764" y="518">rende urgente</text><path class="ar" d="M775 368L940 368"/><rect class="n" x="940" y="305" width="230" height="125" rx="22"/><text class="tx" x="1055" y="351" text-anchor="middle">Parola personale</text><text class="tx" x="1055" y="384" text-anchor="middle">e verificabile</text></svg>
