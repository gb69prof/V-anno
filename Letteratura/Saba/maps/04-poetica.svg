<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">La poetica di Saba</title><desc id="d">La poesia onesta rifiuta le passioni finte; parole comuni, tradizione metrica, registri alti e bassi e montaggio del Canzoniere rendono comunicabile la complessità dell'io.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#b4483e"/></marker><style>.n{fill:#fffdf7;stroke:#163a46;stroke-width:3}.c{fill:#163a46}.x{font:700 24px system-ui;fill:#16282d}.y{font:800 31px system-ui;fill:#fff}.r{font:650 18px system-ui;fill:#8b352e}.a{stroke:#b4483e;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="760" rx="28" fill="#f3efe6"/><rect class="c" x="420" y="290" width="360" height="155" rx="28"/><text class="y" x="600" y="350" text-anchor="middle">POESIA ONESTA</text><text class="y" x="600" y="390" text-anchor="middle">parola = visione</text><rect class="n" x="70" y="80" width="300" height="105" rx="20"/><text class="x" x="220" y="126" text-anchor="middle">Rifiuta la posa</text><text class="x" x="220" y="158" text-anchor="middle">passioni non finte</text><path class="a" d="M320 185L480 290"/><text class="r" x="355" y="232">fonda</text><rect class="n" x="830" y="80" width="300" height="105" rx="20"/><text class="x" x="980" y="126" text-anchor="middle">Correzione</text><text class="x" x="980" y="158" text-anchor="middle">sincerità lavorata</text><path class="a" d="M880 185L720 290"/><text class="r" x="790" y="232">verifica</text><rect class="n" x="55" y="580" width="260" height="105" rx="20"/><text class="x" x="185" y="626" text-anchor="middle">Parole trite</text><text class="x" x="185" y="658" text-anchor="middle">uso comune</text><path class="a" d="M290 580L480 445"/><text class="r" x="340" y="520">condivide</text><rect class="n" x="335" y="580" width="250" height="105" rx="20"/><text class="x" x="460" y="626" text-anchor="middle">Metrica</text><text class="x" x="460" y="658" text-anchor="middle">disciplina</text><path class="a" d="M500 580L550 445"/><text class="r" x="500" y="520">contiene</text><rect class="n" x="610" y="580" width="250" height="105" rx="20"/><text class="x" x="735" y="626" text-anchor="middle">Alto + basso</text><text class="x" x="735" y="658" text-anchor="middle">una voce</text><path class="a" d="M690 580L650 445"/><text class="r" x="665" y="520">mescola</text><rect class="n" x="880" y="580" width="270" height="105" rx="20"/><text class="x" x="1015" y="626" text-anchor="middle">Montaggio</text><text class="x" x="1015" y="658" text-anchor="middle">vita → libro</text><path class="a" d="M910 580L720 445"/><text class="r" x="800" y="520">organizza</text></svg>
