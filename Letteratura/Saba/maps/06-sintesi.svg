<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Sintesi del percorso su Saba</title><desc id="d">Il mondo di frontiera prepara le fratture; le fratture rendono visibile l'io diviso; la nuova immagine del mondo richiede poesia onesta; la poetica viene provata nelle opere e lascia una chiarezza che non semplifica.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#b4483e"/></marker><style>.n{fill:#fffdf7;stroke:#163a46;stroke-width:3}.f{fill:#163a46}.x{font:700 23px system-ui;fill:#16282d}.w{font:800 25px system-ui;fill:#fff}.r{font:650 18px system-ui;fill:#8b352e}.a{stroke:#b4483e;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="760" rx="28" fill="#f3efe6"/><rect class="n" x="60" y="70" width="300" height="110" rx="22"/><text class="x" x="210" y="117" text-anchor="middle">1 · Mondo di frontiera</text><text class="x" x="210" y="150" text-anchor="middle">forme + crisi dell’io</text><path class="a" d="M360 125L500 125"/><text class="r" x="392" y="105">prepara</text><rect class="n" x="500" y="70" width="300" height="110" rx="22"/><text class="x" x="650" y="117" text-anchor="middle">2 · Fratture</text><text class="x" x="650" y="150" text-anchor="middle">separazioni + storia</text><path class="a" d="M650 180L650 285"/><text class="r" x="663" y="242">rendono visibile</text><rect class="f" x="470" y="285" width="360" height="150" rx="28"/><text class="w" x="650" y="345" text-anchor="middle">3 · IO DIVISO</text><text class="w" x="650" y="385" text-anchor="middle">dolore · desiderio · fraternità</text><path class="a" d="M470 360L330 360"/><text class="r" x="350" y="340">richiede</text><rect class="n" x="50" y="305" width="280" height="110" rx="22"/><text class="x" x="190" y="352" text-anchor="middle">4 · Poesia onesta</text><text class="x" x="190" y="385" text-anchor="middle">chiarezza lavorata</text><path class="a" d="M190 415L190 560"/><text class="r" x="205" y="500">si prova in</text><rect class="n" x="50" y="560" width="280" height="110" rx="22"/><text class="x" x="190" y="607" text-anchor="middle">5 · Opere</text><text class="x" x="190" y="640" text-anchor="middle">vita trasformata in forma</text><path class="a" d="M330 615L520 615"/><text class="r" x="380" y="593">lascia</text><rect class="n" x="520" y="550" width="380" height="130" rx="22"/><text class="x" x="710" y="602" text-anchor="middle">6 · Eredità</text><text class="x" x="710" y="635" text-anchor="middle">chiarezza che non semplifica</text><path class="a" d="M900 615L1110 615"/><text class="r" x="943" y="593">interroga</text><rect class="f" x="1010" y="305" width="160" height="200" rx="28"/><text class="w" x="1090" y="382" text-anchor="middle">OGGI</text><text class="w" x="1090" y="420" text-anchor="middle">verità</text><text class="w" x="1090" y="455" text-anchor="middle">o posa?</text><path class="a" d="M1090 615L1090 510"/></svg>
