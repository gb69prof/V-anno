<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Le opere decisive</title><desc id="d">Il Canzoniere organizza la vita; A mia moglie prova l'amore concreto, Trieste l'appartenenza, La capra il dolore comune, Il piccolo Berto la memoria analitica ed Ernesto la verità del desiderio.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#b4483e"/></marker><style>.n{fill:#fffdf7;stroke:#163a46;stroke-width:3}.c{fill:#163a46}.x{font:700 23px system-ui;fill:#16282d}.y{font:800 32px system-ui;fill:#fff}.r{font:650 18px system-ui;fill:#8b352e}.a{stroke:#b4483e;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="760" rx="28" fill="#f3efe6"/><rect class="c" x="430" y="300" width="340" height="140" rx="28"/><text class="y" x="600" y="360" text-anchor="middle">IL CANZONIERE</text><text class="y" x="600" y="400" text-anchor="middle">vita montata</text><rect class="n" x="50" y="80" width="260" height="100" rx="20"/><text class="x" x="180" y="124" text-anchor="middle">A mia moglie</text><text class="x" x="180" y="155" text-anchor="middle">amore concreto</text><path class="a" d="M285 180L480 300"/><text class="r" x="340" y="230">verifica</text><rect class="n" x="355" y="80" width="230" height="100" rx="20"/><text class="x" x="470" y="124" text-anchor="middle">Trieste</text><text class="x" x="470" y="155" text-anchor="middle">appartenenza</text><path class="a" d="M500 180L550 296"/><text class="r" x="515" y="232">radica</text><rect class="n" x="615" y="80" width="230" height="100" rx="20"/><text class="x" x="730" y="124" text-anchor="middle">Città vecchia</text><text class="x" x="730" y="155" text-anchor="middle">umiltà</text><path class="a" d="M700 180L650 296"/><text class="r" x="666" y="232">apre</text><rect class="n" x="890" y="80" width="260" height="100" rx="20"/><text class="x" x="1020" y="124" text-anchor="middle">La capra</text><text class="x" x="1020" y="155" text-anchor="middle">dolore comune</text><path class="a" d="M920 180L720 300"/><text class="r" x="805" y="230">universalizza</text><rect class="n" x="150" y="580" width="300" height="105" rx="20"/><text class="x" x="300" y="626" text-anchor="middle">Il piccolo Berto</text><text class="x" x="300" y="658" text-anchor="middle">memoria ricostruita</text><path class="a" d="M410 580L520 445"/><text class="r" x="430" y="520">scava</text><rect class="n" x="750" y="580" width="300" height="105" rx="20"/><text class="x" x="900" y="626" text-anchor="middle">Ernesto</text><text class="x" x="900" y="658" text-anchor="middle">verità del desiderio</text><path class="a" d="M790 580L680 445"/><text class="r" x="720" y="520">radicalizza</text></svg>
