<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">L'immagine del mondo</title><desc id="d">L'io diviso viene esplorato da memoria e psicoanalisi; il dolore comune, la quotidianità e il desiderio conducono alla fraternità e alla verità che giace al fondo.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#b4483e"/></marker><style>.n{fill:#fffdf7;stroke:#163a46;stroke-width:3}.c{fill:#163a46}.x{font:700 24px system-ui;fill:#16282d}.y{font:800 31px system-ui;fill:#fff}.r{font:650 18px system-ui;fill:#8b352e}.a{stroke:#b4483e;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="760" rx="28" fill="#f3efe6"/><rect class="c" x="410" y="290" width="380" height="155" rx="28"/><text class="y" x="600" y="350" text-anchor="middle">VERITÀ AL FONDO</text><text class="y" x="600" y="390" text-anchor="middle">oltre le pose dell’io</text><rect class="n" x="70" y="80" width="300" height="105" rx="20"/><text class="x" x="220" y="126" text-anchor="middle">Memoria</text><text class="x" x="220" y="158" text-anchor="middle">ricostruisce</text><path class="a" d="M320 185L480 290"/><text class="r" x="365" y="230">interroga</text><rect class="n" x="830" y="80" width="300" height="105" rx="20"/><text class="x" x="980" y="126" text-anchor="middle">Psicoanalisi</text><text class="x" x="980" y="158" text-anchor="middle">nomina il conflitto</text><path class="a" d="M880 185L720 290"/><text class="r" x="790" y="230">illumina</text><rect class="n" x="60" y="580" width="300" height="105" rx="20"/><text class="x" x="210" y="626" text-anchor="middle">Dolore comune</text><text class="x" x="210" y="658" text-anchor="middle">La capra</text><path class="a" d="M330 580L490 447"/><text class="r" x="356" y="526">crea fraternità</text><rect class="n" x="450" y="580" width="300" height="105" rx="20"/><text class="x" x="600" y="626" text-anchor="middle">Quotidianità</text><text class="x" x="600" y="658" text-anchor="middle">umili · città</text><path class="a" d="M600 580L600 447"/><text class="r" x="612" y="525">rende concreta</text><rect class="n" x="840" y="580" width="300" height="105" rx="20"/><text class="x" x="990" y="626" text-anchor="middle">Eros</text><text class="x" x="990" y="658" text-anchor="middle">lega e vulnera</text><path class="a" d="M870 580L710 447"/><text class="r" x="800" y="526">complica</text></svg>
