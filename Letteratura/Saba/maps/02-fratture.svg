<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Le fratture della vita</title><desc id="d">Assenza del padre e distacco dalla balia aprono l'io diviso; nevrosi e crisi con Lina lo rendono visibile; persecuzione razziale e psicoanalisi lo trasformano in problema storico e conoscitivo.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#b4483e"/></marker><style>.n{fill:#fffdf7;stroke:#163a46;stroke-width:3}.c{fill:#163a46}.x{font:700 24px system-ui;fill:#16282d}.y{font:800 32px system-ui;fill:#fff}.r{font:650 18px system-ui;fill:#8b352e}.a{stroke:#b4483e;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="760" rx="28" fill="#f3efe6"/><rect class="c" x="430" y="300" width="340" height="140" rx="28"/><text class="y" x="600" y="360" text-anchor="middle">IO DIVISO</text><text class="y" x="600" y="398" text-anchor="middle">da narrare</text><rect class="n" x="60" y="90" width="290" height="100" rx="20"/><text class="x" x="205" y="135" text-anchor="middle">Padre assente</text><text class="x" x="205" y="166" text-anchor="middle">incontro tardivo</text><path class="a" d="M320 190L480 300"/><text class="r" x="346" y="234">apre</text><rect class="n" x="850" y="90" width="290" height="100" rx="20"/><text class="x" x="995" y="135" text-anchor="middle">Distacco da Peppa</text><text class="x" x="995" y="166" text-anchor="middle">due madri</text><path class="a" d="M880 190L720 300"/><text class="r" x="800" y="234">raddoppia</text><rect class="n" x="45" y="580" width="260" height="100" rx="20"/><text class="x" x="175" y="638" text-anchor="middle">Nevrosi</text><path class="a" d="M285 580L480 442"/><text class="r" x="335" y="524">rende urgente</text><rect class="n" x="335" y="580" width="240" height="100" rx="20"/><text class="x" x="455" y="638" text-anchor="middle">Lina · ambivalenza</text><path class="a" d="M500 580L550 445"/><text class="r" x="500" y="520">mette alla prova</text><rect class="n" x="605" y="580" width="250" height="100" rx="20"/><text class="x" x="730" y="622" text-anchor="middle">Leggi razziali</text><text class="x" x="730" y="653" text-anchor="middle">clandestinità</text><path class="a" d="M680 580L650 445"/><text class="r" x="666" y="520">storicizza</text><rect class="n" x="885" y="580" width="270" height="100" rx="20"/><text class="x" x="1020" y="622" text-anchor="middle">Psicoanalisi</text><text class="x" x="1020" y="653" text-anchor="middle">capire ≠ guarire</text><path class="a" d="M920 580L720 442"/><text class="r" x="805" y="520">trasforma in sapere</text></svg>
