<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">5 · Le opere più significative</title><desc id="desc">Mappa concettuale con relazioni nominate sul percorso calviniano.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><style>.bg{fill:#fffdf6}.node{fill:#f4f0e6;stroke:#14213d;stroke-width:2}.mainNode{fill:#14213d;stroke:#14213d;stroke-width:2}.nodeText,.mainText,.rel,.head{font-family:system-ui,-apple-system,sans-serif}.nodeText{fill:#14213d;font-size:18px;font-weight:700}.mainText{fill:#fffdf6;font-size:20px;font-weight:800}.rel{fill:#7b361f;font-size:14px;font-weight:750}.head{fill:#14213d;font-size:28px;font-weight:850}.edge{fill:none;stroke:#e4572e;stroke-width:3}</style></defs><rect class="bg" width="1000" height="700"/><text x="500" y="48" text-anchor="middle" class="head">5 · Le opere più significative</text><rect x="365" y="82" width="270" height="96" rx="18" class="mainNode"/><text x="500" y="124" class="mainText" text-anchor="middle"><tspan x="500" dy="0">Ogni opera è un</tspan><tspan x="500" dy="22">esperimento conoscitivo</tspan></text><rect x="50" y="282" width="270" height="96" rx="18" class="node"/><text x="185" y="334" class="nodeText" text-anchor="middle"><tspan x="185" dy="0">Sentiero e Antenati</tspan></text><rect x="365" y="282" width="270" height="96" rx="18" class="node"/><text x="500" y="324" class="nodeText" text-anchor="middle"><tspan x="500" dy="0">Cosmicomiche e Città</tspan><tspan x="500" dy="22">invisibili</tspan></text><rect x="680" y="282" width="270" height="96" rx="18" class="node"/><text x="815" y="324" class="nodeText" text-anchor="middle"><tspan x="815" dy="0">Castello, Viaggiatore,</tspan><tspan x="815" dy="22">Palomar</tspan></text><rect x="50" y="527" width="270" height="96" rx="18" class="node"/><text x="185" y="579" class="nodeText" text-anchor="middle"><tspan x="185" dy="0">Margine e allegoria</tspan></text><rect x="365" y="527" width="270" height="96" rx="18" class="node"/><text x="500" y="569" class="nodeText" text-anchor="middle"><tspan x="500" dy="0">Scala cosmica e modelli</tspan><tspan x="500" dy="22">urbani</tspan></text><rect x="680" y="527" width="270" height="96" rx="18" class="node"/><text x="815" y="579" class="nodeText" text-anchor="middle"><tspan x="815" dy="0">Vincolo, lettura e limite</tspan></text><path d="M455 178 L230 282" class="edge" marker-end="url(#arrow)"/><text x="330" y="224" class="rel" text-anchor="middle"><tspan x="330" dy="0">mette alla prova</tspan></text><path d="M500 178 L500 282" class="edge" marker-end="url(#arrow)"/><text x="500" y="230" class="rel" text-anchor="middle"><tspan x="500" dy="0">cambia scala con</tspan></text><path d="M545 178 L770 282" class="edge" marker-end="url(#arrow)"/><text x="670" y="224" class="rel" text-anchor="middle"><tspan x="670" dy="0">espone i meccanismi</tspan></text><path d="M185 378 L185 527" class="edge" marker-end="url(#arrow)"/><text x="185" y="454" class="rel" text-anchor="middle"><tspan x="185" dy="0">produce</tspan></text><path d="M500 378 L500 527" class="edge" marker-end="url(#arrow)"/><text x="500" y="454" class="rel" text-anchor="middle"><tspan x="500" dy="0">diventa</tspan></text><path d="M815 378 L815 527" class="edge" marker-end="url(#arrow)"/><text x="815" y="454" class="rel" text-anchor="middle"><tspan x="815" dy="0">verifica</tspan></text></svg>
