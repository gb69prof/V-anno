<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">2 · Le fratture</title><desc id="desc">Mappa concettuale con relazioni nominate sul percorso calviniano.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><style>.bg{fill:#fffdf6}.node{fill:#f4f0e6;stroke:#14213d;stroke-width:2}.mainNode{fill:#14213d;stroke:#14213d;stroke-width:2}.nodeText,.mainText,.rel,.head{font-family:system-ui,-apple-system,sans-serif}.nodeText{fill:#14213d;font-size:18px;font-weight:700}.mainText{fill:#fffdf6;font-size:20px;font-weight:800}.rel{fill:#7b361f;font-size:14px;font-weight:750}.head{fill:#14213d;font-size:28px;font-weight:850}.edge{fill:none;stroke:#e4572e;stroke-width:3}</style></defs><rect class="bg" width="1000" height="700"/><text x="500" y="48" text-anchor="middle" class="head">2 · Le fratture</text><rect x="365" y="82" width="270" height="96" rx="18" class="mainNode"/><text x="500" y="124" class="mainText" text-anchor="middle"><tspan x="500" dy="0">Una spiegazione unica non</tspan><tspan x="500" dy="22">basta più</tspan></text><rect x="50" y="282" width="270" height="96" rx="18" class="node"/><text x="185" y="324" class="nodeText" text-anchor="middle"><tspan x="185" dy="0">Memoria non pacificata</tspan><tspan x="185" dy="22">della guerra</tspan></text><rect x="365" y="282" width="270" height="96" rx="18" class="node"/><text x="500" y="324" class="nodeText" text-anchor="middle"><tspan x="500" dy="0">Crisi del 1956–1957 e</tspan><tspan x="500" dy="22">uscita dal PCI</tspan></text><rect x="680" y="282" width="270" height="96" rx="18" class="node"/><text x="815" y="324" class="nodeText" text-anchor="middle"><tspan x="815" dy="0">Modernizzazione, città e</tspan><tspan x="815" dy="22">consumo</tspan></text><rect x="50" y="527" width="270" height="96" rx="18" class="node"/><text x="185"