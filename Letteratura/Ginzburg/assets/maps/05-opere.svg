<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="t d"><title id="t">Le opere significative</title><desc id="d">La strada mette in crisi l’altrove; Tutti i nostri ieri porta la Storia in famiglia; Lessico famigliare trasforma parole in comunità; Le piccole virtù produce una morale; le lettere mostrano dispersione; il teatro mette in scena l’incomunicabilità.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#3f637b"/></marker><style>.n{fill:#fffdf7;stroke:#3f637b;stroke-width:2}.c{fill:#3f637b;stroke:#294657}.h{font:700 25px Georgia,serif;fill:#222}.w{font:700 27px Georgia,serif;fill:#fff}.s{font:18px -apple-system,sans-serif;fill:#4f4a43}.r{font:700 17px -apple-system,sans-serif;fill:#345a72}.e{fill:none;stroke:#3f637b;stroke-width:4;marker-end:url(#a)}</style></defs><rect width="1400" height="900" fill="#f0e9da"/><text x="70" y="70" class="h">05 · Le opere significative</text><rect x="50" y="140" rx="18" width="290" height="120" class="n"/><text x="195" y="183" text-anchor="middle" class="h">La strada</text><text x="195" y="215" text-anchor="middle" class="h">che va in città</text><text x="195" y="242" text-anchor="middle" class="s">miraggio dell’altrove</text><rect x="370" y="140" rx="18" width="290" height="120" class="n"/><text x="515" y="183" text-anchor="middle" class="h">Tutti i nostri ieri</text><text x="515" y="225" text-anchor="middle" class="s">Storia nelle famiglie</text><rect x="690" y="140" rx="18" width="290" height="120" class="c"/><text x="835" y="183" text-anchor="middle" class="w">Lessico</text><text x="835" y="215" text-anchor="middle" class="w">famigliare</text><text x="835" y="242" text-anchor="middle" class="w">parole = comunità</text><rect x="1010" y="140" rx="18" width="290" height="120" class="n"/><text x="1155" y="183" text-anchor="middle" class="h">Le piccole virtù</text><text x="1155" y="225" text-anchor="middle" class="s">morale dell’esperienza</text><rect x="230" y="470" rx="18" width="330" height="120" class="n"/><text x="395" y="513" text-anchor="middle" class="h">Caro Michele</text><text x="395" y="548" text-anchor="middle" class="s">assenza e lettere</text><rect x="610" y="470" rx="18" width="330" height="120" class="n"/><text x="775" y="513" text-anchor="middle" class="h">La città e la casa</text><text x="775" y="548" text-anchor="middle" class="s">legami dispersi</text><rect x="990" y="470" rx="18" width="330" height="120" class="n"/><text x="1155" y="513" text-anchor="middle" class="h">Teatro</text><text x="1155" y="548" text-anchor="middle" class="s">dialogo · incomunicabilità</text><rect x="475" y="720" rx="20" width="450" height="110" class="c"/><text x="700" y="765" text-anchor="middle" class="w">Letteratura del quotidiano</text><text x="700" y="800" text-anchor="middle" class="w">fare storia senza enfasi</text><path d="M340 200L370 200" class="e"/><text x="335" y="180" class="r">allarga lo sguardo</text><path d="M660 200L690 200" class="e"/><text x="655" y="180" class="r">confluisce nel</text><path d="M980 200L1010 200" class="e"/><text x="980" y="180" class="r">apre alla</text><path d="M835 260C790 360 510 360 420 470" class="e"/><text x="590" y="350" class="r">la comunità si dissolve in</text><path d="M835 260L785 470" class="e"/><text x="805" y="375" class="r">diventa</text><path d="M1155 260L1155 470" class="e"/><text x="1175" y="375" class="r">si mette in scena nel</text><path d="M395 590C420 690 550 670 620 720" class="e"/><path d="M775 590L730 720" class="e"/><path d="M1155 590C1100 690 900 670 820 720" class="e"/><text x="905" y="675" class="r">forme diverse costruiscono</text></svg>
