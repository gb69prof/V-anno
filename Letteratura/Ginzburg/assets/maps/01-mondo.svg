<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="t d">
<title id="t">Il mondo precedente</title><desc id="d">La grande Storia preme sulle vite; la casa Levi custodisce antifascismo e lessico; la letteratura chiede testimonianza; il limite delle grandi parole conduce alle fratture.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9b3f36"/></marker><style>.n{fill:#fffdf7;stroke:#6d6254;stroke-width:2}.c{fill:#9b3f36;stroke:#6e2924}.h{font:700 28px Georgia,serif;fill:#22231f}.w{font:700 28px Georgia,serif;fill:white}.s{font:20px -apple-system,sans-serif;fill:#4f4a43}.r{font:700 18px -apple-system,sans-serif;fill:#9b3f36}.e{fill:none;stroke:#9b3f36;stroke-width:4;marker-end:url(#a)}</style></defs>
<rect width="1400" height="900" fill="#f0e9da"/><text x="70" y="70" class="h">01 · Il mondo precedente</text>
<rect x="475" y="100" rx="22" width="450" height="120" class="c"/><text x="700" y="150" text-anchor="middle" class="w">Novecento delle grandi parole</text><text x="700" y="186" text-anchor="middle" class="w">fascismo · razza · guerra</text>
<rect x="90" y="350" rx="20" width="330" height="120" class="n"/><text x="255" y="397" text-anchor="middle" class="h">Casa Levi</text><text x="255" y="435" text-anchor="middle" class="s">antifascismo vissuto</text>
<rect x="535" y="350" rx="20" width="330" height="120" class="n"/><text x="700" y="397" text-anchor="middle" class="h">Vite concrete</text><text x="700" y="435" text-anchor="middle" class="s">nomi · case · relazioni</text>
<rect x="980" y="350" rx="20" width="330" height="120" class="n"/><text x="1145" y="397" text-anchor="middle" class="h">Letteratura</text><text x="1145" y="435" text-anchor="middle" class="s">urgenza di testimoniare</text>
<rect x="300" y="650" rx="20" width="350" height="120" class="n"/><text x="475" y="697" text-anchor="middle" class="h">Limite dell’enfasi</text><text x="475" y="735" text-anchor="middle" class="s">non dice una perdita singolare</text>
<rect x="750" y="650" rx="20" width="350" height="120" class="c"/><text x="925" y="697" text-anchor="middle" class="w">Fratture biografiche</text><text x="925" y="735" text-anchor="middle" class="w">il mondo diventa insufficiente</text>
<path d="M560 220 L310 350" class="e"/><text x="380" y="275" class="r">entra nella</text><path d="M700 220 L700 350" class="e"/><text x="718" y="290" class="r">preme sulle</text><path d="M840 220 L1090 350" class="e"/><text x="935" y="275" class="r">provoca</text><path d="M255 470 C260 590 420 565 465 650" class="e"/><text x="290" y="570" class="r">offre un’altra lingua</text><path d="M700 470 L510 650" class="e"/><text x="555" y="560" class="r">rende visibile il</text><path d="M650 710 L750 710" class="e"/><text x="670" y="688" class="r">prepara</text>
</svg>
