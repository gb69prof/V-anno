<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="t d"><title id="t">Le fratture della vita</title><desc id="d">Leone e l’antifascismo conducono al confino; la morte apre il lutto; il lutto richiede memoria sobria; Einaudi rende la scrittura mestiere; l’impegno civile allarga la responsabilità.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#a85b38"/></marker><style>.n{fill:#fffdf7;stroke:#6d6254;stroke-width:2}.c{fill:#a85b38;stroke:#71391f}.h{font:700 28px Georgia,serif;fill:#222}.w{font:700 28px Georgia,serif;fill:#fff}.s{font:20px -apple-system,sans-serif;fill:#4f4a43}.r{font:700 18px -apple-system,sans-serif;fill:#8c4528}.e{fill:none;stroke:#a85b38;stroke-width:4;marker-end:url(#a)}</style></defs><rect width="1400" height="900" fill="#f0e9da"/><text x="70" y="70" class="h">02 · Le fratture della vita</text><rect x="70" y="140" rx="20" width="300" height="120" class="n"/><text x="220" y="187" text-anchor="middle" class="h">Leone</text><text x="220" y="225" text-anchor="middle" class="s">legame umano e politico</text><rect x="550" y="140" rx="20" width="300" height="120" class="n"/><text x="700" y="187" text-anchor="middle" class="h">Confino</text><text x="700" y="225" text-anchor="middle" class="s">Pizzoli · 1940–1943</text><rect x="1030" y="140" rx="20" width="300" height="120" class="n"/><text x="1180" y="187" text-anchor="middle" class="h">Morte</text><text x="1180" y="225" text-anchor="middle" class="s">Leone · 5 febbraio 1944</text><rect x="130" y="440" rx="20" width="330" height="120" class="c"/><text x="295" y="487" text-anchor="middle" class="w">Memoria sobria</text><text x="295" y="525" text-anchor="middle" class="w">l’assenza nelle cose</text><rect x="535" y="440" rx="20" width="330" height="120" class="n"/><text x="700" y="487" text-anchor="middle" class="h">Einaudi</text><text x="700" y="525" text-anchor="middle" class="s">lettura · taglio · giudizio</text><rect x="940" y="440" rx="20" width="330" height="120" class="n"/><text x="1105" y="487" text-anchor="middle" class="h">Impegno civile</text><text x="1105" y="525" text-anchor="middle" class="s">vite e conseguenze</text><rect x="475" y="700" rx="20" width="450" height="120" class="c"/><text x="700" y="747" text-anchor="middle" class="w">Nuova immagine del mondo</text><text x="700" y="785" text-anchor="middle" class="w">fragilità · responsabilità</text><path d="M370 200L550 200" class="e"/><text x="418" y="180" class="r">conduce al</text><path d="M850 200L1030 200" class="e"/><text x="900" y="180" class="r">è seguito dalla</text><path d="M1120 260C1040 350 610 350 410 440" class="e"/><text x="770" y="335" class="r">rende necessaria</text><path d="M700 260L700 440" class="e"/><text x="720" y="360" class="r">diventa racconto</text><path d="M460 500L535 500" class="e"/><text x="470" y="480" class="r">incontra il mestiere</text><path d="M865 500L940 500" class="e"/><text x="870" y="480" class="r">allarga la responsabilità</text><path d="M700 560L700 700" class="e"/><text x="720" y="645" class="r">modifica la</text></svg>
