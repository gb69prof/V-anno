<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="t d"><title id="t">La poetica</title><desc id="d">La fragilità del reale richiede sottrazione; la sottrazione produce paratassi e lessico quotidiano; ripetizione e imperfetto generano memoria; autobiografia e montaggio costruiscono testimonianza; dialoghi e silenzi entrano nelle opere.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#665b76"/></marker><style>.n{fill:#fffdf7;stroke:#665b76;stroke-width:2}.c{fill:#665b76;stroke:#443a51}.h{font:700 27px Georgia,serif;fill:#222}.w{font:700 28px Georgia,serif;fill:#fff}.s{font:19px -apple-system,sans-serif;fill:#4f4a43}.r{font:700 18px -apple-system,sans-serif;fill:#5b4d6f}.e{fill:none;stroke:#665b76;stroke-width:4;marker-end:url(#a)}</style></defs><rect width="1400" height="900" fill="#f0e9da"/><text x="70" y="70" class="h">04 · La poetica</text><rect x="475" y="100" rx="22" width="450" height="120" class="c"/><text x="700" y="150" text-anchor="middle" class="w">Sottrazione precisa</text><text x="700" y="188" text-anchor="middle" class="w">meno esibizione · più verità</text><rect x="70" y="350" rx="20" width="300" height="120" class="n"/><text x="220" y="398" text-anchor="middle" class="h">Paratassi</text><text x="220" y="435" text-anchor="middle" class="s">senso nel montaggio</text><rect x="400" y="350" rx="20" width="300" height="120" class="n"/><text x="550" y="398" text-anchor="middle" class="h">Ripetizione</text><text x="550" y="435" text-anchor="middle" class="s">voce che ritorna</text><rect x="730" y="350" rx="20" width="300" height="120" class="n"/><text x="880" y="398" text-anchor="middle" class="h">Imperfetto</text><text x="880" y="435" text-anchor="middle" class="s">passato non chiuso</text><rect x="1060" y="350" rx="20" width="300" height="120" class="n"/><text x="1210" y="398" text-anchor="middle" class="h">Lessico</text><text x="1210" y="435" text-anchor="middle" class="s">archivio vivente</text><rect x="160" y="650" rx="20" width="330" height="120" class="n"/><text x="325" y="698" text-anchor="middle" class="h">Autobiografia</text><text x="325" y="735" text-anchor="middle" class="s">selezione · montaggio</text><rect x="535" y="650" rx="20" width="330" height="120" class="n"/><text x="700" y="698" text-anchor="middle" class="h">Dialogo</text><text x="700" y="735" text-anchor="middle" class="s">parola e silenzio</text><rect x="910" y="650" rx="20" width="330" height="120" class="c"/><text x="1075" y="698" text-anchor="middle" class="w">Opere</text><text x="1075" y="735" text-anchor="middle" class="w">la forma viene provata</text><path d="M570 220L250 350" class="e"/><text x="360" y="290" class="r">si traduce in</text><path d="M650 220L565 350" class="e"/><text x="570" y="290" class="r">usa la</text><path d="M750 220L865 350" class="e"/><text x="785" y="290" class="r">dilata con</text><path d="M830 220L1170 350" class="e"/><text x="980" y="290" class="r">custodisce il</text><path d="M550 470L355 650" class="e"/><text x="390" y="565" class="r">organizza la</text><path d="M880 470L730 650" class="e"/><text x="760" y="565" class="r">fa spazio al</text><path d="M865 710L910 710" class="e"/><text x="865" y="690" class="r">entra nelle</text></svg>
