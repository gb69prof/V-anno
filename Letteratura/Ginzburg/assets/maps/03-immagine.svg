<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="t d"><title id="t">L’immagine del mondo</title><desc id="d">Una realtà contraddittoria viene osservata nella famiglia; il lessico crea identità, la memoria resiste alla cancellazione, l’esperienza femminile mette in crisi il canone, la politica diventa prossimità e richiede una poetica essenziale.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#4b6a63"/></marker><style>.n{fill:#fffdf7;stroke:#5d6c66;stroke-width:2}.c{fill:#4b6a63;stroke:#304741}.h{font:700 27px Georgia,serif;fill:#222}.w{font:700 28px Georgia,serif;fill:#fff}.s{font:19px -apple-system,sans-serif;fill:#4f4a43}.r{font:700 18px -apple-system,sans-serif;fill:#3d6259}.e{fill:none;stroke:#4b6a63;stroke-width:4;marker-end:url(#a)}</style></defs><rect width="1400" height="900" fill="#f0e9da"/><text x="70" y="70" class="h">03 · L’immagine del mondo</text><rect x="475" y="100" rx="22" width="450" height="120" class="c"/><text x="700" y="150" text-anchor="middle" class="w">Realtà contraddittoria</text><text x="700" y="188" text-anchor="middle" class="w">senza spiegazione totale</text><rect x="60" y="350" rx="20" width="280" height="120" class="n"/><text x="200" y="398" text-anchor="middle" class="h">Famiglia</text><text x="200" y="435" text-anchor="middle" class="s">protegge e ferisce</text><rect x="395" y="350" rx="20" width="280" height="120" class="n"/><text x="535" y="398" text-anchor="middle" class="h">Lessico</text><text x="535" y="435" text-anchor="middle" class="s">identità relazionale</text><rect x="730" y="350" rx="20" width="280" height="120" class="n"/><text x="870" y="398" text-anchor="middle" class="h">Memoria</text><text x="870" y="435" text-anchor="middle" class="s">non nostalgia</text><rect x="1065" y="350" rx="20" width="280" height="120" class="n"/><text x="1205" y="398" text-anchor="middle" class="h">Donne</text><text x="1205" y="435" text-anchor="middle" class="s">esperienza e tensione</text><rect x="260" y="650" rx="20" width="350" height="120" class="n"/><text x="435" y="698" text-anchor="middle" class="h">Politica</text><text x="435" y="735" text-anchor="middle" class="s">etica della prossimità</text><rect x="790" y="650" rx="20" width="350" height="120" class="c"/><text x="965" y="698" text-anchor="middle" class="w">Poetica essenziale</text><text x="965" y="735" text-anchor="middle" class="w">forma proporzionata</text><path d="M570 220L240 350" class="e"/><text x="355" y="285" class="r">si osserva nella</text><path d="M650 220L550 350" class="e"/><text x="570" y="290" class="r">si conserva nel</text><path d="M750 220L850 350" class="e"/><text x="795" y="290" class="r">resiste con la</text><path d="M830 220L1160 350" class="e"/><text x="1000" y="285" class="r">mette in crisi il canone</text><path d="M200 470C220 590 350 570 410 650" class="e"/><text x="250" y="570" class="r">diventa criterio di</text><path d="M870 470C890 560 940 570 960 650" class="e"/><text x="900" y="565" class="r">richiede una</text><path d="M610 710L790 710" class="e"/><text x="665" y="690" class="r">confluisce nella</text></svg>
