<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="t d"><title id="t">Conclusione</title><desc id="d">Il mondo delle grandi parole è messo in crisi dalle fratture; nasce una visione fragile che richiede poetica essenziale; le opere lasciano un metodo di attenzione e aprono la domanda sul lessico condiviso.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#7d6639"/></marker><style>.n{fill:#fffdf7;stroke:#7d6639;stroke-width:2}.c{fill:#7d6639;stroke:#53431f}.h{font:700 27px Georgia,serif;fill:#222}.w{font:700 27px Georgia,serif;fill:#fff}.s{font:18px -apple-system,sans-serif;fill:#4f4a43}.r{font:700 17px -apple-system,sans-serif;fill:#665127}.e{fill:none;stroke:#7d6639;stroke-width:4;marker-end:url(#a)}</style></defs><rect width="1400" height="900" fill="#f0e9da"/><text x="70" y="70" class="h">06 · Conclusione: la catena che resta</text><rect x="70" y="130" rx="18" width="300" height="115" class="n"/><text x="220" y="175" text-anchor="middle" class="h">Mondo</text><text x="220" y="212" text-anchor="middle" class="s">grandi parole</text><rect x="550" y="130" rx="18" width="300" height="115" class="n"/><text x="700" y="175" text-anchor="middle" class="h">Fratture</text><text x="700" y="212" text-anchor="middle" class="s">vite irriducibili</text><rect x="1030" y="130" rx="18" width="300" height="115" class="n"/><text x="1180" y="175" text-anchor="middle" class="h">Visione</text><text x="1180" y="212" text-anchor="middle" class="s">fragilità responsabile</text><rect x="70" y="430" rx="18" width="300" height="115" class="n"/><text x="220" y="475" text-anchor="middle" class="h">Poetica</text><text x="220" y="512" text-anchor="middle" class="s">sottrazione</text><rect x="550" y="430" rx="18" width="300" height="115" class="n"/><text x="700" y="475" text-anchor="middle" class="h">Opere</text><text x="700" y="512" text-anchor="middle" class="s">forme messe alla prova</text><rect x="1030" y="430" rx="18" width="300" height="115" class="c"/><text x="1180" y="475" text-anchor="middle" class="w">Eredità</text><text x="1180" y="512" text-anchor="middle" class="w">metodo di attenzione</text><rect x="395" y="730" rx="20" width="610" height="115" class="c"/><text x="700" y="775" text-anchor="middle" class="w">Domanda viva</text><text x="700" y="812" text-anchor="middle" class="w">parole comuni senza slogan?</text><path d="M370 187L550 187" class="e"/><text x="420" y="165" class="r">è messo in crisi da</text><path d="M850 187L1030 187" class="e"/><text x="910" y="165" class="r">produce una</text><path d="M1180 245C1180 350 310 340 245 430" class="e"/><text x="675" y="330" class="r">rende necessaria una</text><path d="M370 487L550 487" class="e"/><text x="425" y="465" class="r">confluisce nelle</text><path d="M850 487L1030 487" class="e"/><text x="895" y="465" class="r">lascia un</text><path d="M1140 545C1090 670 900 680 835 730" class="e"/><text x="965" y="660" class="r">riapre la</text></svg>
