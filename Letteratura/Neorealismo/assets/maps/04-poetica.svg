<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#364f46"/></marker><style>.bg{fill:#f7f4eb}.n{fill:#fff;stroke:#364f46;stroke-width:3}.c{fill:#364f46}.t{font:700 24px Georgia,serif;fill:#171a18}.w{fill:#fff}.s{font:18px Arial,sans-serif;fill:#373a36}.r{font:700 16px Arial,sans-serif;fill:#364f46}.l{stroke:#364f46;stroke-width:3;marker-end:url(#a);fill:none}</style></defs><rect class="bg" width="1200" height="760"/><text x="60" y="60" class="t" font-size="34">04 · La poetica</text><rect x="400" y="275" width="400" height="170" rx="8" class="c"/><text x="600" y="335" text-anchor="middle" class="t w">COSTRUIRE IL VERO</text><text x="600" y="374" text-anchor="middle" class="s w">la semplicità è un effetto</text><rect x="60" y="110" width="320" height="110" rx="8" class="n"/><text x="220" y="153" text-anchor="middle" class="t">Costellazione</text><text x="220" y="187" text-anchor="middle" class="s">esclude un manifesto unico</text><rect x="820" y="110" width="320" height="110" rx="8" class="n"/><text x="980" y="153" text-anchor="middle" class="t">Oralità e dialetti</text><text x="980" y="187" text-anchor="middle" class="s">producono vicinanza</text><rect x="50" y="500" width="340" height="110" rx="8" class="n"/><text x="220" y="542" text-anchor="middle" class="t">Luoghi e corpi</text><text x="220" y="575" text-anchor="middle" class="s">radicano le storie</text><rect x="430" y="575" width="340" height="110" rx="8" class="n"/><text x="600" y="617" text-anchor="middle" class="t">Ibridazione</text><text x="600" y="650" text-anchor="middle" class="s">lega documento e finzione</text><rect x="810" y="500" width="340" height="110" rx="8" class="n"/><text x="980" y="542" text-anchor="middle" class="t">Maniera</text><text x="980" y="575" text-anchor="middle" class="s">ripete segni senza domande</text><path d="M380 185L455 275" class="l"/><text x="385" y="230" class="r">moltiplica</text><path d="M820 185L745 275" class="l"/><text x="760" y="230" class="r">si traduce in</text><path d="M390 545L455 445" class="l"/><text x="360" y="490" class="r">incarna</text><path d="M600 575V450" class="l"/><text x="615" y="520" class="r">confluisce in</text><path d="M810 545L745 445" class="l"/><text x="760" y="490" class="r">minaccia</text></svg>
