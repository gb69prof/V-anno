<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#9c342d"/></marker><style>.bg{fill:#f7f4eb}.n{fill:#fff;stroke:#4f4840;stroke-width:3}.t{font:700 22px Georgia,serif;fill:#171a18}.s{font:16px Arial,sans-serif;fill:#373a36}.r{font:700 15px Arial,sans-serif;fill:#9c342d}.l{stroke:#9c342d;stroke-width:4;marker-end:url(#a);fill:none}</style></defs><rect class="bg" width="1200" height="760"/><text x="60" y="60" class="t" font-size="34">Neorealismo · La catena interpretativa</text><rect x="70" y="120" width="300" height="100" rx="8" class="n"/><text x="220" y="160" text-anchor="middle" class="t">1 · Mondo precedente</text><text x="220" y="190" text-anchor="middle" class="s">immagine amministrata</text><rect x="450" y="120" width="300" height="100" rx="8" class="n"/><text x="600" y="160" text-anchor="middle" class="t">2 · Fratture</text><text x="600" y="190" text-anchor="middle" class="s">la storia entra nelle vite</text><rect x="830" y="120" width="300" height="100" rx="8" class="n"/><text x="980" y="160" text-anchor="middle" class="t">3 · Immagine</text><text x="980" y="190" text-anchor="middle" class="s">reale plurale e quotidiano</text><rect x="830" y="480" width="300" height="100" rx="8" class="n"/><text x="980" y="520" text-anchor="middle" class="t">4 · Poetica</text><text x="980" y="550" text-anchor="middle" class="s">costruisce lo sguardo</text><rect x="450" y="480" width="300" height="100" rx="8" class="n"/><text x="600" y="520" text-anchor="middle" class="t">5 · Opere</text><text x="600" y="550" text-anchor="middle" class="s">superano la formula</text><rect x="70" y="480" width="300" height="100" rx="8" class="n"/><text x="220" y="520" text-anchor="middle" class="t">6 · Conclusione</text><text x="220" y="550" text-anchor="middle" class="s">rinnova la domanda</text><path d="M370 170H445" class="l"/><text x="380" y="153" class="r">diventa insufficiente</text><path d="M750 170H825" class="l"/><text x="775" y="153" class="r">produce</text><path d="M980 220V475" class="l"/><text x="995" y="355" class="r">richiede</text><path d="M830 530H755" class="l"/><text x="760" y="513" class="r">si verifica in</text><path d="M450 530H375" class="l"/><text x="377" y="513" class="r">lascia</text><path d="M220 480V225" class="l"/><text x="235" y="355" class="r">interroga di nuovo</text><text x="600" y="690" text-anchor="middle" class="t" font-size="27">Il realismo vivo modifica ciò che siamo capaci di vedere.</text></svg>
