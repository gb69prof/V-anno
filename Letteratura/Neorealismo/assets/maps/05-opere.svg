<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#4f4840"/></marker><style>.bg{fill:#f7f4eb}.n{fill:#fff;stroke:#4f4840;stroke-width:3}.c{fill:#4f4840}.t{font:700 22px Georgia,serif;fill:#171a18}.w{fill:#fff}.s{font:17px Arial,sans-serif;fill:#373a36}.r{font:700 15px Arial,sans-serif;fill:#7b2f2a}.l{stroke:#7b2f2a;stroke-width:3;marker-end:url(#a);fill:none}</style></defs><rect class="bg" width="1200" height="760"/><text x="60" y="55" class="t" font-size="34">05 · Le opere</text><rect x="410" y="290" width="380" height="150" rx="8" class="c"/><text x="600" y="345" text-anchor="middle" class="t w">SEI FORME SINGOLARI</text><text x="600" y="382" text-anchor="middle" class="s w">l’opera supera la formula</text><rect x="45" y="100" width="315" height="100" rx="8" class="n"/><text x="202" y="140" text-anchor="middle" class="t">Roma città aperta</text><text x="202" y="170" text-anchor="middle" class="s">costruisce la comunità</text><rect x="442" y="90" width="315" height="100" rx="8" class="n"/><text x="600" y="130" text-anchor="middle" class="t">Ladri di biciclette</text><text x="600" y="160" text-anchor="middle" class="s">un oggetto rivela il sistema</text><rect x="840" y="100" width="315" height="100" rx="8" class="n"/><text x="997" y="140" text-anchor="middle" class="t">Il sentiero</text><text x="997" y="170" text-anchor="middle" class="s">guarda la guerra di scorcio</text><rect x="45" y="540" width="315" height="100" rx="8" class="n"/><text x="202" y="580" text-anchor="middle" class="t">Se questo è un uomo</text><text x="202" y="610" text-anchor="middle" class="s">misura la testimonianza</text><rect x="442" y="570" width="315" height="100" rx="8" class="n"/><text x="600" y="610" text-anchor="middle" class="t">La luna e i falò</text><text x="600" y="640" text-anchor="middle" class="s">intreccia memoria e mito</text><rect x="840" y="540" width="315" height="100" rx="8" class="n"/><text x="997" y="580" text-anchor="middle" class="t">Una questione privata</text><text x="997" y="610" text-anchor="middle" class="s">crea un’epica antieroica</text><path d="M300 200L475 290" class="l"/><text x="360" y="235" class="r">incarna</text><path d="M600 190V285" class="l"/><text x="615" y="245" class="r">concentra</text><path d="M900 200L725 290" class="l"/><text x="795" y="235" class="r">sposta</text><path d="M300 540L475 440" class="l"/><text x="360" y="495" class="r">interroga</text><path d="M600 570V445" class="l"/><text x="615" y="515" class="r">oltrepassa</text><path d="M900 540L725 440" class="l"/><text x="795" y="495" class="r">complica</text></svg>
