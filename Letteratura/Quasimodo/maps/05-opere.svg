<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Le opere decisive</title><desc id="d">Le raccolte mettono alla prova la poetica dall’isola al bilancio finale.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#a74f38"/></marker><style>.b{fill:#fff9ec;stroke:#315b58;stroke-width:3}.c{fill:#182724;stroke:#d8a75b;stroke-width:5}.l{stroke:#a74f38;stroke-width:3;marker-end:url(#a);fill:none}.h{font:700 24px Georgia,serif;fill:#172622}.p{font:18px Arial,sans-serif;fill:#315b58}.r{font:700 16px Arial,sans-serif;fill:#a74f38}</style></defs><rect width="1200" height="760" rx="38" fill="#f5f0e5"/><rect class="c" x="430" y="300" width="340" height="145" rx="28"/><text x="600" y="358" text-anchor="middle" font-family="Georgia" font-size="34" font-weight="700" fill="#fff">OPERE</text><text x="600" y="400" text-anchor="middle" font-family="Arial" font-size="22" fill="#e7d5a9">la poetica alla prova</text><rect class="b" x="25" y="45" width="345" height="125" rx="22"/><text class="h" x="198" y="92" text-anchor="middle">Acque e terre</text><text class="p" x="198" y="132" text-anchor="middle">costruisce l’isola</text><rect class="b" x="830" y="45" width="345" height="125" rx="22"/><text class="h" x="1002" y="92" text-anchor="middle">Òboe sommerso</text><text class="p" x="1002" y="132" text-anchor="middle">radicalizza l’Ermetismo</text><rect class="b" x="25" y="590" width="345" height="125" rx="22"/><text class="h" x="198" y="637" text-anchor="middle">Lirici greci</text><text class="p" x="198" y="677" text-anchor="middle">moltiplica le voci</text><rect class="b" x="830" y="590" width="345" height="125" rx="22"/><text class="h" x="1002" y="637" text-anchor="middle">Giorno dopo giorno</text><text class="p" x="1002" y="677" text-anchor="middle">dà data al dolore</text><path class="l" d="M370 110C455 170 485 245 525 300"/><text class="r" x="425" y="190">origina</text><path class="l" d="M830 110C745 170 715 245 675 300"/><text class="r" x="730" y="190">concentra</text><path class="l" d="M370 650C455 595 485 505 525 445"/><text class="r" x="420" y="575">trasforma</text><path class="l" d="M830 650C745 595 715 505 675 445"/><text class="r" x="720" y="575">storicizza</text><rect class="b" x="410" y="615" width="380" height="100" rx="22"/><text class="h" x="600" y="655" text-anchor="middle">Terra impareggiabile · Dare e avere</text><text class="p" x="600" y="690" text-anchor="middle">ricompongono un bilancio aperto</text><path class="l" d="M600 615V455"/><text class="r" x="615" y="540">ritorna e valuta</text></svg>
