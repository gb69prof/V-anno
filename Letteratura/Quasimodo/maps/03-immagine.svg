<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">L’immagine del mondo</title><desc id="d">Dall’isola perduta alla testimonianza della storia.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#a74f38"/></marker><style>.b{fill:#fff9ec;stroke:#315b58;stroke-width:3}.c{fill:#182724;stroke:#d8a75b;stroke-width:5}.l{stroke:#a74f38;stroke-width:3;marker-end:url(#a);fill:none}.h{font:700 27px Georgia,serif;fill:#172622}.p{font:20px Arial,sans-serif;fill:#315b58}.r{font:700 17px Arial,sans-serif;fill:#a74f38}</style></defs><rect width="1200" height="760" rx="38" fill="#f5f0e5"/><rect class="c" x="430" y="300" width="340" height="145" rx="28"/><text x="600" y="355" text-anchor="middle" font-family="Georgia" font-size="34" font-weight="700" fill="#fff">REALTÀ</text><text x="600" y="400" text-anchor="middle" font-family="Arial" font-size="22" fill="#e7d5a9">distanza e responsabilità</text><rect class="b" x="40" y="55" width="320" height="125" rx="22"/><text class="h" x="200" y="105" text-anchor="middle">Isola interiore</text><text class="p" x="200" y="145" text-anchor="middle">origine riconosciuta perdendo</text><rect class="b" x="840" y="55" width="320" height="125" rx="22"/><text class="h" x="1000" y="105" text-anchor="middle">Tempo e sera</text><text class="p" x="1000" y="145" text-anchor="middle">ogni presenza è precaria</text><rect class="b" x="40" y="580" width="320" height="125" rx="22"/><text class="h" x="200" y="630" text-anchor="middle">Mito e frammento</text><text class="p" x="200" y="670" text-anchor="middle">il resto parla al presente</text><rect class="b" x="840" y="580" width="320" height="125" rx="22"/><text class="h" x="1000" y="630" text-anchor="middle">Vittime storiche</text><text class="p" x="1000" y="670" text-anchor="middle">solitudine condivisa</text><path class="l" d="M360 125C450 175 480 245 520 300"/><text class="r" x="420" y="195">fonda</text><path class="l" d="M840 125C750 175 720 245 680 300"/><text class="r" x="735" y="195">rivela</text><path class="l" d="M360 640C450 595 480 505 520 445"/><text class="r" x="415" y="570">dà profondità</text><path class="l" d="M840 640C750 595 720 505 680 445"/><text class="r" x="725" y="570">esige testimonianza</text></svg>
