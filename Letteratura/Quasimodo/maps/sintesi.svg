<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="t d"><title id="t">Quasimodo in sei movimenti</title><desc id="d">Catena interpretativa completa dal mondo precedente all’eredità.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#c9913f"/></marker><style>.n{fill:#182724;stroke:#d8a75b;stroke-width:4}.l{stroke:#c9913f;stroke-width:4;marker-end:url(#a);fill:none}.h{font:700 27px Georgia,serif;fill:#fff}.p{font:19px Arial,sans-serif;fill:#e8dcc0}.r{font:700 17px Arial,sans-serif;fill:#a74f38}</style></defs><rect width="1200" height="820" rx="38" fill="#f5f0e5"/><text x="600" y="60" text-anchor="middle" font-family="Georgia" font-size="38" font-weight="700" fill="#172622">Dall’isola alla storia, e ritorno</text><rect class="n" x="70" y="105" width="430" height="120" rx="22"/><text class="h" x="285" y="150" text-anchor="middle">1 · Mondo precedente</text><text class="p" x="285" y="188" text-anchor="middle">progresso, crisi e lingua insufficiente</text><rect class="n" x="700" y="105" width="430" height="120" rx="22"/><text class="h" x="915" y="150" text-anchor="middle">2 · Fratture</text><text class="p" x="915" y="188" text-anchor="middle">casa perduta, traduzioni e guerra</text><path class="l" d="M500 165H690"/><text class="r" x="595" y="145" text-anchor="middle">diventa esperienza</text><rect class="n" x="700" y="350" width="430" height="120" rx="22"/><text class="h" x="915" y="395" text-anchor="middle">3 · Immagine del mondo</text><text class="p" x="915" y="433" text-anchor="middle">distanza, solitudine, responsabilità</text><path class="l" d="M915 225V340"/><text class="r" x="935" y="290">modifica</text><rect class="n" x="70" y="350" width="430" height="120" rx="22"/><text class="h" x="285" y="395" text-anchor="middle">4 · Poetica</text><text class="p" x="285" y="433" text-anchor="middle">dalla parola al discorso</text><path class="l" d="M700 410H510"/><text class="r" x="605" y="390" text-anchor="middle">richiede una forma</text><rect class="n" x="70" y="595" width="430" height="120" rx="22"/><text class="h" x="285" y="640" text-anchor="middle">5 · Opere</text><text class="p" x="285" y="678" text-anchor="middle">verificano intensità e rischi</text><path class="l" d="M285 470V585"/><text class="r" x="305" y="535">si mette alla prova</text><rect class="n" x="700" y="595" width="430" height="120" rx="22"/><text class="h" x="915" y="640" text-anchor="middle">6 · Eredità</text><text class="p" x="915" y="678" text-anchor="middle">chiarezza o complessità?</text><path class="l" d="M500 655H690"/><text class="r" x="595" y="635" text-anchor="middle">lascia aperto</text><path class="l" d="M915 715C900 785 270 800 285 725"/><text class="r" x="600" y="785" text-anchor="middle">l’origine ritorna trasformata dalla storia</text></svg>
