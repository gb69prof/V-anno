<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Le fratture della vita</title><desc id="d">Le fratture trasformano la mobilità in esilio e la solitudine in responsabilità.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#b45b3f"/></marker><style>.b{fill:#fff9ec;stroke:#315b58;stroke-width:3}.c{fill:#182724;stroke:#d8a75b;stroke-width:5}.l{stroke:#b45b3f;stroke-width:3;marker-end:url(#a);fill:none}.h{font:700 28px Georgia,serif;fill:#172622}.p{font:21px Arial,sans-serif;fill:#315b58}.r{font:700 18px Arial,sans-serif;fill:#a74f38}</style></defs><rect width="1200" height="760" rx="38" fill="#f5f0e5"/><rect class="c" x="420" y="300" width="360" height="145" rx="28"/><text x="600" y="360" text-anchor="middle" font-family="Georgia" font-size="35" font-weight="700" fill="#fff">FRATTURE</text><text x="600" y="402" text-anchor="middle" font-family="Arial" font-size="22" fill="#e7d5a9">la casa diventa distanza</text><rect class="b" x="35" y="70" width="330" height="120" rx="22"/><text class="h" x="200" y="118" text-anchor="middle">1908 · Messina</text><text class="p" x="200" y="158" text-anchor="middle">rovine e provvisorietà</text><rect class="b" x="835" y="70" width="330" height="120" rx="22"/><text class="h" x="1000" y="118" text-anchor="middle">Partenza e lavoro</text><text class="p" x="1000" y="158" text-anchor="middle">Roma · Genio civile</text><rect class="b" x="35" y="570" width="330" height="120" rx="22"/><text class="h" x="200" y="618" text-anchor="middle">Riviste e classici</text><text class="p" x="200" y="658" text-anchor="middle">Solaria · traduzioni</text><rect class="b" x="835" y="570" width="330" height="120" rx="22"/><text class="h" x="1000" y="618" text-anchor="middle">Guerra e Nobel</text><text class="p" x="1000" y="658" text-anchor="middle">storia · figura pubblica</text><path class="l" d="M365 150C445 190 480 250 515 300"/><text class="r" x="420" y="205">incrina</text><path class="l" d="M835 150C755 190 720 250 685 300"/><text class="r" x="725" y="205">allontana</text><path class="l" d="M365 630C450 590 480 500 520 445"/><text class="r" x="410" y="565">dà strumenti</text><path class="l" d="M835 630C750 590 720 500 680 445"/><text class="r" x="725" y="565">allarga la voce</text></svg>
