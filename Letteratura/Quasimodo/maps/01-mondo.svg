<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Il mondo precedente</title><desc id="d">Mappa del contesto che prepara la ricerca di Quasimodo.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#a74f38"/></marker><style>.b{fill:#fff8e9;stroke:#315b58;stroke-width:3}.c{fill:#182724;stroke:#c9913f;stroke-width:5}.l{stroke:#a74f38;stroke-width:3;marker-end:url(#a);fill:none}.h{font:700 30px Georgia,serif;fill:#172622}.p{font:22px Arial,sans-serif;fill:#315b58}.r{font:700 18px Arial,sans-serif;fill:#a74f38}</style></defs><rect width="1200" height="760" rx="38" fill="#f5f0e5"/><rect class="c" x="430" y="285" width="340" height="150" rx="28"/><text x="600" y="345" text-anchor="middle" font-family="Georgia" font-size="35" font-weight="700" fill="#fff">MONDO RICEVUTO</text><text x="600" y="390" text-anchor="middle" font-family="Arial" font-size="22" fill="#e7d5a9">una lingua che non basta</text><rect class="b" x="55" y="70" width="310" height="120" rx="22"/><text class="h" x="210" y="120" text-anchor="middle">Crisi del progresso</text><text class="p" x="210" y="158" text-anchor="middle">tecnica ≠ civiltà morale</text><rect class="b" x="835" y="70" width="310" height="120" rx="22"/><text class="h" x="990" y="120" text-anchor="middle">Nuova lirica</text><text class="p" x="990" y="158" text-anchor="middle">frammento · analogia</text><rect class="b" x="55" y="570" width="310" height="120" rx="22"/><text class="h" x="210" y="620" text-anchor="middle">Fascismo</text><text class="p" x="210" y="658" text-anchor="middle">lingua pubblica controllata</text><rect class="b" x="835" y="570" width="310" height="120" rx="22"/><text class="h" x="990" y="620" text-anchor="middle">Sicilia mobile</text><text class="p" x="990" y="658" text-anchor="middle">ferrovie · sisma · distanza</text><path class="l" d="M365 145C450 165 470 235 500 285"/><text class="r" x=