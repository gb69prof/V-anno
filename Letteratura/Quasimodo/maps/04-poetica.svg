<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">La poetica</title><desc id="d">La parola concentrata si trasforma attraverso immagini e traduzione in discorso civile.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#a74f38"/></marker><style>.b{fill:#fff9ec;stroke:#315b58;stroke-width:3}.c{fill:#182724;stroke:#d8a75b;stroke-width:5}.l{stroke:#a74f38;stroke-width:3;marker-end:url(#a);fill:none}.h{font:700 27px Georgia,serif;fill:#172622}.p{font:20px Arial,sans-serif;fill:#315b58}.r{font:700 17px Arial,sans-serif;fill:#a74f38}</style></defs><rect width="1200" height="760" rx="38" fill="#f5f0e5"/><rect class="c" x="425" y="298" width="350" height="150" rx="28"/><text x="600" y="355" text-anchor="middle" font-family="Georgia" font-size="34" font-weight="700" fill="#fff">POETICA</text><text x="600" y="400" text-anchor="middle" font-family="Arial" font-size="22" fill="#e7d5a9">verità libera nella storia</text><rect class="b" x="30" y="50" width="335" height="130" rx="22"/><text class="h" x="198" y="102" text-anchor="middle">Parola concentrata</text><text class="p" x="198" y="145" text-anchor="middle">alta pressione semantica</text><rect class="b" x="835" y="50" width="335" height="130" rx="22"/><text class="h" x="1002" y="102" text-anchor="middle">Grammatica ermetica</text><text class="p" x="1002" y="145" text-anchor="middle">nomi · analogie · silenzi</text><rect class="b" x="30" y="575" width="335" height="130" rx="22"/><text class="h" x="198" y="627" text-anchor="middle">Montaggio visivo</text><text class="p" x="198" y="670" text-anchor="middle">luce · colore · contrasto</text><rect class="b" x="835" y="575" width="335" height="130" rx="22"/><text class="h" x="1002" y="627" text-anchor="middle">Traduzione</text><text class="p" x="1002" y="670" text-anchor="middle">insegna un’altra misura</text><path class="l" d="M365 120C450 170 480 245 520 298"/><text class="r" x="420" y="190">condensa</text><path class="l" d="M835 120C750 170 720 245 680 298"/><text class="r" x="730" y="190">organizza</text><path class="l" d="M365 640C450 590 480 505 520 448"/><text class="r" x="415" y="570">rende concreto</text><path class="l" d="M835 640C750 590 720 505 680 448"/><text class="r" x="725" y="570">apre al discorso</text></svg>
