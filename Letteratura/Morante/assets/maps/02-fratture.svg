<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Le fratture nella vita di Elsa Morante</title>
  <desc id="desc">La mappa presenta sei esperienze che rendono insufficiente il mondo ricevuto: identità familiare complessa, disuguaglianze dell'infanzia, guerra in Ciociaria, autonomia nel rapporto con Moravia, lutti e separazioni, polemiche attorno alla Storia. Sono contesti interpretativi, non cause automatiche delle opere.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 11 6 1 11Z" fill="#8d1f2d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#171513" flood-opacity=".15"/></filter>
    <style>.bg{fill:#f6f0e3}.node{fill:#fffaf0;stroke:#171513;stroke-width:2}.central{fill:#8d1f2d;stroke:#171513;stroke-width:3}.accent{fill:#8d1f2d}.line{fill:none;stroke:#8d1f2d;stroke-width:4;marker-end:url(#arrow)}.ct{font:700 31px Georgia,serif;fill:#fffaf0;text-anchor:middle}.nt{font:700 25px Georgia,serif;fill:#171513;text-anchor:middle}.sub{font:20px Arial,sans-serif;fill:#171513;text-anchor:middle}.rel{font:700 18px Arial,sans-serif;fill:#8d1f2d;text-anchor:middle}.tag{fill:#f6f0e3;stroke:#8d1f2d;stroke-width:1}.foot{font:17px Arial,sans-serif;fill:#4a433d;text-anchor:middle}</style>
  </defs>
  <rect class="bg" width="1400" height="900"/><text x="70" y="55" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#8d1f2d" letter-spacing="2">02 · LE FRATTURE</text>
  <path class="line" d="M530 190 C500 245 255 245 230 300"/><path class="line" d="M700 190 L700 300"/><path class="line" d="M870 190 C900 245 1145 245 1170 300"/><path class="line" d="M230 440 L230 650"/><path class="line" d="M700 440 L700 650"/><path class="line" d="M1170 440 L1170 650"/>
  <g><rect class="tag" x="328" y="217" width="190" height="34" rx="17"/><text class="rel" x="423" y="240">rende instabile</text></g><g><rect class="tag" x="625" y="225" width="150" height="34" rx="17"/><text class="rel" x="700" y="248">espone alla</text></g><g><rect class="tag" x="902" y="217" width="180" height="34" rx="17"/><text class="rel" x="992" y="240">mette alla prova</text></g>
  <g><rect class="tag" x="135" y="522" width="190" height="34" rx="17"/><text class="rel" x="230" y="545">offre un contesto</text></g><g><rect class="tag" x="612" y="522" width="176" height="34" rx="17"/><text class="rel" x="700" y="545">accentua la</text></g><g><rect class="tag" x="1075" y="522" width="190" height="34" rx="17"/><text class="rel" x="1170" y="545">riapre il conflitto</text></g>
  <g filter="url(#shadow)"><rect class="central" x="470" y="50" width="460" height="140" rx="28"/><text class="ct" x="700" y="110" style="font-size:28px">LE FRATTURE VISSUTE</text><text x="700" y="148" font-family="Arial,sans-serif" font-size="21" fill="#fffaf0" text-anchor="middle">esperienze che rendono insufficiente il già dato</text></g>
  <g filter="url(#shadow)"><rect class="node" x="40" y="300" width="380" height="140" rx="22"/><rect class="accent" x="40" y="300" width="12" height="140" rx="6"/><text class="nt" x="230" y="348">Identità familiare</text><text class="sub" x="230" y="386">padre biologico e padre anagrafico:</text><text class="sub" x="230" y="414">verità, nome, appartenenza</text></g>
  <g filter="url(#shadow)"><rect class="node" x="510" y="300" width="380" height="140" rx="22"/><rect class="accent" x="510" y="300" width="12" height="140" rx="6"/><text class="nt" x="700" y="348">Disuguaglianze precoci</text><text class="sub" x="700" y="386">ambienti sociali diversi rendono</text><text class="sub" x="700" y="414">sensibile la distanza fra le vite</text></g>
  <g filter="url(#shadow)"><rect class="node" x="980" y="300" width="380" height="140" rx="22"/><rect class="accent" x="980" y="300" width="12" height="140" rx="6"/><text class="nt" x="1170" y="348">Guerra e rifugio</text><text class="sub" x="1170" y="386">la fuga in Ciociaria avvicina</text><text class="sub" x="1170" y="414">la violenza storica ai corpi</text></g>
  <g filter="url(#shadow)"><rect class="node" x="40" y="650" width="380" height="140" rx="22"/><rect class="accent" x="40" y="650" width="12" height="140" rx="6"/><text class="nt" x="230" y="698">Moravia e autonomia</text><text class="sub" x="230" y="736">il sodalizio apre il mondo culturale,</text><text class="sub" x="230" y="764">ma Morante difende una voce propria</text></g>
  <g filter="url(#shadow)"><rect class="node" x="510" y="650" width="380" height="140" rx="22"/><rect class="accent" x="510" y="650" width="12" height="140" rx="6"/><text class="nt" x="700" y="698">Separazioni e lutti</text><text class="sub" x="700" y="736">la perdita offre un contesto per</text><text class="sub" x="700" y="764">innocenza ferita e memoria</text></g>
  <g filter="url(#shadow)"><rect class="node" x="980" y="650" width="380" height="140" rx="22"/><rect class="accent" x="980" y="650" width="12" height="140" rx="6"/><text class="nt" x="1170" y="698">Il caso «La Storia»</text><text class="sub" x="1170" y="736">successo popolare e scontro critico</text><text class="sub" x="1170" y="764">rafforzano l'isolamento</text></g>
  <text class="foot" x="700" y="850">Cautela critica: una vita rende intelligibili certe tensioni; non determina meccanicamente i testi.</text><text class="foot" x="700" y="876">Ponte: dalle fratture emerge una visione fondata sull'opposizione fra Realtà e Potere.</text>
</svg>
