<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">La poetica di Elsa Morante</title>
  <desc id="desc">Per dire il conflitto tra Realtà e Irrealtà, Morante intreccia realismo simbolico, mito e fiaba, psiche e memoria, lingua alta e parlata, narratore empatico e forma dell'opera-mondo. L'immaginazione non evade dal reale: ne rivela le ferite e le possibilità.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 11 6 1 11Z" fill="#8d1f2d"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#171513" flood-opacity=".15"/></filter>
    <style>.bg{fill:#f6f0e3}.node{fill:#fffaf0;stroke:#171513;stroke-width:2}.central{fill:#8d1f2d;stroke:#171513;stroke-width:3}.accent{fill:#8d1f2d}.line{fill:none;stroke:#8d1f2d;stroke-width:4;marker-end:url(#arrow)}.ct{font:700 31px Georgia,serif;fill:#fffaf0;text-anchor:middle}.nt{font:700 25px Georgia,serif;fill:#171513;text-anchor:middle}.sub{font:20px Arial,sans-serif;fill:#171513;text-anchor:middle}.rel{font:700 18px Arial,sans-serif;fill:#8d1f2d;text-anchor:middle}.tag{fill:#f6f0e3;stroke:#8d1f2d;stroke-width:1}.foot{font:17px Arial,sans-serif;fill:#4a433d;text-anchor:middle}</style>
  </defs>
  <rect class="bg" width="1400" height="900"/><text x="70" y="55" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#8d1f2d" letter-spacing="2">04 · LA POETICA</text>
  <path class="line" d="M530 190 C500 245 255 245 230 300"/><path class="line" d="M700 190 L700 300"/><path class="line" d="M870 190 C900 245 1145 245 1170 300"/><path class="line" d="M230 440 L230 650"/><path class="line" d="M700 440 L700 650"/><path class="line" d="M1170 440 L1170 650"/>
  <g><rect class="tag" x="335" y="217" width="176" height="34" rx="17"/><text class="rel" x="423" y="240">si traduce in</text></g><g><rect class="tag" x="616" y="225" width="168" height="34" rx="17"/><text class="rel" x="700" y="248">usa come lente</text></g><g><rect class="tag" x="906" y="217" width="172" height="34" rx="17"/><text class="rel" x="992" y="240">dà forma alla</text></g>
  <g><rect class="tag" x="136" y="522" width="188" height="34" rx="17"/><text class="rel" x="230" y="545">fa emergere una</text></g><g><rect class="tag" x="608" y="522" width="184" height="34" rx="17"/><text class="rel" x="700" y="545">si esprime con</text></g><g><rect class="tag" x="1073" y="522" width="194" height="34" rx="17"/><text class="rel" x="1170" y="545">si amplia nella</text></g>
  <g filter="url(#shadow)"><rect class="central" x="500" y="50" width="400" height="140" rx="28"/><text class="ct" x="700" y="110">DIRE LA REALTÀ</text><text x="700" y="148" font-family="Arial,sans-serif" font-size="21" fill="#fffaf0" text-anchor="middle">la finzione rivela ciò che la cronaca non basta a dire</text></g>
  <g filter="url(#shadow)"><rect class="node" x="40" y="300" width="380" height="140" rx="22"/><rect class="accent" x="40" y="300" width="12" height="140" rx="6"/><text class="nt" x="230" y="342">Realismo simbolico</text><text class="sub" x="230" y="376">storia concreta</text><text class="sub" x="230" y="400">e figure archetipiche</text><text class="sub" x="230" y="424">restano nella stessa scena</text></g>
  <g filter="url(#shadow)"><rect class="node" x="510" y="300" width="380" height="140" rx="22"/><rect class="accent" x="510" y="300" width="12" height="140" rx="6"/><text class="nt" x="700" y="348">Mito, fiaba, gioco</text><text class="sub" x="700" y="386">non nascondono il reale:</text><text class="sub" x="700" y="414">lo trasfigurano per conoscerlo</text></g>
  <g filter="url(#shadow)"><rect class="node" x="980" y="300" width="380" height="140" rx="22"/><rect class="accent" x="980" y="300" width="12" height="140" rx="6"/><text class="nt" x="1170" y="342">Psiche e memoria</text><text class="sub" x="1170" y="376">desiderio, trauma</text><text class="sub" x="1170" y="400">e ritorno ossessivo</text><text class="sub" x="1170" y="424">spezzano la linearità del tempo</text></g>
  <g filter="url(#shadow)"><rect class="node" x="40" y="650" width="380" height="140" rx="22"/><rect class="accent" x="40" y="650" width="12" height="140" rx="6"/><text class="nt" x="230" y="692">Verità più profonda</text><text class="sub" x="230" y="726">l'invenzione smaschera</text><text class="sub" x="230" y="750">le menzogne sociali</text><text class="sub" x="230" y="774">e i moti segreti dei personaggi</text></g>
  <g filter="url(#shadow)"><rect class="node" x="510" y="650" width="380" height="140" rx="22"/><rect class="accent" x="510" y="650" width="12" height="140" rx="6"/><text class="nt" x="700" y="698">Lingua plurale</text><text class="sub" x="700" y="736">registro lirico e alto si unisce</text><text class="sub" x="700" y="764">al parlato popolare e al dialetto</text></g>
  <g filter="url(#shadow)"><rect class="node" x="980" y="650" width="380" height="140" rx="22"/><rect class="accent" x="980" y="650" width="12" height="140" rx="6"/><text class="nt" x="1170" y="698">Opera-mondo</text><text class="sub" x="1170" y="736">la forma ampia intreccia</text><text class="sub" x="1170" y="764">voci, destini e storia collettiva</text></g>
  <text class="foot" x="700" y="858">Ponte: ogni opera mette alla prova un diverso equilibrio fra incanto, disillusione, storia e memoria.</text>
</svg>
