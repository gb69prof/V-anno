<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">L'immagine del mondo di Elsa Morante</title>
  <desc id="desc">Al centro è il conflitto fra Realtà e Irrealtà. La Realtà si riconosce nella vita concreta, nella comunione e negli ultimi; l'Irrealtà è prodotta dal Potere e dalla Storia astratta. Innocenti, bambini, animali, poeti e santi custodiscono una possibilità fragile di resistenza.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 11 6 1 11Z" fill="#8d1f2d"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#171513" flood-opacity=".15"/></filter>
    <style>.bg{fill:#f6f0e3}.node{fill:#fffaf0;stroke:#171513;stroke-width:2}.central{fill:#8d1f2d;stroke:#171513;stroke-width:3}.accent{fill:#8d1f2d}.line{fill:none;stroke:#8d1f2d;stroke-width:4;marker-end:url(#arrow)}.ct{font:700 31px Georgia,serif;fill:#fffaf0;text-anchor:middle}.nt{font:700 25px Georgia,serif;fill:#171513;text-anchor:middle}.sub{font:20px Arial,sans-serif;fill:#171513;text-anchor:middle}.rel{font:700 18px Arial,sans-serif;fill:#8d1f2d;text-anchor:middle}.tag{fill:#f6f0e3;stroke:#8d1f2d;stroke-width:1}.foot{font:17px Arial,sans-serif;fill:#4a433d;text-anchor:middle}</style>
  </defs>
  <rect class="bg" width="1400" height="900"/><text x="70" y="55" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#8d1f2d" letter-spacing="2">03 · L'IMMAGINE DEL MONDO</text>
  <path class="line" d="M530 190 C500 245 255 245 230 300"/><path class="line" d="M700 190 L700 300"/><path class="line" d="M870 190 C900 245 1145 245 1170 300"/><path class="line" d="M230 440 L230 650"/><path class="line" d="M700 440 L700 650"/><path class="line" d="M1170 440 L1170 650"/>
  <g><rect class="tag" x="335" y="217" width="176" height="34" rx="17"/><text class="rel" x="423" y="240">si manifesta nella</text></g><g><rect class="tag" x="623" y="225" width="154" height="34" rx="17"/><text class="rel" x="700" y="248">è negata dal</text></g><g><rect class="tag" x="910" y="217" width="165" height="34" rx="17"/><text class="rel" x="992" y="240">è custodita da</text></g>
  <g><rect class="tag" x="136" y="522" width="188" height="34" rx="17"/><text class="rel" x="230" y="545">rende sacra ogni</text></g><g><rect class="tag" x="610" y="522" width="180" height="34" rx="17"/><text class="rel" x="700" y="545">produce la</text></g><g><rect class="tag" x="1074" y="522" width="192" height="34" rx="17"/><text class="rel" x="1170" y="545">resiste attraverso</text></g>
  <g filter="url(#shadow)"><rect class="central" x="500" y="50" width="400" height="140" rx="28"/><text class="ct" x="700" y="110">REALTÀ ↔ IRREALTÀ</text><text x="700" y="148" font-family="Arial,sans-serif" font-size="21" fill="#fffaf0" text-anchor="middle">il conflitto che ordina il mondo morantiano</text></g>
  <g filter="url(#shadow)"><rect class="node" x="40" y="300" width="380" height="140" rx="22"/><rect class="accent" x="40" y="300" width="12" height="140" rx="6"/><text class="nt" x="230" y="348">Vita concreta</text><text class="sub" x="230" y="386">corpi, desideri, dolore e gioia</text><text class="sub" x="230" y="414">precedono ogni astrazione</text></g>
  <g filter="url(#shadow)"><rect class="node" x="510" y="300" width="380" height="140" rx="22"/><rect class="accent" x="510" y="300" width="12" height="140" rx="6"/><text class="nt" x="700" y="348">Potere e Storia</text><text class="sub" x="700" y="386">gerarchie e ideologie trasformano</text><text class="sub" x="700" y="414">le persone in mezzi e vittime</text></g>
  <g filter="url(#shadow)"><rect class="node" x="980" y="300" width="380" height="140" rx="22"/><rect class="accent" x="980" y="300" width="12" height="140" rx="6"/><text class="nt" x="1170" y="348">Gli ultimi</text><text class="sub" x="1170" y="386">bambini, animali ed emarginati</text><text class="sub" x="1170" y="414">rivelano ciò che la Storia cancella</text></g>
  <g filter="url(#shadow)"><rect class="node" x="40" y="650" width="380" height="140" rx="22"/><rect class="accent" x="40" y="650" width="12" height="140" rx="6"/><text class="nt" x="230" y="698">Singola esistenza</text><text class="sub" x="230" y="736">nessuna vita è materiale anonimo</text><text class="sub" x="230" y="764">per il racconto dei vincitori</text></g>
  <g filter="url(#shadow)"><rect class="node" x="510" y="650" width="380" height="140" rx="22"/><rect class="accent" x="510" y="650" width="12" height="140" rx="6"/><text class="nt" x="700" y="698">Sventura</text><text class="sub" x="700" y="736">la forza impersonale schiaccia</text><text class="sub" x="700" y="764">chi non dispone di potere</text></g>
  <g filter="url(#shadow)"><rect class="node" x="980" y="650" width="380" height="140" rx="22"/><rect class="accent" x="980" y="650" width="12" height="140" rx="6"/><text class="nt" x="1170" y="698">Felici Pochi</text><text class="sub" x="1170" y="736">ragazzini, poeti e santi difendono</text><text class="sub" x="1170" y="764">innocenza, attenzione, comunione</text></g>
  <text class="foot" x="700" y="858">Problema espressivo: quale scrittura può mostrare insieme il trauma storico e la verità invisibile della vita?</text>
</svg>
