<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">La traiettoria conclusiva di Elsa Morante</title>
  <desc id="desc">Una sola catena collega i sei movimenti: il Novecento di guerra e ideologie viene incrinato dalle fratture vissute; da esse si rende intelligibile il conflitto fra Realtà e Potere; quel conflitto richiede una poetica di realismo e mito; le opere danno voce alle vite vulnerabili; l'eredità è una domanda sul potere non onnipotente dell'arte.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 11 6 1 11Z" fill="#8d1f2d"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#171513" flood-opacity=".15"/></filter>
    <style>.bg{fill:#f6f0e3}.node{fill:#fffaf0;stroke:#171513;stroke-width:2}.central{fill:#8d1f2d;stroke:#171513;stroke-width:3}.accent{fill:#8d1f2d}.line{fill:none;stroke:#8d1f2d;stroke-width:4;marker-end:url(#arrow)}.ct{font:700 31px Georgia,serif;fill:#fffaf0;text-anchor:middle}.nt{font:700 24px Georgia,serif;fill:#171513;text-anchor:middle}.sub{font:19px Arial,sans-serif;fill:#171513;text-anchor:middle}.rel{font:700 17px Arial,sans-serif;fill:#8d1f2d;text-anchor:middle}.tag{fill:#f6f0e3;stroke:#8d1f2d;stroke-width:1}.foot{font:17px Arial,sans-serif;fill:#4a433d;text-anchor:middle}</style>
  </defs>
  <rect class="bg" width="1400" height="900"/><text x="70" y="55" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#8d1f2d" letter-spacing="2">06 · CONCLUSIONE</text>

  <path class="line" d="M520 150 C440 190 260 200 210 250"/>
  <path class="line" d="M370 320 L540 320"/><path class="line" d="M860 320 L1030 320"/><path class="line" d="M1190 390 L1190 640"/><path class="line" d="M1030 710 L860 710"/><path class="line" d="M540 710 L370 710"/>
  <g><rect class="tag" x="333" y="175" width="154" height="34" rx="17"/><text class="rel" x="410" y="198">ricompone il</text></g><g><rect class="tag" x="395" y="294" width="120" height="34" rx="17"/><text class="rel" x="455" y="317">incrinato da</text></g><g><rect class="tag" x="866" y="294" width="158" height="34" rx="17"/><text class="rel" x="945" y="317">fa emergere</text></g><g><rect class="tag" x="1102" y="500" width="176" height="34" rx="17"/><text class="rel" x="1190" y="523">rende necessaria</text></g><g><rect class="tag" x="883" y="684" width="124" height="34" rx="17"/><text class="rel" x="945" y="707">si prova nelle</text></g><g><rect class="tag" x="377" y="684" width="156" height="34" rx="17"/><text class="rel" x="455" y="707">lascia aperta</text></g>

  <g filter="url(#shadow)"><rect class="central" x="440" y="30" width="520" height="120" rx="28"/><text class="ct" x="700" y="82" style="font-size:27px">TRAIETTORIA MORANTIANA</text><text x="700" y="118" font-family="Arial,sans-serif" font-size="21" fill="#fffaf0" text-anchor="middle">dalla storia subita alla verità delle vite</text></g>
  <g filter="url(#shadow)"><rect class="node" x="50" y="250" width="320" height="140" rx="22"/><rect class="accent" x="50" y="250" width="12" height="140" rx="6"/><text class="nt" x="210" y="291">1 · Mondo ricevuto</text><text class="sub" x="210" y="325">guerra e ideologie</text><text class="sub" x="210" y="349">producono disuguaglianze</text><text class="sub" x="210" y="373">nelle forme ereditate</text></g>
  <g filter="url(#shadow)"><rect class="node" x="540" y="250" width="320" height="140" rx="22"/><rect class="accent" x="540" y="250" width="12" height="140" rx="6"/><text class="nt" x="700" y="294">2 · Fratture</text><text class="sub" x="700" y="331">identità, violenza e perdita</text><text class="sub" x="700" y="359">rendono insufficiente il già dato</text></g>
  <g filter="url(#shadow)"><rect class="node" x="1030" y="250" width="320" height="140" rx="22"/><rect class="accent" x="1030" y="250" width="12" height="140" rx="6"/><text class="nt" x="1190" y="294">3 · Immagine</text><text class="sub" x="1190" y="331">Realtà vitale contro Irrealtà,</text><text class="sub" x="1190" y="359">Storia e Potere</text></g>
  <g filter="url(#shadow)"><rect class="node" x="1030" y="640" width="320" height="140" rx="22"/><rect class="accent" x="1030" y="640" width="12" height="140" rx="6"/><text class="nt" x="1190" y="684">4 · Poetica</text><text class="sub" x="1190" y="721">mito, psiche e realismo simbolico</text><text class="sub" x="1190" y="749">dicono la verità del trauma</text></g>
  <g filter="url(#shadow)"><rect class="node" x="540" y="640" width="320" height="140" rx="22"/><rect class="accent" x="540" y="640" width="12" height="140" rx="6"/><text class="nt" x="700" y="684">5 · Opere</text><text class="sub" x="700" y="721">le vite minime mettono alla prova</text><text class="sub" x="700" y="749">la promessa dell'immaginazione</text></g>
  <g filter="url(#shadow)"><rect class="node" x="50" y="640" width="320" height="140" rx="22"/><rect class="accent" x="50" y="640" width="12" height="140" rx="6"/><text class="nt" x="210" y="681">6 · Eredità</text><text class="sub" x="210" y="715">testimoniare gli ultimi</text><text class="sub" x="210" y="739">senza trasformarli</text><text class="sub" x="210" y="763">in strumenti ideologici</text></g>
  <text class="foot" x="700" y="845">Domanda discutibile: se l'arte non ferma il Potere, in quale senso può ancora «salvare» il mondo?</text>
</svg>
