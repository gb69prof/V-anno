<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Le opere più significative di Elsa Morante</title>
  <desc id="desc">Le opere sono prove successive della poetica morantiana. Menzogna e sortilegio indaga famiglia e menzogna; L'isola di Arturo racconta mito e disillusione; Il mondo salvato dai ragazzini formula la rivolta contro il Potere; La Storia oppone le vite minime alla storia dei grandi; Aracoeli esplora memoria e perdita. Tutte confluiscono nella difesa della vita vulnerabile.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 11 6 1 11Z" fill="#8d1f2d"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#171513" flood-opacity=".15"/></filter>
    <style>.bg{fill:#f6f0e3}.node{fill:#fffaf0;stroke:#171513;stroke-width:2}.central{fill:#8d1f2d;stroke:#171513;stroke-width:3}.accent{fill:#8d1f2d}.line{fill:none;stroke:#8d1f2d;stroke-width:4;marker-end:url(#arrow)}.ct{font:700 31px Georgia,serif;fill:#fffaf0;text-anchor:middle}.nt{font:700 24px Georgia,serif;fill:#171513;text-anchor:middle}.year{font:700 18px Arial,sans-serif;fill:#8d1f2d;text-anchor:middle}.sub{font:19px Arial,sans-serif;fill:#171513;text-anchor:middle}.rel{font:700 17px Arial,sans-serif;fill:#8d1f2d;text-anchor:middle}.tag{fill:#f6f0e3;stroke:#8d1f2d;stroke-width:1}.foot{font:17px Arial,sans-serif;fill:#4a433d;text-anchor:middle}</style>
  </defs>
  <rect class="bg" width="1400" height="900"/><text x="70" y="55" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#8d1f2d" letter-spacing="2">05 · LE OPERE</text>
  <path class="line" d="M530 190 C500 245 255 245 230 300"/><path class="line" d="M700 190 L700 300"/><path class="line" d="M870 190 C900 245 1145 245 1170 300"/><path class="line" d="M230 440 L230 650"/><path class="line" d="M700 440 L700 650"/><path class="line" d="M1170 440 L1170 650"/>
  <g><rect class="tag" x="335" y="217" width="176" height="34" rx="17"/><text class="rel" x="423" y="240">si inaugura con</text></g><g><rect class="tag" x="618" y="225" width="164" height="34" rx="17"/><text class="rel" x="700" y="248">si misura con</text></g><g><rect class="tag" x="902" y="217" width="180" height="34" rx="17"/><text class="rel" x="992" y="240">diventa rivolta in</text></g>
  <g><rect class="tag" x="139" y="522" width="182" height="34" rx="17"/><text class="rel" x="230" y="545">allarga il conflitto</text></g><g><rect class="tag" x="612" y="522" width="176" height="34" rx="17"/><text class="rel" x="700" y="545">rovescia l'Eden in</text></g><g><rect class="tag" x="1068" y="522" width="204" height="34" rx="17"/><text class="rel" x="1170" y="545">formula la chiave</text></g>
  <g filter="url(#shadow)"><rect class="central" x="500" y="50" width="400" height="140" rx="28"/><text class="ct" x="700" y="110">OPERE COME PROVE</text><text x="700" y="148" font-family="Arial,sans-serif" font-size="21" fill="#fffaf0" text-anchor="middle">una poetica in trasformazione, non un catalogo</text></g>
  <g filter="url(#shadow)"><rect class="node" x="40" y="300" width="380" height="140" rx="22"/><rect class="accent" x="40" y="300" width="12" height="140" rx="6"/><text class="nt" x="230" y="342">Menzogna e sortilegio</text><text class="year" x="230" y="373">1948</text><text class="sub" x="230" y="404">saga familiare, narcisismo,</text><text class="sub" x="230" y="428">menzogna e potere dell'invenzione</text></g>
  <g filter="url(#shadow)"><rect class="node" x="510" y="300" width="380" height="140" rx="22"/><rect class="accent" x="510" y="300" width="12" height="140" rx="6"/><text class="nt" x="700" y="342">L'isola di Arturo</text><text class="year" x="700" y="373">1957</text><text class="sub" x="700" y="404">l'isola-mito protegge l'infanzia;</text><text class="sub" x="700" y="428">crescere significa disilludersi</text></g>
  <g filter="url(#shadow)"><rect class="node" x="980" y="300" width="380" height="140" rx="22"/><rect class="accent" x="980" y="300" width="12" height="140" rx="6"/><text class="nt" x="1170" y="342">Il mondo salvato</text><text class="year" x="1170" y="373">1968</text><text class="sub" x="1170" y="404">poesia, teatro e canzone oppongono</text><text class="sub" x="1170" y="428">i ragazzini alla macchina del Potere</text></g>
  <g filter="url(#shadow)"><rect class="node" x="40" y="650" width="380" height="140" rx="22"/><rect class="accent" x="40" y="650" width="12" height="140" rx="6"/><text class="nt" x="230" y="692">La Storia</text><text class="year" x="230" y="723">1974</text><text class="sub" x="230" y="754">le vite di Ida e Useppe smascherano</text><text class="sub" x="230" y="778">lo scandalo della storia dei potenti</text></g>
  <g filter="url(#shadow)"><rect class="node" x="510" y="650" width="380" height="140" rx="22"/><rect class="accent" x="510" y="650" width="12" height="140" rx="6"/><text class="nt" x="700" y="692">Aracoeli</text><text class="year" x="700" y="723">1982</text><text class="sub" x="700" y="754">il viaggio nella memoria non recupera</text><text class="sub" x="700" y="778">la madre né l'identità perdute</text></g>
  <g filter="url(#shadow)"><rect class="node" x="980" y="650" width="380" height="140" rx="22"/><rect class="accent" x="980" y="650" width="12" height="140" rx="6"/><text class="nt" x="1170" y="698">Traiettoria comune</text><text class="sub" x="1170" y="736">mito e trauma interrogano sempre</text><text class="sub" x="1170" y="764">il valore della vita vulnerabile</text></g>
  <text class="foot" x="700" y="858">Dopo le opere resta una domanda: l'arte può salvare, oppure può soltanto testimoniare senza tradire?</text>
</svg>
