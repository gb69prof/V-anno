<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">La poetica</title><desc id="d">Sottrazione, parola, spazio bianco, analogia e varianti conducono dalla prima stagione al nuovo classicismo.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0l9 3-9 3z" fill="#a63f32"/></marker><style>.n{fill:#fffdf8;stroke:#ad884e;stroke-width:3}.c{fill:#17233b}.l{stroke:#a63f32;stroke-width:3;fill:none;marker-end:url(#a)}.h{font:700 24px Georgia;fill:#17233b}.p{font:18px system-ui;fill:#34425c}.r{font:700 16px system-ui;fill:#a63f32}.w{fill:#fff}</style></defs><rect width="1200" height="760" rx="32" fill="#f2eee5"/><text x="60" y="70" class="h">04 · La poetica</text>
<rect x="440" y="300" width="320" height="140" rx="24" class="c"/><text x="600" y="350" text-anchor="middle" class="h w">PAROLA SCAVATA</text><text x="600" y="388" text-anchor="middle" class="p w">necessaria · concreta · aperta</text>
<rect x="65" y="120" width="280" height="115" rx="20" class="n"/><text x="205" y="164" text-anchor="middle" class="h">Sottrazione</text><text x="205" y="199" text-anchor="middle" class="p">toglie l’automatismo</text><path d="M345 202C425 235 460 275 500 306" class="l"/><text x="395" y="240" class="r">concentra</text>
<rect x="460" y="95" width="280" height="115" rx="20" class="n"/><text x="600" y="139" text-anchor="middle" class="h">Verso e bianco</text><text x="600" y="174" text-anchor="middle" class="p">ritmo · pausa · risonanza</text><path d="M600 210v80" class="l"/><text x="615" y="258" class="r">fa risuonare</text>
<rect x="855" y="120" width="280" height="115" rx="20" class="n"/><text x="995" y="164" text-anchor="middle" class="h">Analogia</text><text x="995" y="199" text-anchor="middle" class="p">salto concreto → mistero</text><path d="M855 202C775 235 740 275 700 306" class="l"/><text x="765" y="240" class="r">collega</text>
<rect x="120" y="550" width="310" height="115" rx="20" class="n"/><text x="275" y="594" text-anchor="middle" class="h">Varianti</text><text x="275" y="629" text-anchor="middle" class="p">riscrittura continua</text><path d="M430 590C500 535 525 475 548 442" class="l"/><text x="460" y="536" class="r">verificano</text>
<rect x="770" y="550" width="310" height="115" rx="20" class="n"/><text x="925" y="594" text-anchor="middle" class="h">Nuovo classicismo</text><text x="925" y="629" text-anchor="middle" class="p">tradizione trasformata</text><path d="M770 590C700 535 675 475 652 442" class="l"/><text x="690" y="536" class="r">amplia</text>
<path d="M760 370h320" class="l"/><text x="805" y="352" class="r">influenza, non coincide con</text><text x="870" y="415" class="h">ERMETISMO</text>
</svg>
