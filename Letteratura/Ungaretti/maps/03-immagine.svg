<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">L’immagine del mondo</title><desc id="d">Precarietà, fraternità, memoria, innocenza e assoluto formano una visione concreta e misteriosa.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0l9 3-9 3z" fill="#a63f32"/></marker><style>.n{fill:#fffdf8;stroke:#ad884e;stroke-width:3}.c{fill:#17233b}.l{stroke:#a63f32;stroke-width:3;fill:none;marker-end:url(#a)}.h{font:700 25px Georgia;fill:#17233b}.p{font:19px system-ui;fill:#34425c}.r{font:700 17px system-ui;fill:#a63f32}.w{fill:#fff}</style></defs><rect width="1200" height="760" rx="32" fill="#f2eee5"/><text x="60" y="70" class="h">03 · L’immagine del mondo</text>
<rect x="430" y="300" width="340" height="140" rx="24" class="c"/><text x="600" y="352" text-anchor="middle" class="h w">CREATURA FRAGILE</text><text x="600" y="390" text-anchor="middle" class="p w">concreta · relazionale · aperta</text>
<rect x="60" y="120" width="290" height="120" rx="20" class="n"/><text x="205" y="168" text-anchor="middle" class="h">Precarietà</text><text x="205" y="204" text-anchor="middle" class="p">naufragio → slancio vitale</text><path d="M350 205C420 235 460 275 500 305" class="l"/><text x="395" y="244" class="r">rende intensa</text>
<rect x="455" y="95" width="290" height="120" rx="20" class="n"/><text x="600" y="143" text-anchor="middle" class="h">Fraternità</text><text x="600" y="179" text-anchor="middle" class="p">riconosce l’altro esposto</text><path d="M600 215v76" class="l"/><text x="616" y="259" class="r">ricrea</text>
<rect x="850" y="120" width="290" height="120" rx="20" class="n"/><text x="995" y="168" text-anchor="middle" class="h">I fiumi</text><text x="995" y="204" text-anchor="middle" class="p">origini → confluenza</text><path d="M850 205C780 235 740 275 700 305" class="l"/><text x="756" y="244" class="r">compone</text>
<rect x="70" y="550" width="310" height="120" rx="20" class="n"/><text x="225" y="598" text-anchor="middle" class="h">Memoria</text><text x="225" y="634" text-anchor="middle" class="p">costituisce e ferisce</text><path d="M380 590C470 545 505 475 535 442" class="l"/><text x="430" y="532" class="r">conserva</text>
<rect x="445" y="565" width="310" height="120" rx="20" class="n"/><text x="600" y="613" text-anchor="middle" class="h">Innocenza</text><text x="600" y="649" text-anchor="middle" class="p">cerca l’origine</text><path d="M600 565V450" class="l"/><text x="616" y="520" class="r">risale verso</text>
<rect x="820" y="550" width="310" height="120" rx="20" class="n"/><text x="975" y="598" text-anchor="middle" class="h">Assoluto</text><text x="975" y="634" text-anchor="middle" class="p">fede · attesa · distanza</text><path d="M820 590C730 545 695 475 665 442" class="l"/><text x="720" y="532" class="r">apre a</text>
</svg>
