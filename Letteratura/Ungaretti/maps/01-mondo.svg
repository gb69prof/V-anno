<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Il mondo precedente</title><desc id="d">Tradizione, Alessandria, simbolismo e avanguardie confluiscono nella ricerca di una parola vera.</desc>
