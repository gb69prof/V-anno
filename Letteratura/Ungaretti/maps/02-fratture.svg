<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Le fratture</title><desc id="d">Sradicamento, guerra, responsabilità politica, conversione e lutto trasformano la visione dell’uomo.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0l9 3-9 3z" fill="#a63f32"/></marker><style>.n{fill:#fffdf8;stroke:#ad884e;stroke-width:3}.c{fill:#17233b}.l{stroke:#a63f32;stroke-width:3;fill:none;marker-end:url(#a)}.h{font:700 25px Georgia;fill:#17233b}.p{font:19px system-ui;fill:#34425c}.r{font:700 17px system-ui;fill:#a63f32}.w{fill:#fff}</style></defs><rect width="1200" height="760" rx="32" fill="#f2eee5"/><text x="60" y="70" class="h">02 · Le fratture della vita</text>
<rect x="430" y="300" width="340" height="140" rx="24" class="c"/><text x="600" y="354" text-anchor="middle" class="h w">MONDO INSUFFICIENTE</text><text x="600" y="393" text-anchor="middle" class="p w">l’uomo è esposto e contraddittorio</text>
<rect x="55" y="130" width="300" height="115" rx="20" class="n"/><text x="205" y="176" text-anchor="middle" class="h">Sradicamento</text><text x="205" y="210" text-anchor="middle" class="p">Sceab · patria · canto</text><path d="M355 205C430 235 470 285 500 305" class="l"/><text x="400" y="238" class="r">interroga</text>
<rect x="450" y="105" width="300" height="115" rx="20" class="n"/><text x="600" y="151" text-anchor="middle" class="h">Trincea</text><text x="600" y="185" text-anchor="middle" class="p">fango · morte · fraternità</text><path d="M600 220v72" class="l"/><text x="616" y="266" class="r">mette in crisi</text>
<rect x="845" y="130" width="300" height="115" rx="20" class="n"/><text x="995" y="176" text-anchor="middle" class="h">Scelte politiche</text><text x="995" y="210" text-anchor="middle" class="p">intervento · fascismo</text><path d="M845 205C770 235 730 285 700 305" class="l"/><text x="755" y="238" class="r">contraddice</text>
<rect x="130" y="545" width="340" height="115" rx="20" class="n"/><text x="300" y="591" text-anchor="middle" class="h">Conversione</text><text x="300" y="625" text-anchor="middle" class="p">colpa · tempo · assoluto</text><path d="M470 580C520 530 540 475 555 443" class="l"/><text x="472" y="530" class="r">riordina senza pacificare</text>
<rect x="730" y="545" width="340" height="115" rx="20" class="n"/><text x="900" y="591" text-anchor="middle" class="h">Lutto e guerra mondiale</text><text x="900" y="625" text-anchor="middle" class="p">Antonietto · Roma occupata</text><path d="M730 580C680 530 660 475 645 443" class="l"/><text x="680" y="530" class="r">ferisce</text>
</svg>
