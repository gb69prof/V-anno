<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Le opere significative</title><desc id="d">Cinque opere e la trilogia finale mettono alla prova la parola-testimonianza nei campi della guerra, del potere, della maternità, della resistenza e della coralità.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6z" fill="#b64032"/></marker><style>.n{fill:#fffaf4;stroke:#34231f;stroke-width:3}.c{fill:#34231f}.h{font:700 23px sans-serif;fill:#34231f}.w{font:700 29px sans-serif;fill:#fffaf4}.r{font:600 17px sans-serif;fill:#b64032}.l{stroke:#b64032;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="720" fill="#f3ede4"/><text x="60" y="60" class="h">05 · Le opere più significative</text><rect x="425" y="285" width="350" height="135" rx="24" class="c"/><text x="600" y="342" text-anchor="middle" class="w">PAROLA-</text><text x="600" y="382" text-anchor="middle" class="w">TESTIMONIANZA</text><rect x="45" y="110" width="300" height="90" rx="18" class="n"/><text x="195" y="165" text-anchor="middle" class="h">Niente e così sia</text><path d="M345 165 C390 210 405 275 440 310" class="l"/><text x="355" y="195" class="r">interroga la guerra</text><rect x="45" y="315" width="300" height="90" rx="18" class="n"/><text x="195" y="370" text-anchor="middle" class="h">Intervista con la storia</text><path d="M345 360 L425 360" class="l"/><text x="350" y="340" class="r">sfida il potere</text><rect x="45" y="520" width="300" height="90" rx="18" class="n"/><text x="195" y="575" text-anchor="middle" class="h">Lettera a un bambino</text><path d="M345 565 C395 520 405 445 445 410" class="l"/><text x="355" y="535" class="r">apre il dilemma</text><rect x="855" y="110" width="300" height="90" rx="18" class="n"/><text x="1005" y="165" text-anchor="middle" class="h">Un uomo</text><path d="M855 165 C810 215 800 275 765 315" class="l"/><text x="775" y="190" class="r">mitizza la resistenza</text><rect x="855" y="315" width="300" height="90" rx="18" class="n"/><text x="1005" y="370" text-anchor="middle" class="h">Insciallah</text><path d="M855 360 L775 360" class="l"/><text x="785" y="340" class="r">moltiplica le voci</text><rect x="855" y="520" width="300" height="90" rx="18" class="n"/><text x="1005" y="575" text-anchor="middle" class="h">Trilogia finale</text><path d="M855 565 C805 520 795 445 755 410" class="l"/><text x="775" y="535" class="r">mostra il limite</text></svg>
