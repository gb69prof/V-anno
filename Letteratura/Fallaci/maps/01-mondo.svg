<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Il mondo precedente di Oriana Fallaci</title><desc id="d">Fascismo, patriarcato e giornalismo impersonale incontrano l’educazione antifascista e il laboratorio del rotocalco, producendo la domanda sulla soggettività.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6z" fill="#b64032"/></marker><style>.n{fill:#fffaf4;stroke:#34231f;stroke-width:3}.c{fill:#34231f}.h{font:700 28px sans-serif;fill:#34231f}.w{font:700 30px sans-serif;fill:#fffaf4}.r{font:600 19px sans-serif;fill:#b64032}.l{stroke:#b64032;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="720" fill="#f3ede4"/><text x="60" y="65" class="h">01 · Il mondo precedente</text><rect x="435" y="265" width="330" height="140" rx="24" class="c"/><text x="600" y="325" text-anchor="middle" class="w">PAROLA E POTERE</text><text x="600" y="365" text-anchor="middle" class="w">chi racconta?</text><rect x="55" y="145" width="270" height="95" rx="18" class="n"/><text x="190" y="200" text-anchor="middle" class="h">Fascismo</text><path d="M325 195 C390 205 390 265 435 295" class="l"/><text x="350" y="170" class="r">impone</text><rect x="55" y="475" width="270" height="95" rx="18" class="n"/><text x="190" y="530" text-anchor="middle" class="h">Patriarcato</text><path d="M325 520 C390 500 390 410 435 375" class="l"/><text x="338" y="505" class="r">limita</text><rect x="875" y="110" width="270" height="105" rx="18" class="n"/><text x="1010" y="155" text-anchor="middle" class="h">Famiglia</text><text x="1010" y="188" text-anchor="middle" class="h">antifascista</text><path d="M875 180 C820 205 810 260 765 300" class="l"/><text x="795" y="175" class="r">educa alla libertà</text><rect x="875" y="300" width="270" height="105" rx="18" class="n"/><text x="1010" y="345" text-anchor="middle" class="h">Giornalismo</text><text x="1010" y="378" text-anchor="middle" class="h">impersonale</text><path d="M875 350 L765 350" class="l"/><text x="790" y="330" class="r">viene messo in crisi</text><rect x="875" y="515" width="270" height="105" rx="18" class="n"/><text x="1010" y="560" text-anchor="middle" class="h">Rotocalco</text><text x="1010" y="593" text-anchor="middle" class="h">e New Journalism</text><path d="M875 555 C810 520 805 420 750 395" class="l"/><text x="785" y="505" class="r">offrono tecniche</text></svg>
