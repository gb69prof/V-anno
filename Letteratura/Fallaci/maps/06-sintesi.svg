<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Sintesi del percorso su Oriana Fallaci</title><desc id="d">Il mondo ricevuto prepara le fratture, che producono una visione agonistica, una poetica della presenza, opere di prova e una eredità fondata su coraggio e responsabilità.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6z" fill="#b64032"/></marker><style>.n{fill:#fffaf4;stroke:#34231f;stroke-width:3}.q{fill:#34231f}.h{font:700 23px sans-serif;fill:#34231f}.w{font:700 28px sans-serif;fill:#fffaf4}.r{font:600 17px sans-serif;fill:#b64032}.l{stroke:#b64032;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="720" fill="#f3ede4"/><text x="60" y="65" class="h">06 · Sintesi conclusiva</text><rect x="70" y="125" width="285" height="90" rx="18" class="n"/><text x="212" y="180" text-anchor="middle" class="h">Mondo ricevuto</text><rect x="458" y="125" width="285" height="90" rx="18" class="n"/><text x="600" y="180" text-anchor="middle" class="h">Fratture</text><rect x="845" y="125" width="285" height="90" rx="18" class="n"/><text x="987" y="180" text-anchor="middle" class="h">Visione agonistica</text><path d="M355 170 L458 170" class="l"/><text x="370" y="150" class="r">rendono insufficiente</text><path d="M743 170 L845 170" class="l"/><text x="762" y="150" class="r">modificano</text><rect x="845" y="330" width="285" height="90" rx="18" class="n"/><text x="987" y="385" text-anchor="middle" class="h">Poetica della presenza</text><path d="M987 215 L987 330" class="l"/><text x="1005" y="280" class="r">richiede</text><rect x="458" y="330" width="285" height="90" rx="18" class="n"/><text x="600" y="385" text-anchor="middle" class="h">Opere-prova</text><path d="M845 375 L743 375" class="l"/><text x="755" y="355" class="r">si verifica in</text><rect x="70" y="330" width="285" height="90" rx="18" class="n"/><text x="212" y="385" text-anchor="middle" class="h">Eredità critica</text><path d="M458 375 L355 375" class="l"/><text x="370" y="355" class="r">lascia</text><rect x="310" y="535" width="580" height="115" rx="24" class="q"/><text x="600" y="582" text-anchor="middle" class="w">QUANDO L’IO APRE LA REALTÀ</text><text x="600" y="620" text-anchor="middle" class="w">E QUANDO LA CHIUDE?</text><path d="M212 420 C250 500 360 525 430 545" class="l"/><text x="245" y="490" class="r">confluisce nella domanda</text></svg>
