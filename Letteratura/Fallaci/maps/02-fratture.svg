<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Le fratture della vita</title><desc id="d">Resistenza, discriminazione, guerre, Panagulis, maternità e 11 settembre trasformano la distanza in testimonianza esposta.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6z" fill="#b64032"/></marker><style>.n{fill:#fffaf4;stroke:#34231f;stroke-width:3}.c{fill:#34231f}.h{font:700 26px sans-serif;fill:#34231f}.w{font:700 30px sans-serif;fill:#fffaf4}.r{font:600 18px sans-serif;fill:#b64032}.l{stroke:#b64032;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="720" fill="#f3ede4"/><text x="60" y="65" class="h">02 · Le fratture</text><rect x="420" y="280" width="360" height="135" rx="24" class="c"/><text x="600" y="335" text-anchor="middle" class="w">TESTIMONIANZA</text><text x="600" y="375" text-anchor="middle" class="w">ESPOSTA</text><g><rect x="50" y="115" width="260" height="90" rx="18" class="n"/><text x="180" y="170" text-anchor="middle" class="h">Resistenza</text><path d="M310 170 C370 200 390 270 430 305" class="l"/><text x="330" y="185" class="r">rende la libertà azione</text><rect x="50" y="300" width="260" height="90" rx="18" class="n"/><text x="180" y="355" text-anchor="middle" class="h">Redazioni</text><path d="M310 345 L420 345" class="l"/><text x="320" y="325" class="r">impongono una conquista</text><rect x="50" y="500" width="260" height="90" rx="18" class="n"/><text x="180" y="555" text-anchor="middle" class="h">Vietnam · Messico</text><path d="M310 540 C375 500 390 420 430 395" class="l"/><text x="330" y="520" class="r">feriscono il corpo</text><rect x="890" y="115" width="260" height="90" rx="18" class="n"/><text x="1020" y="170" text-anchor="middle" class="h">Panagulis</text><path d="M890 170 C830 210 810 280 770 310" class="l"/><text x="790" y="185" class="r">unisce amore e resistenza</text><rect x="890" y="300" width="260" height="90" rx="18" class="n"/><text x="1020" y="355" text-anchor="middle" class="h">Maternità</text><path d="M890 345 L780 345" class="l"/><text x="790" y="325" class="r">apre un dilemma</text><rect x="890" y="500" width="260" height="90" rx="18" class="n"/><text x="1020" y="555" text-anchor="middle" class="h">11 settembre</text><path d="M890 540 C830 500 810 420 770 395" class="l"/><text x="790" y="520" class="r">irrigidisce il conflitto</text></g></svg>
