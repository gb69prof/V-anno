<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">L’immagine del mondo</title><desc id="d">L’individuo affronta l’apparato; storia, guerra, scelta e Occidente-Islam confluiscono nella nozione di verità situata e verificabile.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6z" fill="#b64032"/></marker><style>.n{fill:#fffaf4;stroke:#34231f;stroke-width:3}.c{fill:#34231f}.h{font:700 25px sans-serif;fill:#34231f}.w{font:700 30px sans-serif;fill:#fffaf4}.r{font:600 18px sans-serif;fill:#b64032}.l{stroke:#b64032;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="720" fill="#f3ede4"/><text x="60" y="65" class="h">03 · L’immagine del mondo</text><rect x="410" y="280" width="380" height="140" rx="24" class="c"/><text x="600" y="338" text-anchor="middle" class="w">VERITÀ SITUATA</text><text x="600" y="380" text-anchor="middle" class="w">E VERIFICABILE</text><rect x="55" y="120" width="280" height="95" rx="18" class="n"/><text x="195" y="175" text-anchor="middle" class="h">Individuo / apparato</text><path d="M335 175 C390 210 400 270 430 300" class="l"/><text x="350" y="195" class="r">fonda la scelta</text><rect x="55" y="315" width="280" height="95" rx="18" class="n"/><text x="195" y="370" text-anchor="middle" class="h">Storia / interrogatorio</text><path d="M335 360 L410 360" class="l"/><text x="345" y="340" class="r">mette alla prova</text><rect x="55" y="515" width="280" height="95" rx="18" class="n"/><text x="195" y="570" text-anchor="middle" class="h">Guerra / limite</text><path d="M335 560 C395 510 405 430 445 410" class="l"/><text x="350" y="535" class="r">rivela e deforma</text><rect x="865" y="150" width="280" height="95" rx="18" class="n"/><text x="1005" y="205" text-anchor="middle" class="h">Vita / morte</text><path d="M865 205 C820 235 810 290 780 315" class="l"/><text x="800" y="195" class="r">impone res