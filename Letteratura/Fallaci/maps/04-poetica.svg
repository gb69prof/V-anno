<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">La poetica della presenza</title><desc id="d">L’io dichiara la posizione; ricerca e registrazione alimentano montaggio, dramma, prosa di pressione e ibridazione dei generi.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6z" fill="#b64032"/></marker><style>.n{fill:#fffaf4;stroke:#34231f;stroke-width:3}.c{fill:#34231f}.h{font:700 25px sans-serif;fill:#34231f}.w{font:700 31px sans-serif;fill:#fffaf4}.r{font:600 18px sans-serif;fill:#b64032}.l{stroke:#b64032;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="720" fill="#f3ede4"/><text x="60" y="65" class="h">04 · La poetica</text><rect x="425" y="285" width="350" height="135" rx="24" class="c"/><text x="600" y="342" text-anchor="middle" class="w">POETICA DELLA</text><text x="600" y="383" text-anchor="middle" class="w">PRESENZA</text><rect x="55" y="120" width="260" height="90" rx="18" class="n"/><text x="185" y="175" text-anchor="middle" class="h">Io dichiarato</text><path d="M315 175 C380 215 390 280 435 310" class="l"/><text x="335" y="198" class="r">rende visibile</text><rect x="55" y="315" width="260" height="90" rx="18" class="n"/><text x="185" y="370" text-anchor="middle" class="h">Ricerca · registrazione</text><path d="M315 360 L425 360" class="l"/><text x="325" y="340" class="r">documenta</text><rect x="55" y="515" width="260" height="90" rx="18" class="n"/><text x="185" y="570" text-anchor="middle" class="h">Montaggio</text><path d="M315 560 C380 520 395 440 440 410" class="l"/><text x="340" y="535" class="r">costruisce</text><rect x="885" y="120" width="260" height="90" rx="18" class="n"/><text x="1015" y="175" text-anchor="middle" class="h">Intervista-dramma</text><path d="M885 175 C825 215 810 280 765 315" class="l"/><text x="785" y="195" class="r">mette in scena</text><rect x="885" y="315" width="260" height="90" rx="18" class="n"/><text x="1015" y="370" text-anchor="middle" class="h">Prosa di pressione</text><path d="M885 360 L775 360" class="l"/><text x="790" y="340" class="r">intensifica</text><rect x="885" y="515" width="260" height="90" rx="18" class="n"/><text x="1015" y="570" text-anchor="middle" class="h">Generi ibridi</text><path d="M885 560 C825 520 810 440 765 410" class="l"/><text x="795" y="535" class="r">ampliano</text></svg>
