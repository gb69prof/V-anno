<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-labelledby="t d"><title id="t">Conclusione</title><desc id="d">Origine, cultura, mito, storia e forma conducono all’eredità contemporanea dell’appartenenza senza possesso.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#6f7f55"/></marker><style>.n{fill:#fff8e8;stroke:#6f7f55;stroke-width:3}.c{fill:#25352d;stroke:#c6a54b;stroke-width:4}.tx{font:700 22px Georgia,serif;fill:#1f2a25;text-anchor:middle}.ct{font:700 27px Georgia,serif;fill:white;text-anchor:middle}.r{font:700 16px Arial,sans-serif;fill:#b65332;text-anchor:middle}.e{fill:none;stroke:#6f7f55;stroke-width:4;marker-end:url(#a)}</style></defs>
<rect class="c" x="400" y="25" width="400" height="100" rx="22"/><text class="ct" x="600" y="67">FERITA DELL’ORIGINE</text><text class="ct" x="600" y="100">radice necessaria, non pura</text>
<rect class="n" x="60" y="210" width="290" height="100" rx="18"/><text class="tx" x="205" y="250">Cultura</text><text class="tx" x="205" y="282">lavoro comune</text><rect class="n" x="455" y="210" width="290" height="100" rx="18"/><text class="tx" x="600" y="250">Mito</text><text class="tx" x="600" y="282">forme che ritornano</text><rect class="n" x="850" y="210" width="290" height="100" rx="18"/><text class="tx" x="995" y="250">Storia</text><text class="tx" x="995" y="282">eventi irreversibili</text>
<path class="e" d="M500 125L245 205"/><text class="r" x="360" y="160">cerca comunità in</text><path class="e" d="M600 125V205"/><text class="r" x="670" y="160">si comprende col</text><path class="e" d="M700 125L955 205"/><text class="r" x="840" y="160">viene trasformata da</text>
<rect class="n" x="190" y="450" width="320" height="110" rx="18"/><text class="tx" x="350" y="492">Forma</text><text class="tx" x="350" y="525">conoscenza, non salvezza</text><rect class="n" x="690" y="450" width="320" height="110" rx="18"/><text class="tx" x="850" y="492">Responsabilità</text><text class="tx" x="850" y="525">oltre la neutralità</text><path class="e" d="M520 310L390 445"/><text class="r" x="410" y="395">si traduce in</text><path class="e" d="M680 310L810 445"/><text class="r" x="790" y="395">mette in crisi</text>
<rect class="c" x="345" y="700" width="510" height="120" rx="22"/><text class="ct" x="600" y="746">APPARTENENZA SENZA POSSESSO</text><text class="ct" x="600" y="782">radici aperte alla differenza</text><path class="e" d="M350 560L510 695"/><text class="r" x="410" y="640">lascia in eredità</text><path class="e" d="M850 560L690 695"/><text class="r" x="790" y="640">richiede</text>
</svg>
