<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Le opere più significative</title><desc id="d">Sei opere mettono alla prova poesia-racconto, terra ambigua, mito, responsabilità e ritorno impossibile.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#6f7f55"/></marker><style>.n{fill:#fff8e8;stroke:#6f7f55;stroke-width:3}.c{fill:#25352d;stroke:#c6a54b;stroke-width:4}.tx{font:700 21px Georgia,serif;fill:#1f2a25;text-anchor:middle}.ct{font:700 27px Georgia,serif;fill:white;text-anchor:middle}.r{font:700 15px Arial,sans-serif;fill:#b65332;text-anchor:middle}.e{fill:none;stroke:#6f7f55;stroke-width:4;marker-end:url(#a)}</style></defs>
<rect class="c" x="400" y="22" width="400" height="95" rx="22"/><text class="ct" x="600" y="62">APPARTENENZA / PERDITA</text><text class="ct" x="600" y="94">un conflitto, forme diverse</text>
<rect class="n" x="50" y="185" width="290" height="100" rx="18"/><text class="tx" x="195" y="224">Lavorare stanca</text><text class="tx" x="195" y="256">poesia-racconto</text><rect class="n" x="455" y="185" width="290" height="100" rx="18"/><text class="tx" x="600" y="224">Paesi tuoi</text><text class="tx" x="600" y="256">terra non idillica</text><rect class="n" x="860" y="185" width="290" height="100" rx="18"/><text class="tx" x="1005" y="224">Feria d’agosto</text><text class="tx" x="1005" y="256">origine e mito</text>
<path class="e" d="M500 117L240 180"/><text class="r" x="360" y="150">si traduce in</text><path class="e" d="M600 117V180"/><text class="r" x="670" y="150">mette in crisi</text><path class="e" d="M700 117L960 180"/><text class="r" x="835" y="150">si approfondisce in</text>
<rect class="n" x="50" y="420" width="290" height="100" rx="18"/><text class="tx" x="195" y="459">Dialoghi con Leucò</text><text class="tx" x="195" y="491">mito tragico</text><rect class="n" x="455" y="420" width="290" height="100" rx="18"/><text class="tx" x="600" y="459">La casa in collina</text><text class="tx" x="600" y="491">storia e coscienza</text><rect class="n" x="860" y="420" width="290" height="100" rx="18"/><text class="tx" x="1005" y="459">La bella estate</text><text class="tx" x="1005" y="491">iniziazione e ferita</text>
<path class="e" d="M195 285V415"/><text class="r" x="275" y="360">universalizza</text><path class="e" d="M600 285V415"/><text class="r" x="680" y="360">incontra</text><path class="e" d="M1005 285V415"/><text class="r" x="1080" y="360">si incarna in</text>
<rect class="c" x="360" y="700" width="480" height="125" rx="22"/><text class="ct" x="600" y="746">LA LUNA E I FALÒ</text><text class="ct" x="600" y="782">ritorno, mito e storia</text><path class="e" d="M195 520L480 695"/><text class="r" x="315" y="630">confluisce in</text><path class="e" d="M600 520V695"/><text class="r" x="680" y="620">mette alla prova</text><path class="e" d="M1005 520L720 695"/><text class="r" x="890" y="630">confluisce in</text>
</svg>
