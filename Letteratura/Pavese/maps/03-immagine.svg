<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-labelledby="t d"><title id="t">L’immagine del mondo</title><desc id="d">Le prime immagini diventano matrici; la memoria le rivela, il mito le assolutizza, il ritorno ne mostra la perdita e la storia impedisce il rifugio.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#6f7f55"/></marker><style>.n{fill:#fff8e8;stroke:#6f7f55;stroke-width:3}.c{fill:#25352d;stroke:#c6a54b;stroke-width:4}.tx{font:700 22px Georgia,serif;fill:#1f2a25;text-anchor:middle}.ct{font:700 28px Georgia,serif;fill:white;text-anchor:middle}.r{font:700 16px Arial,sans-serif;fill:#b65332;text-anchor:middle}.e{fill:none;stroke:#6f7f55;stroke-width:4;marker-end:url(#a)}</style></defs>
<rect class="c" x="405" y="25" width="390" height="100" rx="22"/><text class="ct" x="600" y="68">ORIGINE PERDUTA</text><text class="ct" x="600" y="100">ma ancora attiva</text>
<rect class="n" x="70" y="200" width="280" height="100" rx="18"/><text class="tx" x="210" y="240">Prime immagini</text><text class="tx" x="210" y="272">formano matrici</text><rect class="n" x="460" y="200" width="280" height="100" rx="18"/><text class="tx" x="600" y="240">Memoria</text><text class="tx" x="600" y="272">rivela tardi</text><rect class="n" x="850" y="200" width="280" height="100" rx="18"/><text class="tx" x="990" y="240">Mito</text><text class="tx" x="990" y="272">rende assoluto</text>
<path class="e" d="M500 125L250 195"/><text class="r" x="355" y="158">si imprime in</text><path class="e" d="M600 125V195"/><text class="r" x="670" y="160">si comprende con</text><path class="e" d="M700 125L950 195"/><text class="r" x="840" y="158">si traduce in</text>
<rect class="n" x="120" y="430" width="300" height="105" rx="18"/><text class="tx" x="270" y="472">Appartenenza</text><text class="tx" x="270" y="504">desiderata, instabile</text><rect class="n" x="450" y="430" width="300" height="105" rx="18"/><text class="tx" x="600" y="472">Ritorno</text><text class="tx" x="600" y="504">rivela la perdita</text><rect class="n" x="780" y="430" width="300" height="105" rx="18"/><text class="tx" x="930" y="472">Storia</text><text class="tx" x="930" y="504">interrompe il rifugio</text>
<path class="e" d="M210 300L260 425"/><text class="r" x="190" y="370">orienta</text><path class="e" d="M600 300V425"/><text class="r" x="665" y="370">rende necessario</text><path class="e" d="M990 300L940 425"/><text class="r" x="1020" y="370">incontra</text>
<rect class="c" x="360" y="690" width="480" height="120" rx="22"/><text class="ct" x="600" y="738">REALISMO + SIMBOLO</text><text class="ct" x="600" y="775">le cose portano profondità</text><path class="e" d="M280 535L500 685"/><text class="r" x="385" y="620">confluisce in</text><path class="e" d="M600 535V685"/><text class="r" x="675" y="620">richiede</text><path class="e" d="M920 535L700 685"/><text class="r" x="815" y="620">mette alla prova</text>
</svg>
