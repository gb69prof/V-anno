<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Sintesi dei sei movimenti</title><desc id="d">La catena parte dal mondo precedente, attraversa fratture, immagine del mondo, poetica e opere, e arriva all’eredità dell’appartenenza senza possesso.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#c6a54b"/></marker><style>.n{fill:#25352d;stroke:#c6a54b;stroke-width:4}.tx{font:700 25px Georgia,serif;fill:white;text-anchor:middle}.r{font:700 18px Arial,sans-serif;fill:#b65332;text-anchor:middle}.e{fill:none;stroke:#c6a54b;stroke-width:5;marker-end:url(#a)}</style></defs>
<rect class="n" x="70" y="50" width="360" height="110" rx="22"/><text class="tx" x="250" y="94">1 · MONDO PRECEDENTE</text><text class="tx" x="250" y="128">retorica / realtà</text><rect class="n" x="770" y="50" width="360" height="110" rx="22"/><text class="tx" x="950" y="94">2 · FRATTURE</text><text class="tx" x="950" y="128">origine, confino, guerra</text><path class="e" d="M430 105H765"/><text class="r" x="600" y="88">viene messo in crisi da</text>
<rect class="n" x="770" y="285" width="360" height="110" rx="22"/><text class="tx" x="950" y="329">3 · IMMAGINE</text><text class="tx" x="950" y="363">mito, memoria, perdita</text><path class="e" d="M950 160V280"/><text class="r" x="1040" y="225">modificano</text>
<rect class="n" x="70" y="285" width="360" height="110" rx="22"/><text class="tx" x="250" y="329">4 · POETICA</text><text class="tx" x="250" y="363">racconto, immagine, ritmo</text><path class="e" d="M770 340H435"/><text class="r" x="600" y="322">si traduce in</text>
<rect class="n" x="70" y="520" width="360" height="110" rx="22"/><text class="tx" x="250" y="564">5 · OPERE</text><text class="tx" x="250" y="598">forma messa alla prova</text><path class="e" d="M250 395V515"/><text class="r" x="340" y="460">si verifica nelle</text>
<rect class="n" x="770" y="520" width="360" height="110" rx="22"/><text class="tx" x="950" y="564">6 · EREDITÀ</text><text class="tx" x="950" y="598">appartenere senza possedere</text><path class="e" d="M430 575H765"/><text class="r" x="600" y="557">confluisce in</text>
<rect class="n" x="390" y="750" width="420" height="115" rx="22"/><text class="tx" x="600" y="795">DOMANDA VIVA</text><text class="tx" x="600" y="830">come abitare le radici?</text><path class="e" d="M950 630L720 745"/><text class="r" x="860" y="705">riapre</text>
</svg>
