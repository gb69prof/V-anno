<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="t d"><title id="t">La poetica</title><desc id="d">La visione del mondo diventa poesia-racconto, immagine strutturale, lingua parlata costruita, ritmo del ritorno e narratore testimone.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#6f7f55"/></marker><style>.n{fill:#fff8e8;stroke:#6f7f55;stroke-width:3}.c{fill:#25352d;stroke:#c6a54b;stroke-width:4}.tx{font:700 22px Georgia,serif;fill:#1f2a25;text-anchor:middle}.ct{font:700 27px Georgia,serif;fill:white;text-anchor:middle}.r{font:700 16px Arial,sans-serif;fill:#b65332;text-anchor:middle}.e{fill:none;stroke:#6f7f55;stroke-width:4;marker-end:url(#a)}</style></defs>
<rect class="c" x="410" y="25" width="380" height="100" rx="22"/><text class="ct" x="600" y="66">FORMA NECESSARIA</text><text class="ct" x="600" y="99">dire la profondità del reale</text>
<rect class="n" x="50" y="210" width="280" height="100" rx="18"/><text class="tx" x="190" y="250">Poesia-racconto</text><text class="tx" x="190" y="282">scene nel verso</text><rect class="n" x="460" y="210" width="280" height="100" rx="18"/><text class="tx" x="600" y="250">Immagine</text><text class="tx" x="600" y="282">struttura il senso</text><rect class="n" x="870" y="210" width="280" height="100" rx="18"/><text class="tx" x="1010" y="250">Lingua</text><text class="tx" x="1010" y="282">parlata e costruita</text>
<path class="e" d="M500 125L230 205"/><text class="r" x="355" y="160">si racconta con</text><path class="e" d="M600 125V205"/><text class="r" x="672" y="160">si incarna in</text><path class="e" d="M700 125L970 205"/><text class="r" x="842" y="160">si controlla con</text>
<rect class="n" x="180" y="445" width="320" height="110" rx="18"/><text class="tx" x="340" y="487">Ritmo e monotonia</text><text class="tx" x="340" y="520">ritornano sui nuclei</text><rect class="n" x="700" y="445" width="320" height="110" rx="18"/><text class="tx" x="860" y="487">Narratore testimone</text><text class="tx" x="860" y="520">osserva senza dominare</text><path class="e" d="M500 310L375 440"/><text class="r" x="405" y="390">produce</text><path class="e" d="M700 310L825 440"/><text class="r" x="790" y="390">genera</text>
<rect class="c" x="350" y="685" width="500" height="115" rx="22"/><text class="ct" x="600" y="730">CONOSCENZA SENZA REDENZIONE</text><text class="ct" x="600" y="765">dare un nome, non cancellare</text><path class="e" d="M340 555L510 680"/><text class="r" x="405" y="625">confluisce in</text><path class="e" d="M860 555L690 680"/><text class="r" x="790" y="625">rende visibile</text>
</svg>
