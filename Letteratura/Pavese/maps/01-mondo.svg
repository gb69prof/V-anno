<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="t d"><title id="t">Il mondo precedente</title><desc id="d">Il fascismo e la crisi delle forme ricevute conducono Pavese verso Torino, la cultura americana tradotta e una lingua concreta.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#6f7f55"/></marker><style>.n{fill:#fff8e8;stroke:#6f7f55;stroke-width:3}.c{fill:#25352d;stroke:#c6a54b;stroke-width:4}.tx{font:700 24px Georgia,serif;fill:#1f2a25;text-anchor:middle}.ct{font:700 28px Georgia,serif;fill:white;text-anchor:middle}.r{font:700 17px Arial,sans-serif;fill:#b65332;text-anchor:middle}.e{fill:none;stroke:#6f7f55;stroke-width:4;marker-end:url(#a)}</style></defs>
<rect class="c" x="410" y="35" width="380" height="100" rx="22"/><text class="ct" x="600" y="78">MONDO RICEVUTO</text><text class="ct" x="600" y="110">unità proclamata, fratture reali</text>
<rect class="n" x="75" y="220" width="285" height="100" rx="20"/><text class="tx" x="218" y="260">Fascismo</text><text class="tx" x="218" y="290">controllo e retorica</text><rect class="n" x="458" y="220" width="285" height="100" rx="20"/><text class="tx" x="600" y="260">Torino</text><text class="tx" x="600" y="290">scuola, industria, editoria</text><rect class="n" x="840" y="220" width="285" height="100" rx="20"/><text class="tx" x="982" y="260">Forme letterarie</text><text class="tx" x="982" y="290">lirica o racconto?</text>
<path class="e" d="M500 135L250 215"/><text class="r" x="355" y="170">produce</text><path class="e" d="M600 135V215"/><text class="r" x="670" y="180">si concentra in</text><path class="e" d="M700 135L950 215"/><text class="r" x="845" y="170">mette in crisi</text>
<rect class="n" x="180" y="455" width="320" height="110" rx="20"/><text class="tx" x="340" y="500">America tradotta</text><text class="tx" x="340" y="533">energia e concretezza</text><rect class="n" x="700" y="455" width="320" height="110" rx="20"/><text class="tx" x="860" y="500">Poesia-racconto</text><text class="tx" x="860" y="533">scene, corpi, lavoro</text>
<path class="e" d="M520 320L375 450"/><text class="r" x="410" y="390">apre a</text><path class="e" d="M900 320L875 450"/><text class="r" x="940" y="390">richiede</text>
<rect class="c" x="375" y="665" width="450" height="110" rx="22"/><text class="ct" x="600" y="708">NUOVA LINGUA</text><text class="ct" x="600" y="742">concreta, ritmica, antiretorica</text><path class="e" d="M340 565L500 660"/><text class="r" x="400" y="630">confluisce in</text><path class="e" d="M860 565L700 660"/><text class="r" x="800" y="630">si traduce in</text>
</svg>
