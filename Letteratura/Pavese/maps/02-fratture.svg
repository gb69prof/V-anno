<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="t d"><title id="t">Le fratture della vita</title><desc id="d">Doppia origine, confino, desiderio, guerra e lavoro editoriale trasformano l’appartenenza in un problema di forma e responsabilità.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#6f7f55"/></marker><style>.n{fill:#fff8e8;stroke:#6f7f55;stroke-width:3}.c{fill:#25352d;stroke:#c6a54b;stroke-width:4}.tx{font:700 23px Georgia,serif;fill:#1f2a25;text-anchor:middle}.ct{font:700 28px Georgia,serif;fill:white;text-anchor:middle}.r{font:700 17px Arial,sans-serif;fill:#b65332;text-anchor:middle}.e{fill:none;stroke:#6f7f55;stroke-width:4;marker-end:url(#a)}</style></defs>
<rect class="c" x="420" y="30" width="360" height="95" rx="22"/><text class="ct" x="600" y="70">FRATTURE</text><text class="ct" x="600" y="102">esperienze trasformate</text>
<rect class="n" x="60" y="200" width="270" height="100" rx="18"/><text class="tx" x="195" y="240">Langhe / Torino</text><text class="tx" x="195" y="272">origine e distanza</text><rect class="n" x="465" y="200" width="270" height="100" rx="18"/><text class="tx" x="600" y="240">Confino</text><text class="tx" x="600" y="272">isolamento</text><rect class="n" x="870" y="200" width="270" height="100" rx="18"/><text class="tx" x="1005" y="240">Desiderio</text><text class="tx" x="1005" y="272">riconoscimento mancato</text>
<path class="e" d="M500 125L230 195"/><text class="r" x="350" y="160">si divide tra</text><path class="e" d="M600 125V195"/><text class="r" x="665" y="164">si acuisce nel</text><path class="e" d="M700 125L970 195"/><text class="r" x="835" y="160">si rivela nel</text>
<rect class="n" x="170" y="420" width="300" height="105" rx="18"/><text class="tx" x="320" y="462">Guerra</text><text class="tx" x="320" y="494">coscienza / azione</text><rect class="n" x="730" y="420" width="300" height="105" rx="18"/><text class="tx" x="880" y="462">Einaudi</text><text class="tx" x="880" y="494">comunità del lavoro</text><path class="e" d="M535 300L360 415"/><text class="r" x="415" y="370">mette alla prova</text><path class="e" d="M665 300L840 415"/><text class="r" x="780" y="370">cerca forma in</text>
<rect class="c" x="375" y="660" width="450" height="120" rx="22"/><text class="ct" x="600" y="708">PROBLEMA DELL’APPARTENENZA</text><text class="ct" x="600" y="747">mestiere, soglia, responsabilità</text><path class="e" d="M320 525L500 655"/><text class="r" x="390" y="610">diventa</text><path class="e" d="M880 525L700 655"/><text class="r" x="810" y="610">tenta di riparare</text>
</svg>
