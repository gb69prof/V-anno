<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">L’immagine del mondo pasoliniana</title><desc id="d">Il neocapitalismo produce desideri e mutazione; il sacro e la contraddizione oppongono una resistenza.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#8d3028"/></marker><style>.b{fill:#fffaf1;stroke:#201b18;stroke-width:2}.c{fill:#201b18;stroke:#a12d24;stroke-width:5}.h{font:700 23px Georgia;fill:#201b18}.w{font:700 27px Georgia;fill:#f2eadc}.s{font:17px system-ui;fill:#514940}.l{font:700 15px system-ui;fill:#8d3028}.e{stroke:#8d3028;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="760" fill="#f2eadc"/>
<rect class="b" x="45" y="65" width="300" height="120" rx="10"/><text class="h" x="70" y="108">Neocapitalismo</text><text class="s" x="70" y="140">il mercato entra nella vita</text><text class="s" x="70" y="165">e produce bisogni</text><rect class="b" x="450" y="55" width="300" height="130" rx="10"/><text class="h" x="475" y="98">Merci e televisione</text><text class="s" x="475" y="130">seducono e normalizzano</text><text class="s" x="475" y="155">un solo modello desiderabile</text><rect class="b" x="855" y="65" width="300" height="120" rx="10"/><text class="h" x="880" y="108">Nuovo fascismo</text><text class="s" x="880" y="140">non identico al regime</text><text class="s" x="880" y="165">più profondo nell’omologare</text>
<rect class="b" x="65" y="330" width="310" height="120" rx="10"/><text class="h" x="90" y="373">Lucciole</text><text class="s" x="90" y="405">perdita ecologica</text><text class="s" x="90" y="430">e culturale resa visibile</text><rect class="c" x="425" y="300" width="350" height="170" rx="12"/><text class="w" x="600" y="356" text-anchor="middle">MUTAZIONE</text><text class="w" x="600" y="389" text-anchor="middle">ANTROPOLOGICA</text><text class="s" x="600" y="430" fill="#f2eadc" text-anchor="middle">cambiano corpi e desideri</text><rect class="b" x="825" y="330" width="310" height="120" rx="10"/><text class="h" x="850" y="373">Sacro materiale</text><text class="s" x="850" y="405">corpo · morte · paesaggio</text><text class="s" x="850" y="430">resistono alla merce</text>
<rect class="b" x="245" y="590" width="310" height="115" rx="10"/><text class="h" x="270" y="632">Contraddizione</text><text class="s" x="270" y="665">marxismo e sacro</text><text class="s" x="270" y="690">libertà e mercato</text><rect class="b" x="650" y="590" width="310" height="115" rx="10"/><text class="h" x="675" y="632">Visione tragica</text><text class="s" x="675" y="665">esigenze giuste confliggono</text><text class="s" x="675" y="690">senza sintesi rassicurante</text>
<path class="e" d="M345 125H440"/><text class="l" x="392" y="111" text-anchor="middle">agisce tramite</text><path class="e" d="M750 125H845"/><text class="l" x="797" y="111" text-anchor="middle">si traduce in</text><path class="e" d="M375 390H415"/><text class="l" x="395" y="374" text-anchor="middle">rende visibile</text><path class="e" d="M825 390H785"/><text class="l" x="805" y="374" text-anchor="middle">resiste a</text><path class="e" d="M530 480L450 580"/><text class="l" x="465" y="535" text-anchor="middle">viene pensata con</text><path class="e" d="M670 480L750 580"/><text class="l" x="735" y="535" text-anchor="middle">produce</text></svg>
