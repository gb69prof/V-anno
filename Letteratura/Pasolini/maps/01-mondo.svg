<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">Il mondo precedente di Pasolini</title><desc id="d">Dalla pluralità italiana alla critica del consumismo attraverso Friuli, borgate, Gramsci e boom economico.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#8d3028"/></marker><style>.b{fill:#fffaf1;stroke:#201b18;stroke-width:2}.c{fill:#201b18;stroke:#a12d24;stroke-width:5}.h{font:700 24px Georgia;fill:#201b18}.w{font:700 28px Georgia;fill:#f2eadc}.s{font:17px system-ui;fill:#514940}.l{font:700 15px system-ui;fill:#8d3028}.e{stroke:#8d3028;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="760" fill="#f2eadc"/>
<rect class="b" x="55" y="70" width="290" height="120" rx="10"/><text class="h" x="80" y="113">Italia plurale</text><text class="s" x="80" y="145">dialetti · campagne · città</text><text class="s" x="80" y="170">culture non uniformi</text>
<rect class="b" x="455" y="55" width="290" height="135" rx="10"/><text class="h" x="480" y="100">Fascismo</text><text class="s" x="480" y="132">disciplina lingua e corpi</text><text class="s" x="480" y="157">ma non cancella le culture</text>
<rect class="b" x="855" y="70" width="290" height="120" rx="10"/><text class="h" x="880" y="113">Boom economico</text><text class="s" x="880" y="145">industria · TV · consumi</text><text class="s" x="880" y="170">nuovo modello di vita</text>
<rect class="b" x="85" y="330" width="280" height="120" rx="10"/><text class="h" x="110" y="375">Friuli</text><text class="s" x="110" y="407">lingua materna e sacro</text><text class="s" x="110" y="432">origine trasformata in mito</text>
<rect class="c" x="430" y="300" width="340" height="170" rx="12"/><text class="w" x="600" y="365" text-anchor="middle">MONDO PRECEDENTE</text><text class="s" x="600" y="403" fill="#f2eadc" text-anchor="middle">misura critica del nuovo</text><text class="s" x="600" y="430" fill="#f2eadc" text-anchor="middle">non paradiso da restaurare</text>
<rect class="b" x="835" y="330" width="280" height="120" rx="10"/><text class="h" x="860" y="375">Borgate</text><text class="s" x="860" y="407">gergo e codici autonomi</text><text class="s" x="860" y="432">vitalità dentro l’esclusione</text>
<rect class="b" x="265" y="590" width="290" height="115" rx="10"/><text class="h" x="290" y="632">Gramsci</text><text class="s" x="290" y="665">egemonia e subalternità</text><text class="s" x="290" y="690">storicizzano il popolo</text>
<rect class="b" x="655" y="590" width="290" height="115" rx="10"/><text class="h" x="680" y="632">Sviluppo ≠ progresso</text><text class="s" x="680" y="665">più beni non garantiscono</text><text class="s" x="680" y="690">più autonomia umana</text>
<path class="e" d="M345 130H445"/><text class="l" x="395" y="116" text-anchor="middle">tenta di uniformare</text><path class="e" d="M745 130H845"/><text class="l" x="795" y="116" text-anchor="middle">cede il passo a</text>
<path class="e" d="M365 390H420"/><text class="l" x="390" y="374" text-anchor="middle">custodisce</text><path class="e" d="M835 390H780"/><text class="l" x="807" y="374" text-anchor="middle">custodisce</text>
<path class="e" d="M535 480L455 580"/><text class="l" x="470" y="535" text-anchor="middle">viene letto con</text><path class="e" d="M665 480L745 580"/><text class="l" x="730" y="535" text-anchor="middle">si traduce in</text>
</svg>
