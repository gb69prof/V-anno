<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">La catena interpretativa di Pasolini</title><desc id="d">I sei movimenti conducono dal mondo plurale alla domanda contemporanea su libertà e obbedienza.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#8d3028"/></marker><style>.b{fill:#fffaf1;stroke:#201b18;stroke-width:2}.c{fill:#201b18;stroke:#a12d24;stroke-width:5}.h{font:700 22px Georgia;fill:#201b18}.w{font:700 27px Georgia;fill:#f2eadc}.s{font:16px system-ui;fill:#514940}.l{font:700 15px system-ui;fill:#8d3028}.e{stroke:#8d3028;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="760" fill="#f2eadc"/>
<rect class="b" x="45" y="65" width="300" height="120" rx="10"/><text class="h" x="70" y="108">1 · Mondo precedente</text><text class="s" x="70" y="140">pluralità culturale</text><text class="s" x="70" y="165">come termine di confronto</text><rect class="b" x="450" y="55" width="300" height="130" rx="10"/><text class="h" x="475" y="98">2 · Fratture</text><text class="s" x="475" y="130">la diversità colloca l’autore</text><text class="s" x="475" y="155">dentro e fuori le comunità</text><rect class="b" x="855" y="65" width="300" height="120" rx="10"/><text class="h" x="880" y="108">3 · Immagine</text><text class="s" x="880" y="140">il nuovo potere forma</text><text class="s" x="880" y="165">desideri e identità</text>
<rect class="b" x="65" y="330" width="310" height="120" rx="10"/><text class="h" x="90" y="373">4 · Poetica</text><text class="s" x="90" y="405">cambiare linguaggio</text><text class="s" x="90" y="430">per rendere visibile il reale</text><rect class="c" x="425" y="300" width="350" height="170" rx="12"/><text class="w" x="600" y="352" text-anchor="middle">EREDITÀ</text><text class="w" x="600" y="388" text-anchor="middle">INATTUALE</text><text class="s" x="600" y="430" fill="#f2eadc" text-anchor="middle">metodo critico, non oracolo</text><rect class="b" x="825" y="330" width="310" height="120" rx="10"/><text class="h" x="850" y="373">5 · Opere</text><text class="s" x="850" y="405">ogni forma verifica</text><text class="s" x="850" y="430">e corregge la diagnosi</text>
<rect class="b" x="245" y="590" width="310" height="115" rx="10"/><text class="h" x="270" y="632">6 · Conclusione</text><text class="s" x="270" y="665">attualizzare e criticare</text><text class="s" x="270" y="690">senza devozione</text><rect class="b" x="650" y="590" width="310" height="115" rx="10"/><text class="h" x="675" y="632">Domanda aperta</text><text class="s" x="675" y="665">libertà conquistata</text><text class="s" x="675" y="690">o obbedienza interiorizzata?</text>
<path class="e" d="M345 125H440"/><text class="l" x="392" y="111" text-anchor="middle">entra in</text><path class="e" d="M750 125H845"/><text class="l" x="797" y="111" text-anchor="middle">produce uno sguardo</text><path class="e" d="M850 185L735 290"/><text class="l" x="790" y="243" text-anchor="middle">esige</text><path class="e" d="M375 390H415"/><text class="l" x="395" y="374" text-anchor="middle">confluisce</text><path class="e" d="M825 390H785"/><text class="l" x="805" y="374" text-anchor="middle">verifica</text><path class="e" d="M530 480L450 580"/><text class="l" x="465" y="535" text-anchor="middle">riapre</text><path class="e" d="M555 648H640"/><text class="l" x="598" y="632" text-anchor="middle">conduce alla</text></svg>
