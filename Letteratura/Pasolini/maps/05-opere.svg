<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Le opere decisive di Pasolini</title><desc id="d">Le opere come soglie di una ricerca che passa dall’origine linguistica all’allegoria del potere.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#8d3028"/></marker><style>.b{fill:#fffaf1;stroke:#201b18;stroke-width:2}.c{fill:#201b18;stroke:#a12d24;stroke-width:5}.h{font:700 22px Georgia;fill:#201b18}.w{font:700 28px Georgia;fill:#f2eadc}.s{font:16px system-ui;fill:#514940}.l{font:700 15px system-ui;fill:#8d3028}.e{stroke:#8d3028;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="760" fill="#f2eadc"/>
<rect class="b" x="45" y="65" width="300" height="120" rx="10"/><text class="h" x="70" y="108">Poesie a Casarsa</text><text class="s" x="70" y="140">fondazione dell’origine</text><text class="s" x="70" y="165">friulano come lingua assoluta</text><rect class="b" x="450" y="55" width="300" height="130" rx="10"/><text class="h" x="475" y="98">Le ceneri di Gramsci</text><text class="s" x="475" y="130">la contraddizione diventa</text><text class="s" x="475" y="155">forma poetica e civile</text><rect class="b" x="855" y="65" width="300" height="120" rx="10"/><text class="h" x="880" y="108">Romanzi romani</text><text class="s" x="880" y="140">borgate e plurilinguismo</text><text class="s" x="880" y="165">senza riscatto edificante</text>
<rect class="b" x="65" y="330" width="310" height="120" rx="10"/><text class="h" x="90" y="373">Accattone · Vangelo</text><text class="s" x="90" y="405">corpi reali e stile sacrale</text><text class="s" x="90" y="430">pensano per immagini</text><rect class="c" x="425" y="300" width="350" height="170" rx="12"/><text class="w" x="600" y="365" text-anchor="middle">OPERE-SOGLIA</text><text class="s" x="600" y="403" fill="#f2eadc" text-anchor="middle">la stessa domanda cambia forma</text><text class="s" x="600" y="430" fill="#f2eadc" text-anchor="middle">e scopre nuovi oggetti</text><rect class="b" x="825" y="330" width="310" height="120" rx="10"/><text class="h" x="850" y="373">Scritti corsari</text><text class="s" x="850" y="405">diagnosi militante</text><text class="s" x="850" y="430">della mutazione italiana</text>
<rect class="b" x="245" y="590" width="310" height="115" rx="10"/><text class="h" x="270" y="632">Trilogia e abiura</text><text class="s" x="270" y="665">corpi liberati e poi</text><text class="s" x="270" y="690">recuperati dal mercato</text><rect class="b" x="650" y="590" width="310" height="115" rx="10"/><text class="h" x="675" y="632">Salò · Petrolio</text><text class="s" x="675" y="665">potere, sessualità e corpo</text><text class="s" x="675" y="690">in allegoria e frammento</text>
<path class="e" d="M345 125H440"/><text class="l" x="392" y="111" text-anchor="middle">si storicizza in</text><path class="e" d="M750 125H845"/><text class="l" x="797" y="111" text-anchor="middle">entra nei</text><path class="e" d="M375 390H415"/><text class="l" x="395" y="374" text-anchor="middle">diventa</text><path class="e" d="M825 390H785"/><text class="l" x="805" y="374" text-anchor="middle">viene letta da</text><path class="e" d="M530 480L450 580"/><text class="l" x="465" y="535" text-anchor="middle">mette in crisi</text><path class="e" d="M670 480L750 580"/><text class="l" x="735" y="535" text-anchor="middle">si radicalizza in</text></svg>
