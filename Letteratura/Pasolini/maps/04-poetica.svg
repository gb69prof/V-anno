<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">La poetica di Pasolini</title><desc id="d">La passione per la realtà produce sperimentazione, contaminazione e cinema di poesia.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#8d3028"/></marker><style>.b{fill:#fffaf1;stroke:#201b18;stroke-width:2}.c{fill:#201b18;stroke:#a12d24;stroke-width:5}.h{font:700 23px Georgia;fill:#201b18}.w{font:700 28px Georgia;fill:#f2eadc}.s{font:17px system-ui;fill:#514940}.l{font:700 15px system-ui;fill:#8d3028}.e{stroke:#8d3028;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="760" fill="#f2eadc"/>
<rect class="b" x="45" y="65" width="300" height="120" rx="10"/><text class="h" x="70" y="108">Passione per il reale</text><text class="s" x="70" y="140">corpi · lingue · paesaggi</text><text class="s" x="70" y="165">non sono mai neutrali</text><rect class="b" x="450" y="55" width="300" height="130" rx="10"/><text class="h" x="475" y="98">Friulano e gergo</text><text class="s" x="475" y="130">lingue costruite dall’autore</text><text class="s" x="475" y="155">contro lo standard unico</text><rect class="b" x="855" y="65" width="300" height="120" rx="10"/><text class="h" x="880" y="108">Poemetto civile</text><text class="s" x="880" y="140">canto · ragionamento</text><text class="s" x="880" y="165">autobiografia · storia</text>
<rect class="b" x="65" y="330" width="310" height="120" rx="10"/><text class="h" x="90" y="373">Plurilinguismo</text><text class="s" x="90" y="405">più punti di vista</text><text class="s" x="90" y="430">restano in conflitto</text><rect class="c" x="425" y="300" width="350" height="170" rx="12"/><text class="w" x="600" y="365" text-anchor="middle">CONTAMINAZIONE</text><text class="s" x="600" y="403" fill="#f2eadc" text-anchor="middle">alto e basso · sacro e profano</text><text class="s" x="600" y="430" fill="#f2eadc" text-anchor="middle">le arti si correggono a vicenda</text><rect class="b" x="825" y="330" width="310" height="120" rx="10"/><text class="h" x="850" y="373">Lingua della realtà</text><text class="s" x="850" y="405">il cinema usa cose e corpi</text><text class="s" x="850" y="430">ma li seleziona e monta</text>
<rect class="b" x="245" y="590" width="310" height="115" rx="10"/><text class="h" x="270" y="632">Cinema di poesia</text><text class="s" x="270" y="665">lo stile diventa visibile</text><text class="s" x="270" y="690">lo sguardo non è trasparente</text><rect class="b" x="650" y="590" width="310" height="115" rx="10"/><text class="h" x="675" y="632">Sistema intermediale</text><text class="s" x="675" y="665">pittura · musica · teatro</text><text class="s" x="675" y="690">confluiscono nel cinema</text>
<path class="e" d="M345 125H440"/><text class="l" x="392" y="111" text-anchor="middle">cerca</text><path class="e" d="M750 125H845"/><text class="l" x="797" y="111" text-anchor="middle">si amplia nel</text><path class="e" d="M375 390H415"/><text class="l" x="395" y="374" text-anchor="middle">produce</text><path class="e" d="M825 390H785"/><text class="l" x="805" y="374" text-anchor="middle">confluisce in</text><path class="e" d="M530 480L450 580"/><text class="l" x="465" y="535" text-anchor="middle">si traduce in</text><path class="e" d="M670 480L750 580"/><text class="l" x="735" y="535" text-anchor="middle">organizza</text></svg>
