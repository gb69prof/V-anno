<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Le fratture di Pasolini</title><desc id="d">Le esperienze biografiche diventano forme e posizioni critiche senza determinare automaticamente le opere.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#8d3028"/></marker><style>.b{fill:#fffaf1;stroke:#201b18;stroke-width:2}.c{fill:#201b18;stroke:#a12d24;stroke-width:5}.h{font:700 23px Georgia;fill:#201b18}.w{font:700 28px Georgia;fill:#f2eadc}.s{font:17px system-ui;fill:#514940}.l{font:700 15px system-ui;fill:#8d3028}.e{stroke:#8d3028;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="760" fill="#f2eadc"/>
<rect class="b" x="45" y="65" width="300" height="120" rx="10"/><text class="h" x="70" y="108">Nomadismo e famiglia</text><text class="s" x="70" y="140">autorità paterna</text><text class="s" x="70" y="165">origine materna friulana</text>
<rect class="b" x="450" y="55" width="300" height="130" rx="10"/><text class="h" x="475" y="98">Porzûs · 1945</text><text class="s" x="475" y="130">morte del fratello Guido</text><text class="s" x="475" y="155">ferita nel comunismo</text>
<rect class="b" x="855" y="65" width="300" height="120" rx="10"/><text class="h" x="880" y="108">Scandalo · 1949</text><text class="s" x="880" y="140">lavoro e partito perduti</text><text class="s" x="880" y="165">diversità trasformata in colpa</text>
<rect class="b" x="70" y="330" width="300" height="120" rx="10"/><text class="h" x="95" y="373">Esilio a Roma</text><text class="s" x="95" y="405">povertà e declassamento</text><text class="s" x="95" y="430">incontro con le borgate</text>
<rect class="c" x="430" y="300" width="340" height="170" rx="12"/><text class="w" x="600" y="365" text-anchor="middle">FRATTURE</text><text class="s" x="600" y="403" fill="#f2eadc" text-anchor="middle">l’esperienza diventa forma</text><text class="s" x="600" y="430" fill="#f2eadc" text-anchor="middle">non causa automatica</text>
<rect class="b" x="830" y="330" width="300" height="120" rx="10"/><text class="h" x="855" y="373">Processi e polemiche</text><text class="s" x="855" y="405">i confini del dicibile</text><text class="s" x="855" y="430">diventano lotta pubblica</text>
<rect class="b" x="245" y="590" width="310" height="115" rx="10"/><text class="h" x="270" y="632">Mutazione delle borgate</text><text class="s" x="270" y="665">si spezza l’oggetto d’amore</text><text class="s" x="270" y="690">nasce la voce corsara</text>
<rect class="b" x="650" y="590" width="310" height="115" rx="10"/><text class="h" x="675" y="632">Ostia · 1975</text><text class="s" x="675" y="665">fatti, dubbi e simboli</text><text class="s" x="675" y="690">devono restare distinti</text>
<path class="e" d="M345 125H440"/><text class="l" x="392" y="111" text-anchor="middle">viene spezzato da</text><path class="e" d="M750 125H845"/><text class="l" x="797" y="111" text-anchor="middle">si aggrava con</text><path class="e" d="M370 390H420"/><text class="l" x="395" y="374" text-anchor="middle">confluisce in</text><path class="e" d="M830 390H780"/><text class="l" x="805" y="374" text-anchor="middle">rende pubbliche</text><path class="e" d="M530 480L450 580"/><text class="l" x="465" y="535" text-anchor="middle">mette in crisi</text><path class="e" d="M670 480L750 580"/><text class="l" x="735" y="535" text-anchor="middle">richiede metodo</text></svg>
